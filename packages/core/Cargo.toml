[package]
name = "gp100-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Núcleo do GP-100 NextGen Editor: modelo de dados, presets .prst, codec do protocolo de fio e transporte (mock/real)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# transporte REAL (H1): midir = WinMM/ALSA/CoreMIDI com SysEx completo.
# OPCIONAL: o build default (mock) não baixa nem compila nada de I/O real
# (política de hardware, ADR-4/ADR-5).
midir = { version = "0.10", optional = true }

[features]
default = []
# transporte com device REAL (USB-MIDI). Mock é o default (política de hardware).
# H1 = leitura real; ESCRITA real só pós-H2 (WRITE_VERIFIED, BLOCKERS §4).
real-device = ["dep:midir"]
# WRITE_VERIFIED (ADR-5): permite frame MUTANTE no device real. É o gate H2.
#
# DEPENDE de `real-device` de propósito: escrever sem transporte real não
# tem sentido, e uma flag de escrita que ligasse independente do
# transporte seria um caminho aberto. Sem o `?`, `--features write-verified`
# puxa `real-device` (e o `midir`) junto — o build que pode escrever é
# sempre um build que também tem o transporte, por construção.
#
# Default OFF, e o default é o que segura o H1: o binário de campo do gate
# de leitura não tem como mandar escrita.
write-verified = ["real-device"]
