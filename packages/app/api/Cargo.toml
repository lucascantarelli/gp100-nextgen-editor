# WORKSPACE PRÓPRIO (ADR-7): o tauri-cli exige que o crate do Tauri seja
# membro do workspace cargo no qual resolve — se apenas excluído da raiz,
# `tauri build` morre em Option::unwrap() (rust.rs). Independente da raiz,
# ele se resolve sozinho; o raiz também o exclui (coerência explícita).
[workspace]

[package]
name = "gp100-ui"
version = "0.1.0"
edition = "2021"
description = "Backend desktop (Tauri 2) do GP-100 NextGen Editor — commands de device sobre o gp100-core."
publish = false

# FORA do workspace gnu (ADR-7): Tauri 2 exige MSVC no Windows. Usa as MESMAS
# versões de deps do workspace (pinadas aqui por decisão deliberada; drift de
# versão é review/CI). Toolchain de dev/campo da UI: stable-msvc.

[lib]
name = "gp100_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gp100-core = { path = "../../core" }
# A CASCA da biblioteca (ADR-9): o `gp100-library` mora no workspace raiz
# (gnu, testado nas 3 plataformas) e este crate so delega. Nenhuma regra de
# armazenamento mora aqui — e por isso o `rusqlite` nao entra no MSVC.
gp100-library = { path = "../../library" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# **O aparelho é o default (Era Hardware, 09/10/2026 — issue #165).** O shell
# nativo de dev (`tauri dev`) e o build saem com o RealDevice LIGADO: o dado
# vem do GP-100, não de mock. Para um shell SEM transporte algum (backend
# `Desligado` por compilação), use `--no-default-features`. O mock de UI é o
# fallback do navegador (declarado, só fora do webview) e os testes usam o
# `MockDevice` direto no harness.
default = ["real-device"]
# custom-protocol: ligada pelo `tauri build` (assets de produção em file://).
custom-protocol = ["tauri/custom-protocol"]
real-device = ["gp100-core/real-device"]
# Espelha a do core: habilita a ESCRITA num device real (ADR-5). Fica separada
# da `real-device` de propósito — a inversão de default do app (#165) NÃO
# abre escrita: sem esta feature, qualquer escrita é recusada antes do driver.
write-verified = ["gp100-core/write-verified"]

[lints.rust]
missing_docs = "deny"
