[package]
name = "gp100-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI do GP-100 NextGen Editor (device mock por default; --real exige dupla confirmação)"

[[bin]]
name = "gp100-cli"
path = "src/main.rs"

[dependencies]
gp100-core = { path = "../core" }

[features]
default = []
# Binário de CAMPO do H1: habilita o RealDevice do core e desbloqueia --real
# (sempre acompanhado de --i-know-what-im-doing; leitura real = H1, escrita
# real segue bloqueada até H2/WRITE_VERIFIED). Build:
#   cargo build --release -p gp100-cli --features real-device
real-device = ["gp100-core/real-device"]

[dev-dependencies]
serde_json.workspace = true
