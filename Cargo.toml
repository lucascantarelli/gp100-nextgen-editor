[workspace]
resolver = "2"
members = ["packages/core", "packages/cli"]
exclude = ["packages/app/api"]
# O crate do Tauri (gp100-ui, em packages/app/api) fica FORA do workspace:
# o Tauri 2 exige toolchain MSVC no Windows e o workspace é pinado em
# windows-gnu (host/campo de dev). Build de dev/campo do shell:
# `cargo +stable-msvc build` dentro de packages/app/api — validado na CI
# (job ui-rust no runner Windows com MSVC). Ver ADR-7 (DECISIONS.md).

[workspace.package]
version = "0.2.0-rc.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
