name: build-front
description: >
  Front packages/app/ui: build (tsc + vite). Pré-requisito: setup-node-pnpm já
  rodou (deps congeladas). Nasce daqui o ui/dist que alimenta o shell
  (ui-rust/smoke). Lint e coverage moram no job `front-gate` (issue #50) —
  rodar o gate também aqui só duplicaria custo.
runs:
  using: composite
  steps:
    - name: Build (tsc + vite)
      shell: bash
      working-directory: packages/app/ui
      run: pnpm build
