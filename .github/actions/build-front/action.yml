name: build-front
description: >
  Front packages/app/ui completo: deps congeladas + lint + vitest + build
  (tsc + vite). Usado pelo job front (validação) e pelo ui-rust/release
  (generate_context! embute app/ui/dist). Pré-requisito: setup-node-pnpm
  já rodou.
runs:
  using: composite
  steps:
    - name: Lint (R1 no front — invoke só em ipc/)
      shell: bash
      working-directory: packages/app/ui
      run: pnpm lint

    - name: Testes + GATE de coverage (85% lines/fns/stmts — vite.config.ts)
      shell: bash
      working-directory: packages/app/ui
      run: pnpm test:coverage

    - name: Build (tsc + vite)
      shell: bash
      working-directory: packages/app/ui
      run: pnpm build
