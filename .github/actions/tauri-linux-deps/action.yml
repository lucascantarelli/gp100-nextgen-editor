name: tauri-linux-deps
description: >
  Deps de sistema do Tauri no Linux (WebKitGTK + GTK + appindicator + rsvg).
  Com `xvfb: true`, instala também o webkit2gtk-driver e o xvfb usados pelo
  smoke do shell (e2e-tauri do _validate.yml). Um lugar por regra.
inputs:
  xvfb:
    description: "Instalar webkit2gtk-driver + xvfb (smoke do shell Tauri)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Deps de sistema do Tauri (Linux)
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          sudo apt-get install -y webkit2gtk-driver xvfb
        fi
