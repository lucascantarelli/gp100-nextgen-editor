# Configuração do actionlint.
#
# Lida AUTOMATICAMENTE: o actionlint procura `actionlint.yaml`/`.yml` no
# diretório `.github` (documentação do próprio projeto). Por isso o passo no
# `ci.yml` NÃO passa `-config-file` — com `docker://` o `args:` vira argumento do
# `docker run`, que não preserva aspas, e uma regexp com espaços chega em três
# pedaços. Já aconteceu duas vezes nesta PR:
#
#   1) could not read "unknown'": open unknown': no such file or directory
#   2) o `-ignore` chegou em três argumentos e não filtrou nada
#
# Um rótulo, e não uma rede. `macos-15-intel` é um rótulo REAL do GitHub — o
# runner Intel do macOS 15, anunciado em set/2025 e disponível até ago/2027
# (última imagem x86_64 do Actions). A lista embutida do actionlint 1.7.7 é mais
# antiga que o rótulo e o acusa de desconhecido.
#
# A razão está aqui porque "simplificar" este ignore é o caminho óbvio para o
# próximo que vir `macos-latest` ao lado e supor equivalência: trocar por
# `macos-latest` traria arm64, e o build do shell Tauri deixaria de ser
# provado na arquitetura que o `.dmg` exige. Trocaria um falso positivo por uma
# perda real de cobertura.
ignore:
  - 'label "macos-15-intel" is unknown'