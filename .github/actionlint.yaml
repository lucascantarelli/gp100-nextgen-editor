# Configuração do actionlint (lida por `-config-file` no job
# `Lint · contratos do pipeline`).
#
# Por que um arquivo e não a flag `-ignore` na linha do workflow: a imagem
# oficial é `docker://rhysd/actionlint:1.7.7`, e o `args` chega ao `docker run`
# sem aspas — um `-ignore 'label "x" is unknown'` vira três argumentos e o
# actionlint tenta abrir um arquivo chamado `unknown'`. Foi o que aconteceu na
# primeira execução (log: "could not read \"unknown'\"").

self-hosted-runner:
  labels: []

# Um rotulo, e não uma rede. `macos-15-intel` é um label REAL do GitHub — o
# runner Intel do macOS 15, anunciado em set/2025 e disponível até ago/2027
# (última imagem x86_64 do Actions). A lista embutida do actionlint 1.7.7 é mais
# antiga que o label e o acusa de desconhecido.
#
# A razão está aqui porque "simplificar" este ignore é o caminho óbvio para o
# próximo que vir `macos-latest` ao lado e supor equivalência: trocar por
# `macos-latest` traria arm64, e o build do shell Tauri deixaria de ser
# provado na arquitetura que o `.dmg` exige. Trocaria um falso positivo por uma
# perda real de cobertura.
ignore:
  - 'label "macos-15-intel" is unknown'