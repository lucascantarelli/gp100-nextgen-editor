# DEPENDABOT — PRs automáticos de upgrade de dependências.
#
# Complementa o job `security` noturno do pipeline.yml: a varredura DETETA
# (cargo/pnpm audit → issue ACHADOS), o Dependabot REMEDIA (PR pronto p/ review).
# Upgrades continuam sendo decisão do owner (A-1/A-3 foram manuais); aqui
# só muda a MECÂNICA: o PR abre pronto, com CI disparada (pull_request,
# 14 jobs, cache quente) e o security noturno revalida os lockfiles.
#
# 3 ecossistemas:
#   - github-actions "/"  → pins das actions do pipeline (checkout@v7…)
#   - npm "/packages/app/ui" → pnpm-lock.yaml do front
#   - cargo "/packages/app/api" → Cargo.lock PRÓPRIO do gp100-ui (workspace
#     separado por ADR-7)
# ⚠️ SEM entry `cargo /` (lockfile da raiz, core+cli) — DELIBERADO (ADR-8):
#   o updater do Dependabot roda em container Linux e NÃO expõe
#   RUSTUP_TOOLCHAIN; o pin windows-gnu do rust-toolchain.toml da raiz
#   (load-bearing no host — sem VS Build Tools) quebra o rustup de lá
#   ("target tuple in channel name"). O lockfile da raiz segue com
#   `cargo update` deliberado e o security noturno DETETA
#   vulnerabilidades (cargo audit já cobre o Cargo.lock da raiz).
#
# Cadência SEMANAL (segunda 09:00 UTC = 06:00 BRT, antes do expediente —
# mesma janela do security noturno). Vulnerabilidades sérias NÃO esperam
# a segunda: o security noturno as acusa em <24h e o upgrade pode ser
# despachado na hora (merge do PR do Dependabot ou manual).
#
# Groups: 1 PR por ecossistema/semana (dev-deps do npm agrupadas; cargo
# agrupa tudo — no lockfile Rust dev/prod não são PRs separados). Volume
# baixo sem esconder mudanças: cada ecossistema segue isolado.
#
# Labels PROVISIONADAS antecipadamente via `gh label create --force`
# (dependencies, rust, npm, github-actions): o Dependabot NÃO cria labels
# e um PR com label inexistente falha o update — mesma lição do
# achados-security no security.yml.
#
# open-pull-requests-limit 5: com os groups o teto é teórico; evita fila
# infinita se passar semanas sem review.

version: 2
updates:
  # ── Actions do pipeline ──
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  # ── Front (React 19/Vite 8/Vitest 5/ESLint 10 — packages/app/ui/pnpm-lock.yaml) ──
  - package-ecosystem: npm
    directory: "/packages/app/ui"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    # TS 7 trava o lint: o typescript-eslint 8.x suporta só TS <6.1 e morre
    # com "Error: typescript-eslint does not support TS 7.0." (provado no
    # PR #2 — 3 jobs ui em failure). Reabrir o bump quando o typescript-
    # eslint estender o peer range.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      dev-deps:
        applies-to: version-updates
        dependency-type: development
      prod-deps:
        applies-to: version-updates
        dependency-type: production

  # ── gp100-ui (workspace PRÓPRIO do Tauri, ADR-7 — Cargo.lock próprio;
  # hoje em packages/app/api). O rust-toolchain.toml daqui tem canal SEM
  # triple (ADR-8) — portável para o container Linux do updater. ──
  - package-ecosystem: cargo
    directory: "/packages/app/api"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    # glib: o Tauri 2 (gtk-rs) trava a série 0.18 e o fix do RUSTSEC-2024-0429
    # (unsound, alerta #1 / GHSA-wrw7-89jp-8q8g) só existe em 0.20+ — SEM
    # upgrade possível enquanto o Tauri não migrar de gtk-rs. Sem o ignore, o
    # Dependabot falha TODA semana com `security_update_not_possible` (run
    # 36933732841) e o alerta fica aberto sem remédio. Risco aceito e
    # documentado; reavaliar junto com o bump de gtk-rs do Tauri.
    ignore:
      - dependency-name: "glib"
    labels:
      - dependencies
      - rust
    groups:
      crates:
        applies-to: version-updates
        patterns:
          - "*"
