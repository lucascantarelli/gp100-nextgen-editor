# ═══════════════════════════════════════════════════════════════════════════
# PIPELINE — workflow ÚNICO do GP-100 NextGen Editor (validação + security +
# versionamento + release). Passos reutilizáveis vivem em .github/actions/*
# (composite actions): setup-rust, setup-node-pnpm, build-front,
# hardware-smoke, version-bump. Um lugar por regra; o workflow só ORQUESTRA.
#
# Regras de execução por ref (decisão do owner, 30/09 — versão "play"):
#   push main        → gate+spec+matriz 3-OS FILTRADA por caminhos mudados
#                      (validação; NÃO corta tag).
#   push develop     → idem main (pré-integração completa).
#   PR → main|develop→ idem; PR com a label "ci-lite" roda SÓ o Windows
#                      (WIP barato).
#   ▶ PLAY (Actions →
#     Run workflow)  → AÇÃO MANUAL do versionamento: valida tudo, calcula
#                      o semver pelos conventional commits desde a última
#                      tag (feat→minor, fix/deps→patch, breaking→major),
#                      e SÓ CORTA a tag/publica SE houver bump pendente.
#                      Input opcional `tag` publica uma tag que já existe.
#   tag v* (push)    → gate+spec+matriz cheia + RELEASE (CLI zip+SHA256 e
#                      instalador NSIS).
#   schedule 06:30   → security (cargo audit ×2 + pnpm audit + pytest da
#                      spec + issue ACHADOS única, por OUTCOME das steps).
#
# VELOCIDADE e RUÍDO ZERO (padrão monorepo):
#   - O job `plan` calcula os CAMINHOS mudados e liga/desliga jobs por
#     booleano (run-rust/run-front/run-spec): docs-only não sobe Rust/front;
#     mudança só no front não sobe core/cli (o ui-rust sobe: embute app/ui/dist).
#   - Job filtrado aparece como "skipped" (0 min, não falha a run). ⚠️ NUNCA
#     emitir matriz de 0 itens: matriz vazia CRASHA a run inteira como failure
#     sem nenhum job failed (provado na run 36747668222) — matrizes dinâmicas
#     só existem onde o plan garante ≥1 item; tag/release usam matriz fixa de 1
#     + if por booleano.
#   - concurrency por ref (schedule/tag nunca cancelam), caches por projeto,
#     timeout-minutes em todo job (runner preso não queima minutos).
# ═══════════════════════════════════════════════════════════════════════════

name: pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC = 03:30 BRT (antes do expediente)
  workflow_dispatch:
    inputs:
      run-security:
        description: "Executar também o job de security (auditorias)"
        type: boolean
        default: false
      tag:
        description: "(Opcional) Tag EXISTENTE p/ release (ex.: v0.1.0) — vazia = cortar vNext pelo semver"
        type: string
        required: false
      update-snapshots:
        description: "(Visual) Regenerar baselines de screenshot no Ubuntu — baixe o artefato e commite"
        type: boolean
        default: false

permissions:
  contents: write # tags + GitHub Release
  issues: write # issue ACHADOS do security

concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── PLANO: mudanças → matrizes filtradas + decisões de versão/release ──
  plan:
    name: Plano (mudanças + matrizes + versão)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust-matrix: ${{ steps.mat.outputs.rust-matrix }}
      front-matrix: ${{ steps.mat.outputs.front-matrix }}
      run-rust: ${{ steps.mat.outputs.run-rust }}
      run-front: ${{ steps.mat.outputs.run-front }}
      run-spec: ${{ steps.mat.outputs.run-spec }}
      run-tag: ${{ steps.rel.outputs.run-tag }}
      run-release: ${{ steps.rel.outputs.run-release }}
      next-version: ${{ steps.calc.outputs.next-version }}
      release: ${{ steps.calc.outputs.release }}
      bump: ${{ steps.calc.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff contra a base + git describe + tags

      - name: Buscar tags
        run: git fetch --tags --force

      - name: Calcular próxima versão (semver — informative)
        id: calc
        uses: ./.github/actions/version-bump

      - name: Detectar mudanças (base → HEAD)
        id: changes
        run: |
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          BEFORE="${{ github.event.before }}"
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="" # tag push / primeira run: sem diff → ALL
          fi
          if [ -z "$BASE" ]; then
            CHANGED="ALL"
          else
            CHANGED="$(git diff --name-only "$BASE..HEAD" || true)"
            [ -z "$CHANGED" ] && CHANGED="(none)"
          fi
          {
            echo "CHANGED<<CHANGED_EOF"
            echo "$CHANGED"
            echo "CHANGED_EOF"
            echo "IS_SCHEDULE=${{ github.event_name == 'schedule' }}"
          } >> "$GITHUB_ENV"

      - name: Matrizes por projeto afetado
        id: mat
        env:
          IS_LITE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-lite') }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          sys_out = []
          changed = os.environ.get("CHANGED", "ALL")
          is_all = changed == "ALL"
          # re.M OBRIGATÓRIO: CHANGED é multi-linha; sem ele o ^ só casa no
          # início da string e NENHUM projeto "muda" (provado na run 36764807538:
          # push de packages/ inteiro → tudo skipped).
          def has(pat):
              return is_all or re.search(pat, changed, re.I | re.M) is not None
          core   = has(r'^(Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|packages/core/|packages/cli/)')
          uirust = has(r'^(packages/app/|packages/core/|Cargo\.toml$|rust-toolchain\.toml$)')
          front  = has(r'^packages/app/ui/')
          spec   = has(r'^(analysis/|docs/|pyproject\.toml$|uv\.lock$)')
          scheduled = os.environ.get("IS_SCHEDULE") == "true"
          lite = os.environ.get("IS_LITE") == "true"
          oss = ["windows-latest"] if lite else ["windows-latest", "ubuntu-24.04", "macos-26"]
          rust = []
          if not scheduled:
              for o in oss:
                  if core:
                      rust.append({"os": o, "project": "core", "workdir": "."})
                      rust.append({"os": o, "project": "cli", "workdir": "."})
                  if uirust:
                      rust.append({"os": o, "project": "ui-rust", "workdir": "packages/app/api"})
          fr = [] if scheduled else [{"os": o} for o in oss if front]
          compact = lambda d: json.dumps(d, separators=(",", ":"))
          print(f"rust-matrix={compact({'include': rust})}")
          print(f"front-matrix={compact({'include': fr})}")
          print(f"run-rust={'true' if rust else 'false'}")
          print(f"run-front={'true' if fr else 'false'}")
          print(f"run-spec={'true' if (spec and not scheduled) else 'false'}")
          PY

      - name: Decisões de tag/release (o PLAY decide)
        id: rel
        env:
          NEXT: ${{ steps.calc.outputs.next-version }}
          PENDING: ${{ steps.calc.outputs.release }}
        run: |
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"
          TAG_INPUT="${{ github.event.inputs.tag }}"
          DO_TAG=false; DO_RELEASE=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$TAG_INPUT" ]; then
            DO_RELEASE=true   # publicar tag que JÁ existe (input do play)
          fi
          if [[ "$REF" == refs/tags/v* ]]; then
            DO_RELEASE=true   # push de tag local → release nativo
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "$TAG_INPUT" ] && [ "$PENDING" = "true" ]; then
            DO_TAG=true; DO_RELEASE=true   # play sem input + bump pendente
          fi
          {
            echo "run-tag=$DO_TAG"
            echo "run-release=$DO_RELEASE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Plano do pipeline"
            echo ""
            echo "| Decisão | Valor |"
            echo "|---|---|"
            echo "| evento | \`$EVENT\` |"
            echo "| input tag | \`$TAG_INPUT\` |"
            echo "| próxima versão | \`$NEXT\` (bump: \`${{ steps.calc.outputs.bump }}\`, pendente: \`$PENDING\`) |"
            echo "| cortar tag | \`$DO_TAG\` |"
            echo "| release | \`$DO_RELEASE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── GATE rápido (sempre): fmt + lint de conventional commits ──
  gate:
    name: Gate — fmt + conventional commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Toolchain stable do runner
        run: rustup update stable --no-self-update

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: gate

      - name: Formatação (workspace gnu da raiz)
        run: cargo fmt --check

      - name: Conventional commits (push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..HEAD"
          fi
          FAIL=0
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            if echo "$s" | grep -qE '^[a-z][a-z0-9_-]*(\([^\)]+\))?!?: .+'; then
              echo "OK: $s"
            else
              echo "FORA DO PADRÃO: $s  (esperado: tipo(escopo)?: assunto — ex.: feat(ui): …)"
              FAIL=1
            fi
          done < <(git log --format='%s' "$RANGE" 2>/dev/null)
          exit $FAIL

      # Validação sintática + de gatilhos dos workflows (V-7): o teste de
      # integração REAL do close-issues é o merge em develop; aqui o gate
      # trava YAML válido e o contrato (trigger/permissions/guards).
      - name: Workflows válidos (close-issues/pipeline/release)
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user pyyaml
          python3 scripts/validate_workflows.py

      # Simulação END-TO-END da cadeia rc→promote (V-7): extrai os blocos
      # run: DO release.yml e os executa num sandbox git local (origin bare
      # + clones), provando rc1→rc2→promote + idempotência + guards ANTES
      # de qualquer uso real. Só precisa de git+bash+python3 do runner.
      - name: Simulação do release-gitflow (rc→promote)
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user pyyaml
          python3 scripts/simulate_release.py

  # ── SPEC: trava da especificação (pytest) — só quando ela muda ──
  spec:
    name: Python — trava da especificação
    needs: plan
    if: needs.plan.outputs.run-spec == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Sync do ambiente (capstone, pefile, ziglang, pytest)
        run: uv sync --all-groups
      - name: Suíte de regressão (golden, hash da baseline, knob_map, fixtures)
        run: uv run pytest

  # ── RUST: core / cli / ui-rust — matriz DINÂMICA (vazia = não aparece) ──
  rust:
    name: ${{ matrix.project }} (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.run-rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v7

      # Regra por OS (a composite instala a toolchain; esta env garante que
      # TODO cargo do job a use — runner.os só existe em STEP, daí o
      # GITHUB_ENV): gnu na raiz (campo/dev), msvc na api (ADR-7),
      # stable nativa fora do Windows (ADR-8).
      - name: Definir RUSTUP_TOOLCHAIN por OS/projeto
        run: echo "RUSTUP_TOOLCHAIN=${{ runner.os == 'Windows' && (matrix.workdir == 'packages/app/api' && 'stable-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-gnu') || 'stable' }}" >> "$GITHUB_ENV"

      - name: Toolchain + cache do cargo
        uses: ./.github/actions/setup-rust
        with:
          workdir: ${{ matrix.workdir }}
          cache-key: ${{ matrix.project }}-${{ matrix.os }}

      # midir → ALSA no Linux: alsa-sys compila C (pkg-config + asoundlib).
      - name: Deps de sistema do ALSA (Linux — cli)
        if: matrix.project == 'cli' && runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Clippy + testes (gp100-core)
        if: matrix.project == 'core'
        run: |
          cargo clippy -p gp100-core --all-targets -- -D warnings
          cargo test -p gp100-core

      - name: Clippy + testes (gp100-cli, default + real-device)
        if: matrix.project == 'cli'
        run: |
          cargo clippy -p gp100-cli --all-targets -- -D warnings
          cargo clippy -p gp100-cli --all-targets --features real-device -- -D warnings
          cargo test -p gp100-cli

      - name: Build do binário de campo (real-device)
        if: matrix.project == 'cli'
        run: cargo build -p gp100-cli --features real-device

      # Smoke da política SÓ no Windows (WinMM é o stack do campo).
      - name: Smoke da política de hardware
        if: matrix.project == 'cli' && runner.os == 'Windows'
        uses: ./.github/actions/hardware-smoke
        with:
          profile: debug

      # ── gp100-ui: front buildado ANTES (generate_context! embute ui/dist) ──
      - name: Setup do front (Node/pnpm)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/setup-node-pnpm

      - name: Front (lint + test + build)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/build-front

      - name: Deps de sistema do Tauri (Linux — gtk/webkit)
        if: matrix.project == 'ui-rust' && runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Formatação do crate (Ubuntu — como na M0/M1)
        if: matrix.project == 'ui-rust' && runner.os == 'Linux'
        run: cargo fmt -- --check

      - name: Clippy + testes + build do shell (gp100-ui)
        if: matrix.project == 'ui-rust'
        run: |
          cargo clippy -p gp100-ui --all-targets -- -D warnings
          cargo test -p gp100-ui
          cargo build -p gp100-ui

  # ── FRONT (ui/): matriz dinâmica — lint/vitest/build ──
  front:
    name: app/ui — front (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.run-front == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.front-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm
      - name: Lint + testes + build
        uses: ./.github/actions/build-front

  # ── E2E: Playwright (casca completa) contra o pnpm dev no Chromium ──
  # R1–R6 + drum + looper + atalhos globais + responsividade (3 viewports).
  # O playwright.config sobe o próprio dev server (webServer + strictPort);
  # roda no MESMO filtro do front (mudança em packages/app/ui/ ou ALL).
  # GATE DE RELEASE: entra no needs do tag-release (tag só sai com e2e verde).
  e2e:
    name: e2e — Playwright (casca no Chromium)
    needs: plan
    if: needs.plan.outputs.run-front == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm
      - name: Chromium do Playwright (+ deps de sistema)
        working-directory: packages/app/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Suíte e2e (sobe o pnpm dev sozinha — reuseExistingServer)
        working-directory: packages/app/ui
        run: pnpm exec playwright test

  # ── E2E VISUAL: regressão estética dos painéis (toHaveScreenshot) ──
  # Baselines por viewport E por plataforma (e2e/__screenshots__/*-linux.png):
  # fontes divergem entre Windows/Linux. Sem baseline no CI = SKIP (não falha
  # a 1ª execução); com o input update-snapshots, o job GERA as baselines
  # linux e sobe o artefato — commitar os PNGs para ativar a comparação.
  e2e-visual:
    name: e2e visual — regressão estética (toHaveScreenshot)
    needs: plan
    if: needs.plan.outputs.run-front == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm
      - name: Chromium do Playwright (+ deps de sistema)
        working-directory: packages/app/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Suíte visual (compara baselines; gera com update-snapshots)
        working-directory: packages/app/ui
        run: pnpm exec playwright test visual.spec.ts ${{ github.event.inputs.update-snapshots == 'true' && '--update-snapshots' || '' }}
      - name: Baselines/diffs como artefato (inspeção e commit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: packages/app/ui/e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  # ── E2E SMOKE: shell TAURI REAL sobe no webview (tauri-driver, Linux) ──
  # Prova a casca no WEBVIEW, não só no browser: build debug do gp100-ui
  # (generate_context! embute ui/dist; backend mock — sem hardware), driver
  # WebKitGTK sob xvfb e asserções de DOM via Selenium (receita oficial).
  e2e-tauri:
    name: e2e smoke — shell Tauri real (tauri-driver, Linux)
    needs: plan
    if: needs.plan.outputs.run-front == 'true' || needs.plan.outputs.run-rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust (stable — pin gnu da raiz quebra Linux, ADR-7)
        uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          cache-key: smoke-tauri
      - name: Setup do front (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm
      - name: Front (lint + test + build — ui/dist alimenta o binário)
        uses: ./.github/actions/build-front
      - name: Deps do Tauri + driver (WebKitGTK, xvfb, webkit2gtk-driver)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: Build debug do gp100-ui (dist embutido, backend mock)
        working-directory: packages/app/api
        run: cargo build -p gp100-ui
      - name: Instalar tauri-driver
        run: cargo install tauri-driver --locked
      - name: Smoke do shell (xvfb + tauri-driver na 4444)
        working-directory: packages/app/ui
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a node e2e/tauri.smoke.mjs

  # ── TAG: matriz de 1 decidida pelo plan (0 = job não aparece) ──
  tag-release:
    name: Tag de release (cortada no play)
    needs: [plan, gate, spec, rust, front, e2e]
    if: needs.plan.outputs.run-tag == 'true'
    strategy:
      matrix:
        include:
          - run: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.criar.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Buscar tags
        run: git fetch --tags --force

      - name: Aplicar versão (determinística sobre o mesmo sha do plan)
        id: apply
        uses: ./.github/actions/version-bump

      - name: Criar commit + tag
        id: criar
        env:
          TAG: v${{ steps.apply.outputs.next-version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Só commita se a versão divergir dos manifests (1º corte: sem
          # diff — a tag marca a árvore como está).
          git add Cargo.toml packages/app/api/Cargo.toml version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG (bump automático por conventional commits)"
            git push origin HEAD
          fi
          git tag --force "$TAG"
          git push --force origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag **$TAG** criada (play aprovado por ${{ github.actor }})" >> "$GITHUB_STEP_SUMMARY"

  # ── RELEASE: CLI de campo (Windows, gnu) — matriz decidida no plan ──
  release-cli:
    name: Release — CLI de campo (Windows, gnu)
    needs: [plan, gate, spec, tag-release]
    if: needs.plan.outputs.run-release == 'true'
    strategy:
      matrix:
        include:
          - run: true
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      # Tag push: compila da própria ref; play com input: da tag do input;
      # play que cortou tag: da tag recém-criada.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || needs.tag-release.outputs.tag || github.ref }}

      - name: Toolchain + cache
        uses: ./.github/actions/setup-rust
        with:
          workdir: .
          cache-key: release-cli

      - name: Gates (tag só sai de main verde — reconfirmação barata)
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test

      - name: Build release do binário de campo
        run: cargo build --release -p gp100-cli --features real-device

      - name: Smoke da política de hardware
        uses: ./.github/actions/hardware-smoke
        with:
          profile: release

      - name: Empacotar (zip + SHA256 + notas)
        shell: bash
        run: |
          STAGE="gp100-cli-${{ github.event.inputs.tag || needs.tag-release.outputs.tag || github.ref_name }}"
          mkdir -p "$STAGE"
          cp target/release/gp100-cli.exe "$STAGE/"
          cp docs/H1_CHECKLIST.md docs/H1_REPORT.md scripts/h1_field.sh "$STAGE/"
          cat > "$STAGE/LEIA-ME.txt" <<MD
          GP-100 NextGen Editor — CLI de campo ${GITHUB_REF_NAME}

          Uso do gate H1: docs/H1_CHECKLIST.md (roteiro) + h1_field.sh (runbook).
          Relatorio da sessao: docs/H1_REPORT.md.

          Politica de hardware: leitura real exige --real --i-know-what-im-doing
          (build com feature real-device). ESCRITA permanece bloqueada ate o
          gate H2 (WRITE_VERIFIED).
          MD
          zip -q -r "$STAGE.zip" "$STAGE" 2>/dev/null || 7z a -tzip -bso0 "$STAGE.zip" "$STAGE"
          sha256sum "$STAGE.zip" > "$STAGE.zip.sha256"
          cat > RELEASE_NOTES.md <<MD
          ## gp100-cli de campo ${GITHUB_REF_NAME}

          - Binário Windows (windows-gnu pinado, release) com feature \`real-device\`.
          - Smoke da política executado no build (recusas 2/3 sem device).
          - SHA256 em \`${STAGE}.zip.sha256\`; kit de campo (checklist + runbook + relatório) dentro do zip.
          - Instalador do app (NSIS) no mesmo release, artefato \`gp100-ui-installer\`.
          MD
          echo "ASSET=$STAGE.zip" >> "$GITHUB_ENV"
          echo "ASSET_SHA=$STAGE.zip.sha256" >> "$GITHUB_ENV"

      - name: Upload do artefato (sempre — inspeção pré-release)
        uses: actions/upload-artifact@v7
        with:
          name: gp100-cli-windows
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

      - name: Publicar na GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || needs.tag-release.outputs.tag || github.ref_name }}
          # RELEASE CANDIDATE (v*-*rc.*): publica como PRERELEASE — a release
          # final sai quando o promote do release-gitflow corta a tag limpa.
          prerelease: ${{ contains(github.event.inputs.tag || needs.tag-release.outputs.tag || github.ref_name, '-rc') }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true

  # ── RELEASE: instalador do app (NSIS via Tauri, MSVC) ──
  release-installer:
    name: Release — instalador NSIS (Tauri, MSVC)
    needs: [plan, gate, spec, tag-release]
    if: needs.plan.outputs.run-release == 'true'
    strategy:
      matrix:
        include:
          - run: true
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || needs.tag-release.outputs.tag || github.ref }}

      - name: Setup do front (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm

      - name: Front (lint + test + build — ui/dist alimenta o bundle)
        uses: ./.github/actions/build-front

      - name: Toolchain + cache (MSVC da api — ADR-7)
        uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          cache-key: release-installer

      # O tauri-cli acha o conf DESCENDO do cwd; exige workspace (o próprio
      # de packages/app/api) e usa o shim do ui/ (packages/app não é pacote pnpm).
      - name: Build do bundle (instalador NSIS)
        working-directory: packages/app/api
        run: ../../ui/node_modules/.bin/tauri.cmd build

      - name: Localizar e empacotar (SHA256)
        shell: bash
        run: |
          SETUP=$(ls packages/app/api/target/release/bundle/nsis/*-setup.exe | head -1)
          echo "instalador: $SETUP"
          sha256sum "$SETUP" > "$SETUP.sha256"
          echo "SETUP=$SETUP" >> "$GITHUB_ENV"
          echo "SETUP_SHA=$SETUP.sha256" >> "$GITHUB_ENV"

      - name: Upload do artefato (sempre — inspeção pré-release)
        uses: actions/upload-artifact@v7
        with:
          name: gp100-ui-installer
          path: |
            ${{ env.SETUP }}
            ${{ env.SETUP_SHA }}

      - name: Publicar na GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || needs.tag-release.outputs.tag || github.ref_name }}
          # RELEASE CANDIDATE: prerelease também no instalador (mesma regra)
          prerelease: ${{ contains(github.event.inputs.tag || needs.tag-release.outputs.tag || github.ref_name, '-rc') }}
          files: |
            ${{ env.SETUP }}
            ${{ env.SETUP_SHA }}
          fail_on_unmatched_files: true

  # ── SECURITY: auditorias noturnas + trava da spec + issue ACHADOS ──
  security:
    name: Security — audits (RustSec + npm) + spec
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run-security)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # O pin gnu da raiz quebra qualquer cargo no Linux (lição ADR-7).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Instalar cargo-audit (binário pré-compilado)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (RustSec — workspace da raiz)
        id: cargo_audit
        continue-on-error: true
        run: cargo audit --file Cargo.lock 2>&1 | tee /tmp/cargo-audit.txt

      - name: cargo audit — gp100-ui (lockfile próprio, ADR-7)
        id: cargo_audit_ui
        continue-on-error: true
        working-directory: packages/app/api
        run: cargo audit --file Cargo.lock 2>&1 | tee /tmp/cargo-audit-ui.txt

      - name: Setup (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm

      - name: pnpm audit (runtime do front — --prod ignora dev-deps)
        id: pnpm_audit
        continue-on-error: true
        working-directory: packages/app/ui
        run: pnpm audit --prod 2>&1 | tee /tmp/pnpm-audit.txt

      - name: Relatório de versões (INFORMATIVO — não falha)
        if: always()
        working-directory: packages/app/ui
        run: pnpm outdated 2>&1 | tee /tmp/pnpm-outdated.txt || true

      - name: Instalar uv
        if: always()
        uses: astral-sh/setup-uv@v10.2.0

      - name: Trava da especificação (pytest — como no security noturno antigo)
        if: always()
        run: |
          uv sync --all-groups
          uv run pytest

      - name: Achado = issue na FASE ACHADOS
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Achado = exit code ≠ 0 de QUALQUER auditoria (vulns OU falha da
          # própria ferramenta — direção fail-safe: melhor alarme do que
          # silêncio). Logs anexados na issue para o diagnóstico.
          set +e
          FLAG=0
          [ "${{ steps.cargo_audit.outcome }}" = "failure" ] && FLAG=1
          [ "${{ steps.cargo_audit_ui.outcome }}" = "failure" ] && FLAG=1
          [ "${{ steps.pnpm_audit.outcome }}" = "failure" ] && FLAG=1
          if [ "$FLAG" -eq 0 ]; then
            echo "sem achados — nada a registrar"
            exit 0
          fi
          esc() { sed -e 's/`/\\`/g' -e 's/\$/\\$/g' "$1" 2>/dev/null | head -80; }
          CA=$(esc /tmp/cargo-audit.txt); CUI=$(esc /tmp/cargo-audit-ui.txt)
          PA=$(esc /tmp/pnpm-audit.txt); PO=$(esc /tmp/pnpm-outdated.txt)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(cat <<MD
          ## 🔒 Achado de segurança (varredura noturna)

          **Regra:** FASE ACHADOS do \`docs/ROADMAP.md\` — prioridade MÁXIMA,
          resolve antes de qualquer issue de fase. Corrigido = fechar esta
          issue + linha A-xx no ROADMAP com a prova.

          <details><summary>cargo audit (workspace)</summary>

          \`\`\`
          $CA
          \`\`\`

          </details>

          <details><summary>cargo audit (gp100-ui)</summary>

          \`\`\`
          $CUI
          \`\`\`

          </details>

          <details><summary>pnpm audit (runtime)</summary>

          \`\`\`
          $PA
          \`\`\`

          </details>

          <details><summary>pnpm outdated (informativo)</summary>

          \`\`\`
          $PO
          \`\`\`

          </details>

          _Issue automática do pipeline — job: $RUN_URL_
          MD
          )
          EXISTING=$(gh issue list --label achados-security --state open --json number --jq '.[0].number' 2>/dev/null)
          gh label create achados-security --color D93F0B --description "Achado de segurança (varredura noturna)" --force 2>/dev/null || true
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Novo achado na varredura de $(date -u +%F) — job: $RUN_URL"
            echo "issue #$EXISTING atualizada"
          else
            gh issue create \
              --title "🔒 ACHADOS: achado de segurança na varredura noturna ($(date -u +%F))" \
              --label "achados-security" \
              --body "$BODY"
            echo "issue criada"
          fi
