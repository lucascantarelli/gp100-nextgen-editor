# ═══════════════════════════════════════════════════════════════════════════
# PUBLISH (reusable) — publica uma tag na GitHub Release: CLI de campo
# (Windows, gnu pinado) + instalador NSIS do app (Tauri, MSVC).
#
# POR QUE EXISTE (lição da auditoria 01/10): tag empurrada com GITHUB_TOKEN
# NÃO dispara workflows (`on: push: tags`), então o publish precisa acontecer
# NO MESMO run que cria a tag — rc/promote/version chamam este reusable.
# O trigger de tag no release.yml cobre apenas tags criadas por HUMANO.
#
# Contrato: o caller já validou (job `validate` no release.yml) e passa
# `tag` + `prerelease`. Rode SEMPRE a partir da tag (checkout explícito).
# ═══════════════════════════════════════════════════════════════════════════

name: _publish

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v1.0.0 ou v1.0.0-rc.2)"
        type: string
        required: true
      prerelease:
        description: "true publica como PRERELEASE (rc); false é release final"
        type: boolean
        required: true

permissions:
  contents: write # anexar artefatos na Release

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CLI de campo (Windows, gnu) — gates reconfirmados no build da tag ──
  cli:
    name: Publish — CLI de campo (Windows, gnu)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Toolchain + cache
        uses: ./.github/actions/setup-rust
        with:
          workdir: .
          cache-key: release-cli

      # Gates reconfirmados: a tag pode ter sido criada a partir de um ref
      # que não passou pelo ci.yml (ex.: input publish-tag de emergência).
      - name: Gates (fmt + clippy + testes)
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test

      - name: Build release do binário de campo
        run: cargo build --release -p gp100-cli --features real-device

      - name: Smoke da política de hardware
        uses: ./.github/actions/hardware-smoke
        with:
          profile: release

      - name: Empacotar (zip + SHA256 + notas)
        shell: bash
        env:
          STAGE: gp100-cli-${{ inputs.tag }}
        run: |
          mkdir -p "$STAGE"
          cp target/release/gp100-cli.exe "$STAGE/"
          cp docs/H1_CHECKLIST.md docs/H1_REPORT.md scripts/h1_field.sh "$STAGE/"
          cat > "$STAGE/LEIA-ME.txt" <<MD
          GP-100 NextGen Editor — CLI de campo ${GITHUB_REF_NAME}

          Uso do gate H1: docs/H1_CHECKLIST.md (roteiro) + h1_field.sh (runbook).
          Relatorio da sessao: docs/H1_REPORT.md.

          Politica de hardware: leitura real exige --real --i-know-what-im-doing
          (build com feature real-device). ESCRITA permanece bloqueada ate o
          gate H2 (WRITE_VERIFIED).
          MD
          zip -q -r "$STAGE.zip" "$STAGE" 2>/dev/null || 7z a -tzip -bso0 "$STAGE.zip" "$STAGE"
          sha256sum "$STAGE.zip" > "$STAGE.zip.sha256"
          cat > RELEASE_NOTES.md <<MD
          ## gp100-cli de campo ${GITHUB_REF_NAME}

          - Binário Windows (windows-gnu pinado, release) com feature \`real-device\`.
          - Smoke da política executado no build (recusas 2/3 sem device).
          - SHA256 em \`${STAGE}.zip.sha256\`; kit de campo (checklist + runbook + relatório) dentro do zip.
          - Instalador do app (NSIS) no mesmo release, artefato \`gp100-ui-installer\`.
          MD
          echo "ASSET=$STAGE.zip" >> "$GITHUB_ENV"
          echo "ASSET_SHA=$STAGE.zip.sha256" >> "$GITHUB_ENV"

      - name: Upload do artefato (sempre — inspeção pré-release)
        uses: actions/upload-artifact@v7
        with:
          name: gp100-cli-windows
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

      - name: Publicar na GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true

  # ── Instalador do app (NSIS via Tauri, MSVC) ──
  installer:
    name: Publish — instalador NSIS (Tauri, MSVC)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup do front (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm

      - name: Front (lint + test + build — ui/dist alimenta o bundle)
        uses: ./.github/actions/build-front

      - name: Toolchain + cache (MSVC da api — ADR-7)
        uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          cache-key: release-installer

      # O tauri-cli acha o conf DESCENDO do cwd; exige workspace (o próprio
      # de packages/app/api) e usa o shim do ui/ (packages/app não é pacote pnpm).
      - name: Build do bundle (instalador NSIS)
        working-directory: packages/app/api
        run: ../../ui/node_modules/.bin/tauri.cmd build

      - name: Localizar e empacotar (SHA256)
        shell: bash
        run: |
          SETUP=$(ls packages/app/api/target/release/bundle/nsis/*-setup.exe | head -1)
          echo "instalador: $SETUP"
          sha256sum "$SETUP" > "$SETUP.sha256"
          echo "SETUP=$SETUP" >> "$GITHUB_ENV"
          echo "SETUP_SHA=$SETUP.sha256" >> "$GITHUB_ENV"

      - name: Upload do artefato (sempre — inspeção pré-release)
        uses: actions/upload-artifact@v7
        with:
          name: gp100-ui-installer
          path: |
            ${{ env.SETUP }}
            ${{ env.SETUP_SHA }}

      - name: Publicar na GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ env.SETUP }}
            ${{ env.SETUP_SHA }}
          fail_on_unmatched_files: true
