# RELEASE — artefatos de distribuição por tag (v*).
#
# Disparo: push de tag v* (ex.: v0.1.0) ou workflow_dispatch (só artefatos,
# sem publicar — para ensaio). A tag só deve sair de main com CI verde.
#
# Artefatos:
#   1. gp100-cli (binário de CAMPO, windows-gnu pinado = ambiente do dev):
#      gates reconfirmados → build release --features real-device → smoke da
#      política (exit 2/3) → zip com checklist/report do H1 + SHA256.
#   2. Instalador NSIS do app (gp100-ui via `tauri build`, MSVC/WebView2):
#      o bundler do Tauri baixa o NSIS e gera o setup.exe.
# Os dois vão para a GitHub Release da tag + artefatos de run (inspeção).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli-field:
    name: CLI de campo (Windows, gnu pinado)
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Instalar toolchain pinada + componentes
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update --component rustfmt --component clippy

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2

      - name: Gates (tag só sai de main verde — reconfirmação barata)
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test

      - name: Build release do binário de campo
        run: cargo build --release -p gp100-cli --features real-device

      - name: "Smoke da política (sem device: exit 2 sem ack / 3 com ack)"
        shell: bash
        run: |
          set +e
          ./target/release/gp100-cli.exe --real info > /dev/null 2>&1
          c1=$?
          ./target/release/gp100-cli.exe --real --i-know-what-im-doing info > /dev/null 2>&1
          c2=$?
          set -e
          [ "$c1" -eq 2 ] || { echo "ERRO: --real sem ack = exit $c1 (esperado 2)"; exit 1; }
          [ "$c2" -eq 3 ] || { echo "ERRO: --real + ack sem device = exit $c2 (esperado 3)"; exit 1; }
          echo "política OK: recusas nos exit codes 2/3"

      - name: Empacotar (zip + SHA256 + notas)
        shell: bash
        run: |
          STAGE="gp100-cli-${GITHUB_REF_NAME}"
          mkdir -p "$STAGE"
          cp target/release/gp100-cli.exe "$STAGE/"
          cp docs/H1_CHECKLIST.md docs/H1_REPORT.md scripts/h1_field.sh "$STAGE/"
          cat > "$STAGE/LEIA-ME.txt" <<MD
          GP-100 NextGen Editor — CLI de campo ${GITHUB_REF_NAME}

          Uso do gate H1: docs/H1_CHECKLIST.md (roteiro) + h1_field.sh (runbook).
          Relatorio da sessao: docs/H1_REPORT.md.

          Politica de hardware: leitura real exige --real --i-know-what-im-doing
          (build com feature real-device). ESCRITA permanece bloqueada ate o
          gate H2 (WRITE_VERIFIED).
          MD
          zip -q -r "$STAGE.zip" "$STAGE" 2>/dev/null || 7z a -tzip -bso0 "$STAGE.zip" "$STAGE"
          sha256sum "$STAGE.zip" > "$STAGE.zip.sha256"
          cat > RELEASE_NOTES.md <<MD
          ## gp100-cli de campo ${GITHUB_REF_NAME}

          - Binário Windows (windows-gnu pinado, release) com feature \`real-device\`.
          - Smoke da política executado no build (recusas 2/3 sem device).
          - SHA256 em \`${STAGE}.zip.sha256\`; kit de campo (checklist + runbook + relatório) dentro do zip.
          - Instalador do app (NSIS) no mesmo release, artefato \`gp100-ui-installer\`.
          MD
          echo "ASSET=$STAGE.zip" >> "$GITHUB_ENV"
          echo "ASSET_SHA=$STAGE.zip.sha256" >> "$GITHUB_ENV"

      - name: Upload do artefato (sempre — inspeção pré-release)
        uses: actions/upload-artifact@v7
        with:
          name: gp100-cli-windows
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

      - name: Publicar na GitHub Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true

  ui-installer:
    name: Instalador do app (NSIS via Tauri, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar pnpm 11
        run: npm install -g pnpm@11

      - name: Front (deps + build — ui/dist alimenta o bundle)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # O tauri-cli exige que o crate do Tauri seja MEMBRO de um workspace
      # cargo (rust.rs faz unwrap() na workspace_handle — sem workspace, panic
      # Option::None). src-tauri tem [workspace] próprio (ADR-7), então o
      # build roda DE DENTRO dele: acha o próprio tauri.conf.json, compila o
      # gp100-ui na toolchain MSVC do pin local e baixa o NSIS;
      # beforeBuildCommand é vazio (o front já foi buildado acima).
      - name: Build do bundle (instalador NSIS)
        working-directory: src-tauri
        run: ../ui/node_modules/.bin/tauri.cmd build

      - name: Localizar e empacotar (SHA256)
        shell: bash
        run: |
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          echo "instalador: $SETUP"
          sha256sum "$SETUP" > "$SETUP.sha256"
          echo "SETUP=$SETUP" >> "$GITHUB_ENV"
          echo "SETUP_SHA=$SETUP.sha256" >> "$GITHUB_ENV"

      - name: Upload do artefato (sempre — inspeção pré-release)
        uses: actions/upload-artifact@v7
        with:
          name: gp100-ui-installer
          path: |
            ${{ env.SETUP }}
            ${{ env.SETUP_SHA }}

      - name: Publicar na GitHub Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.SETUP }}
            ${{ env.SETUP_SHA }}
          fail_on_unmatched_files: true
