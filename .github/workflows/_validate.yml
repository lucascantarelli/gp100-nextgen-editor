# ═══════════════════════════════════════════════════════════════════════════
# VALIDATE (reusable) — a régua de qualidade do projeto, em UM lugar.
#
# Chamado por:
#   - ci.yml        (PR/push nas branches de integração)
#   - release.yml   (gate antes de publicar uma tag)
#
# Contrato (mantido do pipeline.yml original — NÃO reabrir lições):
#   - `plan` calcula os CAMINHOS mudados e liga/desliga jobs por booleano
#     (run-rust/run-front/run-spec): docs-only não sobe Rust/front; mudança
#     só no front não sobe core/cli (o ui-rust sobe: embute app/ui/dist).
#   - Job filtrado aparece como "skipped" (0 min, não falha a run). ⚠️ NUNCA
#     emitir matriz de 0 itens: matriz vazia CRASHA a run inteira como failure
#     sem nenhum job failed (provado na run 36747668222).
#   - `needs.plan` + `fromJSON(needs.plan.outputs.*-matrix)` em TODOS os jobs
#     de matriz; `fail-fast: false` para ver o quadro completo.
#   - Filtro de release de docs: o `spec` (pytest) roda quando analysis/docs
#     mudam — é a trava da especificação (golden/hash/knob_map/fixtures).
#   - timeout-minutes em todo job (runner preso não queima minutos).
#   - `CI-lite` (label no PR) roda SÓ o Windows (WIP barato).
#
# CUSTO (issue #41 — medido, não estimado):
#   - Jobs de container (imagem ghcr.io/<repo>/ci-linux:1) para o que precisa
#     de WebKitGTK/GTK/xvfb/tauri-driver: o pull (~30s) é pago contra o que a
#     imagem ELIMINA (apt 45–57s + cargo install 17s + rustup 8–10s).
#   - Jobs de API/browser (e2e, e2e visual, front) ficam no runner hospedado:
#     o pull não se paga (lição CI-11 no knowledge.md) — lá a alavanca é o
#     cache do ~/.cache/ms-playwright (playwright-setup).
#   - o gate do front (lint + vitest --coverage) roda em UM OS (ubuntu; no
#     ci-lite, Windows) — os outros só fazem build/typecheck (tsc + vite),
#     que é a parte que de fato varia por plataforma (issue #43).
#   - mesmos jobs de Rust compartilham cache POR WORKSPACE (shared-key
#     ws-raiz | ws-api) — antes era um cache por job (`key`), sempre frio.
#   - ui-rust em 2 OS: Windows (MSVC, ADR-7) + Linux (container). O macOS
#     saiu — a UI segue coberta pelo matrix do front (vitest 3-OS).
#   - macOS do front usa `macos-15-intel` (x86_64): TODO runner macos-* arm64
#     carrega a anotação "capacity constraints ... longer queue times" do
#     GitHub — ruído de infra que não controlamos; o label Intel não a emite e
#     casa com a arquitetura de Windows/Linux (suporte até ~08/2027).
# ═══════════════════════════════════════════════════════════════════════════

name: _validate

on:
  workflow_call:
    inputs:
      update-snapshots:
        description: "Gerar baselines visuais linux (=all) — input vindo do ci.yml"
        type: string
        required: false
        default: "false"

permissions:
  contents: read
  packages: read # pull da imagem ci-linux (público hoje; cinto e suspensório)

env:
  CARGO_TERM_COLOR: always
  # Fonte única da imagem de CI Linux — publicada por container.yml (`:1`).
  CI_IMAGE: ghcr.io/${{ github.repository }}/ci-linux:1

jobs:
  # ── PLANO: mudanças → matrizes filtradas ──
  plan:
    name: Plano (mudanças + matrizes)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust-matrix: ${{ steps.mat.outputs.rust-matrix }}
      front-matrix: ${{ steps.mat.outputs.front-matrix }}
      run-rust: ${{ steps.mat.outputs.run-rust }}
      run-front: ${{ steps.mat.outputs.run-front }}
      run-spec: ${{ steps.mat.outputs.run-spec }}
      rust-ui-linux: ${{ steps.mat.outputs.rust-ui-linux }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff contra a base + tags

      - name: Buscar tags
        run: git fetch --tags --force

      - name: Detectar mudanças (base → HEAD)
        id: changes
        run: |
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          BEFORE="${{ github.event.before }}"
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="" # tag push / primeira run: sem diff → ALL
          fi
          if [ -z "$BASE" ]; then
            CHANGED="ALL"
          else
            CHANGED="$(git diff --name-only "$BASE..HEAD" || true)"
            [ -z "$CHANGED" ] && CHANGED="(none)"
          fi
          {
            echo "CHANGED<<CHANGED_EOF"
            echo "$CHANGED"
            echo "CHANGED_EOF"
            echo "IS_SCHEDULE=${{ github.event_name == 'schedule' }}"
          } >> "$GITHUB_ENV"

      - name: Matrizes por projeto afetado
        id: mat
        env:
          IS_LITE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-lite') }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          changed = os.environ.get("CHANGED", "ALL")
          is_all = changed == "ALL"
          # re.M OBRIGATÓRIO: CHANGED é multi-linha; sem ele o ^ só casa no
          # início da string e NENHUM projeto "muda" (provado na run 36764807538:
          # push de packages/ inteiro → tudo skipped).
          def has(pat):
              return is_all or re.search(pat, changed, re.I | re.M) is not None
          core   = has(r'^(Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|packages/core/|packages/cli/)')
          uirust = has(r'^(packages/app/|packages/core/|Cargo\.toml$|rust-toolchain\.toml$)')
          front  = has(r'^packages/app/ui/')
          spec   = has(r'^(analysis/|docs/|pyproject\.toml$|uv\.lock$)')
          scheduled = os.environ.get("IS_SCHEDULE") == "true"
          lite = os.environ.get("IS_LITE") == "true"
          rust = []
          ui_linux = False
          if not scheduled:
              # macos-15-intel (x86_64): evita a anotação de fila dos runners
              # macOS arm64 e casa com a arquitetura de Windows/Linux.
              oss = ["windows-latest"] if lite else ["windows-latest", "macos-15-intel", "ubuntu-24.04"]
              for o in oss:
                  if core:
                      rust.append({"os": o, "project": "core", "workdir": "."})
                      rust.append({"os": o, "project": "cli", "workdir": "."})
                  # ui-rust em 2 OS (issue #41): Windows aqui (MSVC, ADR-7) e o
                  # Linux no job de CONTAINER ui-rust-linux. O macOS saiu: o
                  # front/vitest 3-OS é quem cobre a UI; compilar o shell Tauri
                  # no macOS (~96s) não pegava classe de bug própria.
                  if uirust and o == "windows-latest":
                      rust.append({"os": o, "project": "ui-rust", "workdir": "packages/app/api"})
              ui_linux = uirust and not lite
          # Gate de lint/coverage em UM OS (issue #43): o trio lint + vitest
          # --coverage é plataforma-independente (jsdom/eslint puros) — rodar
          # 3× só duplicava custo. Os demais OS seguem no `pnpm build`
          # (tsc + vite), que é o que precisa de validação por plataforma.
          # No ci-lite o `oss` é só o Windows, e o gate acompanha.
          gate_os = "windows-latest" if lite else "ubuntu-24.04"
          fr = [] if scheduled else [{"os": o, "full": o == gate_os} for o in oss if front]
          compact = lambda d: json.dumps(d, separators=(",", ":"))
          print(f"rust-matrix={compact({'include': rust})}")
          print(f"front-matrix={compact({'include': fr})}")
          print(f"run-rust={'true' if rust else 'false'}")
          print(f"run-front={'true' if fr else 'false'}")
          print(f"run-spec={'true' if (spec and not scheduled) else 'false'}")
          print(f"rust-ui-linux={'true' if ui_linux else 'false'}")
          PY

  # ── GATE rápido (sempre): fmt + conventional commits + contratos dos workflows ──
  gate:
    name: Gate — fmt + conventional commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Toolchain stable do runner
        run: rustup update stable --no-self-update

      # `cargo fmt` não compila nada: cache do rust-cache aqui só baixaria
      # GB do cache compartilhado para nada (cache: "false").
      - name: Cache do cargo
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Formatação (workspace gnu da raiz)
        run: cargo fmt --check

      - name: Conventional commits (push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..HEAD"
          fi
          FAIL=0
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            if echo "$s" | grep -qE '^[a-z][a-z0-9_-]*(\([^\)]+\))?!?: .+'; then
              echo "OK: $s"
            else
              echo "FORA DO PADRÃO: $s  (esperado: tipo(escopo)?: assunto — ex.: feat(ui): …)"
              FAIL=1
            fi
          done < <(git log --format='%s' "$RANGE" 2>/dev/null)
          exit $FAIL

      # Validação sintática + de gatilhos dos workflows (V-7): o teste de
      # integração REAL do close-linked é o merge em develop; aqui o gate
      # trava YAML válido e o contrato (trigger/permissions/guards).
      - name: Workflows válidos (ci/_validate/_publish/release/security/container)
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user pyyaml
          python3 scripts/validate_workflows.py

      # Simulação END-TO-END da cadeia rc→promote (V-7): extrai os blocos
      # run: DO release.yml e os executa num sandbox git local (origin bare
      # + clones), provando rc1→rc2→promote + idempotência + guards ANTES
      # de qualquer uso real. Só precisa de git+bash+python3 do runner.
      - name: Simulação do release-gitflow (rc→promote)
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user pyyaml
          python3 scripts/simulate_release.py

  # ── SPEC: trava da especificação (pytest) — só quando ela muda ──
  spec:
    name: Python — trava da especificação
    needs: plan
    if: needs.plan.outputs.run-spec == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Sync do ambiente (capstone, pefile, ziglang, pytest)
        run: uv sync --all-groups
      - name: Suíte de regressão (golden, hash da baseline, knob_map, fixtures)
        run: uv run pytest

  # ── RUST: core / cli / ui-rust(Windows) — matriz DINÂMICA (vazia = não aparece) ──
  rust:
    name: ${{ matrix.project }} (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.run-rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # ADR-8: gnu na raiz (campo/dev), msvc na api (ADR-7), stable fora do
      # Windows. JOB-LEVEL, não via GITHUB_ENV: o probe `rustc -vV` do
      # rust-cache roda DENTRO da composite setup-rust e não enxergava a var
      # exportada — o pin gnu do rust-toolchain.toml da raiz vencia e o rustup
      # respondia "target tuple in channel name" (##[error] no job, verde mas
      # sujo; pré-existente, fechado no #41). Env de job vale para todo step,
      # inclusive dentro de composite actions. A toolchain exata vem daqui — o
      # `matrix` é o único contexto disponível em env de job (runner.os é de
      # step).
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && (matrix.workdir == 'packages/app/api' && 'stable-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-gnu') || 'stable' }}
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain + cache do cargo (compartilhado por workspace)
        uses: ./.github/actions/setup-rust
        with:
          workdir: ${{ matrix.workdir }}
          shared-key: ${{ matrix.project == 'ui-rust' && 'ws-api' || 'ws-raiz' }}
          # Experimento do issue #41: cachear os crates DO workspace só no
          # ui-rust do Windows (269s de clippy/test/build no MSVC é o maior
          # custo restante do CI); nos demais o custo não paga o espaço.
          cache-workspace-crates: ${{ matrix.project == 'ui-rust' && matrix.os == 'windows-latest' && 'true' || 'false' }}

      # midir → ALSA no Linux: alsa-sys compila C (pkg-config + asoundlib).
      # Cache de apt (awalsh128) em vez de instalar a cada run — é o único
      # pacote de sistema que sobrou no caminho quente (o resto virou camada
      # da imagem ci-linux).
      - name: Deps de sistema do ALSA (Linux — cli) — cache de apt
        if: matrix.project == 'cli' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev
          version: 1.0

      - name: Clippy + testes (gp100-core)
        if: matrix.project == 'core'
        run: |
          cargo clippy -p gp100-core --all-targets -- -D warnings
          cargo test -p gp100-core

      - name: Clippy + testes (gp100-cli, default + real-device)
        if: matrix.project == 'cli'
        run: |
          cargo clippy -p gp100-cli --all-targets -- -D warnings
          cargo clippy -p gp100-cli --all-targets --features real-device -- -D warnings
          cargo test -p gp100-cli

      - name: Build do binário de campo (real-device)
        if: matrix.project == 'cli'
        run: cargo build -p gp100-cli --features real-device

      # Smoke da política SÓ no Windows (WinMM é o stack do campo).
      - name: Smoke da política de hardware
        if: matrix.project == 'cli' && runner.os == 'Windows'
        uses: ./.github/actions/hardware-smoke
        with:
          profile: debug

      # ── gp100-ui: front buildado ANTES (generate_context! embute ui/dist) ──
      - name: Setup do front (Node/pnpm)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/setup-node-pnpm

      # Aqui só o BUILD: lint/coverage/vitest são o trabalho dos jobs `front`
      # (matrix 3-OS) e do ui-rust-linux — este job precisa do ui/dist.
      - name: Front (build — dist alimenta o shell)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/build-front
        with:
          full: "false"

      - name: Clippy + testes + build do shell (gp100-ui)
        if: matrix.project == 'ui-rust'
        run: |
          cargo clippy -p gp100-ui --all-targets -- -D warnings
          cargo test -p gp100-ui
          cargo build -p gp100-ui

  # ── UI-RUST (Linux): o shell Tauri compila DENTRO da imagem ci-linux ──
  # Antes: 57s de apt (webkit/gtk) + 21s de toolchain/cache no runner
  # hospedado. Agora: pull da imagem (~30s) — WebKitGTK/GTK, Node 22 + pnpm 11
  # com store aquecido e o toolchain já vêm prontos (issue #41).
  ui-rust-linux:
    name: ui-rust (ubuntu-24.04 · container)
    needs: plan
    if: needs.plan.outputs.rust-ui-linux == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}/ci-linux:1
    timeout-minutes: 30
    env:
      # O pin gnu do rust-toolchain.toml da raiz quebra Linux (ADR-7).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Cache do cargo (workspace da api — compartilhado com o smoke)
        uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          shared-key: ws-api

      - name: Setup do front (Node/pnpm — já na imagem)
        uses: ./.github/actions/setup-node-pnpm

      - name: Front (build — lint/testes ficam no matrix do front)
        uses: ./.github/actions/build-front
        with:
          full: "false"

      - name: Formatação do crate (como na M0/M1)
        working-directory: packages/app/api
        run: cargo fmt -- --check

      - name: Clippy + testes + build do shell (gp100-ui)
        working-directory: packages/app/api
        run: |
          cargo clippy -p gp100-ui --all-targets -- -D warnings
          cargo test -p gp100-ui
          cargo build -p gp100-ui

  # ── FRONT (ui/): matriz dinâmica — lint/vitest+coverage/build ──
  front:
    # O modo no nome do check deixa claro quem carrega o gate (lint+coverage)
    # e quem só valida o build/typecheck da plataforma.
    name: app/ui — front (${{ matrix.os }} · ${{ matrix.full && 'lint+coverage' || 'build' }})
    needs: plan
    if: needs.plan.outputs.run-front == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.front-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm
      - name: ${{ matrix.full && 'Lint + testes + build (gate completo)' || 'Build (tsc + vite)' }}
        uses: ./.github/actions/build-front
        with:
          full: ${{ matrix.full }}

  # ── E2E: Playwright (casca completa) contra o pnpm dev no Chromium ──
  # R1–R6 + drum + looper + atalhos globais + responsividade (3 viewports).
  # O playwright.config sobe o próprio dev server (webServer + strictPort);
  # roda no MESMO filtro do front (mudança em packages/app/ui/ ou ALL).
  # Fica no runner HOSPEDADO (não no container): o pull da imagem custaria
  # mais do que o Chromium que o cache do playwright-setup já elimina (CI-11).
  e2e:
    name: e2e — Playwright (casca no Chromium)
    needs: plan
    if: needs.plan.outputs.run-front == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm
      - name: Chromium do Playwright (cache por versão + deps de sistema)
        uses: ./.github/actions/playwright-setup
      - name: Suíte e2e (sobe o pnpm dev sozinha — reuseExistingServer)
        working-directory: packages/app/ui
        run: pnpm exec playwright test

  # ── E2E VISUAL: regressão estética dos painéis (toHaveScreenshot) ──
  # Baselines por viewport E por plataforma (e2e/__screenshots__/*-linux.png):
  # fontes divergem entre Windows/Linux. Sem baseline no CI = SKIP (não falha
  # a 1ª execução); com o input update-snapshots, o job GERA as baselines
  # linux e sobe o artefato — commitar os PNGs para ativar a comparação.
  e2e-visual:
    name: e2e visual — regressão estética (toHaveScreenshot)
    needs: plan
    if: needs.plan.outputs.run-front == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup (Node 22 + pnpm 11)
        uses: ./.github/actions/setup-node-pnpm
      - name: Chromium do Playwright (cache por versão + deps de sistema)
        uses: ./.github/actions/playwright-setup
      - name: Suíte visual (compara baselines; gera com update-snapshots)
        working-directory: packages/app/ui
        # UPDATE_SNAPSHOTS destrava o skip de baseline ausente no spec (o CI
        # NÃO cria baseline nova por default — 48 falhas na run 36935738610);
        # `=all` porque o input existe justamente p/ gerar o que falta.
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update-snapshots }}
        run: pnpm exec playwright test visual.spec.ts ${{ inputs.update-snapshots == 'true' && '--update-snapshots=all' || '' }}
      - name: Baselines/diffs como artefato (inspeção e commit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: packages/app/ui/e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  # ── E2E SMOKE: shell TAURI REAL sobe no webview (tauri-driver, Linux) ──
  # Prova a casca no WEBVIEW, não só no browser: build debug do gp100-ui
  # (generate_context! embute ui/dist; backend mock — sem hardware), driver
  # WebKitGTK sob xvfb e asserções de DOM via Selenium (receita oficial).
  # Container ci-linux: o driver do WebKit, o xvfb, o mesa (software rendering)
  # e o tauri-driver COMPILADO já vêm da imagem — zero apt/cargo install aqui.
  e2e-tauri:
    name: e2e smoke — shell Tauri real (tauri-driver, Linux)
    needs: plan
    if: needs.plan.outputs.run-front == 'true' || needs.plan.outputs.run-rust == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}/ci-linux:1
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Cache do cargo (workspace da api — compartilhado com o ui-rust)
        uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          shared-key: ws-api
      - name: Setup do front (Node 22 + pnpm 11 — já na imagem)
        uses: ./.github/actions/setup-node-pnpm
      - name: Front (build — ui/dist alimenta o binário)
        uses: ./.github/actions/build-front
        with:
          full: "false"
      - name: Build debug do gp100-ui (dist embutido, backend mock)
        working-directory: packages/app/api
        run: cargo build -p gp100-ui
      # LIÇÃO (run 36943668915): build DEBUG carrega o `devUrl` do
      # tauri.conf.json (http://localhost:5173) — o dist embutido só entra em
      # RELEASE. Sem servidor no runner o webview mostra "Could not connect to
      # localhost: Connection refused" (içado pelo page source do próprio
      # smoke). Servimos o dist de produção na devUrl: o smoke segue provando
      # o WEBVIEW real (WebKitGTK + tauri-driver + DOM), que é o objeto dele.
      - name: Servir o dist na devUrl (build debug consome localhost:5173)
        working-directory: packages/app/ui
        run: |
          nohup pnpm exec vite preview --port 5173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "preview do dist no ar na :5173"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::preview não subiu — log:"; cat /tmp/preview.log; exit 1
      - name: Smoke do shell (xvfb + tauri-driver na 4444)
        working-directory: packages/app/ui
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a node e2e/tauri.smoke.mjs
