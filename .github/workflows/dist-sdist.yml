name: Distribuição · tarball de fonte (reusable)

# Extraído do `ci.yml` (#245, F-12). Ver `dist-instalador.yml` para as três
# regras que valem para TODOS os reutilizáveis desta pasta: um job por arquivo,
# nada de `env:` de topo atravessando (só `with:`), e `permissions:` só no
# caller (aqui os jobs herdam as permissões do job que chama).
#
# O insumo é o PKGBUILD do Arch (#72) — e por isso o job não só gera o tarball
# como prova que ele é CONSUMÍVEL: manifesto resolvido, `frontendDist` e as
# dependências de caminho do shell dentro dele.
on:
  workflow_call:

jobs:
  sdist:
    name: tarball de fonte
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/build-front
      - uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          shared-key: ws-api
      - name: linux precisa dos headers de WebKitGTK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config
      # Prova de que o tarball e realmente CONSUMIVEL, e nao so um .tar.gz:
      # o manifesto do crate do Tauri precisa resolver a dependencia de caminho
      # `gp100-core`, e o `frontendDist` precisa existir (sem ele o
      # `generate_context!()` faz `panic!` em tempo de compilacao).
      - name: o tarball tem o que o build do shell exige
        id: sdist
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          python3 packaging/make_sdist.py --version "$VER" --out dist-pkg
          # O NOME SAI DAQUI, e nao do `files:` do passo de publicacao (#237).
          # O `make_sdist.py` grava `gp100-nextgen-editor-<VER>.tar.gz` (sem o
          # `v`, que e a convencao do `$pkgname-$_pkgver.tar.gz` do PKGBUILD),
          # e o `files:` pedia `…-${{ github.ref_name }}.tar.gz` = `…-v0.2.1…`
          # — com `fail_on_unmatched_files: true` o job morreu DEPOIS de o
          # tarball estar certo e a Release ficou sem ele (run 38570410157).
          SRC="dist-pkg/gp100-nextgen-editor-$VER.tar.gz"
          # O `SHA256SUMS.txt` do sdist disputava o MESMO nome de asset com o
          # `dist-ui` (que publica o resumo dos instaladores): cada um leva o
          # seu, derivado do nome do proprio artefato.
          SHA="$SRC.sha256"
          mv dist-pkg/SHA256SUMS.txt "$SHA"
          {
            echo "tar=$SRC"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          test -s "$SRC" || { echo "::error::tarball vazio"; exit 1; }
          rm -rf /tmp/sdist-check && mkdir -p /tmp/sdist-check
          tar xzf "$SRC" -C /tmp/sdist-check
          ROOT="/tmp/sdist-check/gp100-nextgen-editor-$VER"
          test -f "$ROOT/packages/app/ui/dist/index.html" || {
            echo "::error::frontendDist ausente — o build do shell entra em panic"; exit 1; }
          # As DUAS dependencias de caminho do shell (core e library), uma por
          # linha: o check pontual de `packages/core` ficou verde enquanto o
          # tarball morria em `gp100-library` (run 38553264817, #230).
          for dep in packages/core packages/library; do
            test -f "$ROOT/$dep/Cargo.toml" || {
              echo "::error::$dep ausente — dependencia de caminho do gp100-ui"; exit 1; }
          done
          (cd "$ROOT/packages/app/api" && cargo metadata --format-version 1 --locked >/dev/null) || {
            echo "::error::manifesto do shell nao resolve dentro do tarball"; exit 1; }
          echo "tarball consumivel: frontendDist + deps de caminho do shell + manifesto"
      - name: publicar na Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            ${{ steps.sdist.outputs.tar }}
            ${{ steps.sdist.outputs.sha }}
          fail_on_unmatched_files: true
