# ═══════════════════════════════════════════════════════════════════════════
# CI — o pipeline inteiro do projeto em UM workflow.
#
# EXCEÇÃO DOCUMENTADA: a regeneração das baselines visuais tem um workflow
# próprio (visual-baselines.yml). NÃO é pipeline, é operação de teste manual,
# e ela saiu daqui porque dividir o `workflow_dispatch` com os jobs de
# release fazia o `default: release` do input `action` cortar tag junto com
# uma regeneração de baseline (run 38070949933; repetido no incidente rc.5
# de 13/10 — issue #204). Um arquivo separado com `contents: read` e ZERO
# inputs é a única forma que não depende de ninguém lembrar de preencher
# nada. Os contratos do par ficam no validate_workflows.py.
#
# Substitui ci.yml + _validate.yml + _publish.yml + release.yml + security.yml
# + container.yml (issue #68). Motivo: seis arquivos para um projeto de quatro
# produtos faz a mesma regra morar em seis lugares, e o nome do arquivo dentro
# do nome do job (`Validação (_validate.yml) / Gate — fmt + …') transfere
# informação nenhuma para quem lê o sidebar.
#
# TIPOS DE JOB — o `name:` é `Tipo · o que é`, sem número.
#
# O GitHub NÃO tem `stages:` como o GitLab (a doc de migração do próprio GitHub
# diz: "you can recreate this scenario with the `needs` key"). O que existe é o
# grafo de `needs:`. Duas consequências, ambas aceitas de propósito:
#
#   - a ORDEM DE EXECUÇÃO é o grafo `needs:`, não a posição no arquivo nem o
#     nome. As declarações abaixo estão na ordem pedida (#169: validação →
#     lint → compilação → infra → segurança → testes → cobertura →
#     distribuição → release → relatório) para quem lê o arquivo, e `needs:`
#     para quem roda;
#   - a LISTA DE CHECKS de um PR sai em ordem ALFABÉTICA, não de execução. Foi
#     o preço de tirar o prefixo numérico, e é a razão de o `Relatório · resumo
#     da run` existir: ele reconta a sequência real no step summary.
#
#   Validação    contexto: o que mudou, de que tipo é a branch, quais matrizes
#   Lint         validações estáticas — SEMPRE, em toda branch
#   Compilação   compilação de VERIFICAÇÃO — SEMPRE (build ≠ distribuição)
#   Infra        imagens de container do próprio CI (ghcr.io) — sem dependência
#   Segurança    auditorias de dependência + issue de achados — ANTES dos testes
#   Testes       unit, integração, e2e shell, e2e visual, e2e webview
#   Cobertura    relatório + gate de 85% — separado de propósito
#   Distribuição instaladores e CLI de campo (só na tag)
#   Release      versionamento e cadeia rc → promote → play
#   Relatório    resumo visual — o ÚLTIMO a rodar, SEMPRE (`if: always()`)
#
#   Fechamento   issues do PR mergeado — SAIU DESTE WORKFLOW (#169): virou
#                `.github/workflows/issues-fechamento.yml`, com gatilho próprio
#
# OS DA MATRIZ (.github/scripts/ci_plan.py): windows-latest · macos-15-intel ·
# ubuntu-24.04 · archlinux. O Arch não tem label hosted no GitHub — ele roda
# como CONTAINER `archlinux:base-devel` no runner ubuntu (as jobs de matriz
# aceitam `matrix.host`/`matrix.container`; vazio = runner hospedado normal).
#
# JOB QUE NÃO RODA APARECE COMO "skipped": é limitação da plataforma, o GitHub
# cria um check para todo job declarado. Só sumiria se o job não existisse
# naquele workflow — e o custo (vários arquivos) é o que a #68 pagou para
# eliminar.
#
# QUAL TIPO RODA EM QUE BRANCH (a regra é do job `plan`, não espalhada em
# `if:` soltos — uma fonte de verdade, testável):
#
#   branch                    plan lint build sec test cov dist release
#   (colunas na ordem da política — confira contra ci_plan.py, que é a fonte)
#   feature/* bugfix/* (PR)   ✅   ✅   ✅    ✅   ✅   ✅   ❌    ❌
#   develop   (push)          ✅   ✅   ✅    ✅   ✅   ✅   ❌    ⚠️
#   main      (push)          ✅   ✅   ✅    ✅   ✅   ✅   ❌    ❌
#   release/* (push/PR)       ✅   ✅   ✅    ❌   ❌   ❌   ❌    ⚠️
#   hotfix/*  (push/PR)       ✅   ✅   ✅    ✅   ✅   ✅   ❌    ⚠️
#   tag v*    (push)          ✅   ✅   ✅    ✅   ✅   ✅   ✅    ✅
#   schedule  (noturno)       ⚠️   ✅   ✅    ✅   ✅   ❌   ❌    ❌
#
#   O Fechamento (issues do PR mergeado) não tem coluna: é outro workflow
#   (`.github/workflows/issues-fechamento.yml`, #169). O Relatório não tem
#   coluna porque roda em TODA run, por último, com `if: always()`.
#
#   ⚠️ release = só em `workflow_dispatch` (nunca em push/PR): versionar no push
#      é a receita de tag prematura. A release REAL acontece na tag `v*`, que
#      roda a suíte inteira antes de gerar qualquer artefato.
#
# POR QUE `release/**` NÃO RODE TESTES: a release branch nasce da `develop`, que
# já foi testada no merge; retestar é custo sem informação nova. O gate de
# verdade da release é o push da tag `v*` (test → coverage → dist). Já
# `hotfix/**` RODA testes: ele nasce da `main`, é uma correção urgente e vai
# direto para produção.
#
# PERMISSÕES: o mínimo no topo (`contents: read`); só os jobs de `release`/`dist`
# sobem para `contents: write` no escopo do job. Um workflow único com
# `contents: write` no topo daria a TODOS os jobs — inclusive os que rodam
# código do PR — permissão de escrever no repositório.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  # push SÓ onde não existe PR: develop, main e as tags. Branch de trabalho
  # (feature/**, bugfix/**, hotfix/**, release/**) já é coberta pelo
  # `pull_request` abaixo — e o GitHub dispara os DOIS eventos quando a
  # branch tem PR aberto, então manter `feature/**` aqui rodava o pipeline
  # inteiro duas vezes por push, sem informação nova na segunda.
  #
  # POR QUE O `pull_request` É O QUE VALE: ele faz checkout do MERGE
  # SINTÉTICO (cabeça do PR fundida na base) — testa o que realmente entra.
  # O `push` testa só a cabeça da branch.
  #
  # O PREÇO: `Infra · imagens de container` não roda em PR (por segurança,
  # não publicamos no ghcr.io código não revisado), então uma mudança em
  # `.github/docker` só publica imagem depois do merge na develop. A sonda no
  # registro (`docker manifest inspect`) faz isso se recuperar sozinho.
  push:
    branches:
      - develop
      - main
    tags: ["v*"]
  pull_request:
    branches: [develop, main, "hotfix/**", "release/**"]
    # SEM `closed`: o fechamento de issues saiu daqui (#169) e virou o
    # workflow próprio `issues-fechamento.yml`. Manter `closed` aqui rodava o
    # pipeline INTEIRO (tudo `skipped`) só para um job que nem mora mais aqui.
    types: [opened, synchronize, reopened]
  schedule:
    # 06:30 UTC = 03:30 BRT — auditorias antes do expediente.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "release = criar rc · promote = rc → tag final · play = cortar tag pelo semver"
        type: choice
        options: [release, promote, play]
        required: false
        default: release
      source:
        description: "(release) de onde sai a release branch: develop = fluxo normal · main = hotfix"
        type: choice
        options: [develop, main]
        required: false
        default: develop
      version:
        description: "(release/promote) versão alvo sem o v, ex.: 0.2.0 — vazio = calcular pelos commits"
        type: string
        required: false
      # O input `update-snapshots` morava aqui e saiu (workflow
      # visual-baselines.yml): regenerar baseline é OPERAÇÃO DE TESTE e não
      # dividia o dispatch com release por acaso — o `action` de cima tem
      # `default: release`, então um dispatch com `action` vazio APLICava o
      # default e o `Release · RC` executava junto (run 38070949933 criou
      # branch release/0.2.0 + tag v0.2.0-rc.5 de um dispatch de baseline;
      # em 13/10 o mesmo default cortou o rc.5 de novo — revertido, issue
      # #204). Agora a regeneração tem workflow próprio, `contents: read`,
      # sem nenhum input de release para esquecer de preencher.
      publish-tag:
        description: "(opcional) publicar uma tag v* EXISTENTE (emergência)"
        type: string
        required: false

permissions:
  contents: read
  issues: write # achados de segurança (o fechamento de issues saiu p/ workflow próprio)
  actions: read # relatório de métricas (lista os jobs da run)
  packages: read # pull das imagens de CI no ghcr.io
  security-events: write # CodeQL

# Chave por PR/ref: push intermediário cancela a validação anterior. Em push de
# branch de integração NÃO cancela — a run do push é a prova daquela integração
# e pode ser referenciada por outro PR.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Imagens de CI (publicadas pelo job `Infra · imagens de container`).
  # ⚠️ `container.image` NÃO aceita o contexto `env` (a tabela do GitHub só
  # permite github/needs/strategy/matrix/vars/inputs ali) — por isso os jobs
  # de container repetem a ref literal, e `.github/scripts/validate_workflows.py`
  # trava que as duas sempre coincidem.
  CI_IMAGE_BASE: ghcr.io/${{ github.repository }}/ci-base:1
  CI_IMAGE_TAURI: ghcr.io/${{ github.repository }}/ci-linux:1
  # A identidade do bot (`BOT_NAME`/`BOT_EMAIL`) saiu daqui com a extração da
  # Release para `release-*.yml` (#245): `env:` de topo NÃO atravessa um
  # `workflow_call`, então ela vive — literal e igual nos três — nos arquivos que
  # commitam. O contrato 15 do `validate_workflows.py` trava a igualdade.

jobs:

  plan:
    name: Validação · plano e escopo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      branch-class: ${{ steps.plan.outputs.branch-class }}
      scope-rust: ${{ steps.plan.outputs.scope-rust }}
      scope-front: ${{ steps.plan.outputs.scope-front }}
      scope-spec: ${{ steps.plan.outputs.scope-spec }}
      # O escopo da MAQUINARIA de CI/release (#246): é ele que decide se o passo
      # `simulação do GitFlow` (~2 min) roda neste evento. Declarado aqui porque
      # `needs.plan.outputs.*` só existe para as chaves desta lista — o actionlint
      # pega a chave ausente, o `validate_workflows.py` trava a regra.
      scope-ci: ${{ steps.plan.outputs.scope-ci }}
      stage-test: ${{ steps.plan.outputs.stage-test }}
      stage-coverage: ${{ steps.plan.outputs.stage-coverage }}
      stage-security: ${{ steps.plan.outputs.stage-security }}
      stage-dist: ${{ steps.plan.outputs.stage-dist }}
      stage-release: ${{ steps.plan.outputs.stage-release }}
      rust-matrix: ${{ steps.plan.outputs.rust-matrix }}
      front-matrix: ${{ steps.plan.outputs.front-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff contra a base + tags

      - name: Diff contra a base do evento
        id: base
        run: |
          set -euo pipefail
          git fetch --tags --force
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          BEFORE="${{ github.event.before }}"
          REF="${{ github.ref }}"
          # TAG PUBLICA A ÁRVORE, NÃO UM DIFF (#228). Numa tag NOVA o `before`
          # é zeros e o else já dava ALL; numa tag MOVIDA, porém, `before` é
          # um SHA VÁLIDO (o alvo anterior) e o diff pode sair VAZIO — run
          # 38508338840: `CHANGED=(none)` → escopos false → testes, cobertura
          # e distribuição `skipped` → run VERDE com a tag publicada SEM
          # instalador e SEM Release. O `ci_plan.py` já classifica `tag` com
          # suíte + dist; o que falta é o plano enxergar a árvore inteira.
          if [ "${REF#refs/tags/}" != "$REF" ]; then
            BASE=""
          elif [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="" # schedule ou 1ª run: sem diff → tudo
          fi
          if [ -z "$BASE" ]; then
            CHANGED="ALL"
          else
            CHANGED="$(git diff --name-only "$BASE..HEAD" || true)"
            [ -z "$CHANGED" ] && CHANGED="(none)"
          fi
          # GITHUB_ENV (e não OUTPUT): o próximo step é outro processo e só vê
          # o que estiver no ambiente.
          {
            echo "CHANGED<<CHANGED_EOF"
            echo "$CHANGED"
            echo "CHANGED_EOF"
          } >> "$GITHUB_ENV"

      - name: Regra branch → estágios + matrizes
        id: plan
        env:
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
        run: python3 .github/scripts/ci_plan.py >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════════
  # LINT — estático; sempre; toda branch
  # ═══════════════════════════════════════════════════════════════════════
  lint-workflows:
    name: Lint · contratos do pipeline
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0`: os gates de doc (#275/#282) medem ANCESTRALIDADE e RANGE de
      # commit — no checkout raso de 1 commit o histórico da base não existe e a
      # pergunta fica sem resposta (~200 commits: o clone inteiro custa segundos).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # actionlint pega erro de EXPRESSAO que o parser Python nao pega:
      # `${{ }}` malformada, `if:` com tipo errado, matriz vazia, contexto de
      # expressao invalido. O `validate_workflows.py` cobre os CONTRATOS do
      # projeto; os dois juntos fecham workflow sintatico E semantico. Sem o
      # actionlint, um workflow pode passar no YAML e quebrar no runner.
      # actionlint via `docker run` com volume e workdir explicitos (caminho de
      # uso documentado do actionlint), e o `-ignore` NA LINHA DE COMANDO.
      #
      # Cinco formas foram tentadas ate a atual, e a lista fica aqui porque a
      # proxima tentara "simplificar" de novo:
      #   1) `docker://` + `args: -ignore '...'` — o `args:` vira argumento do
      #      `docker run` sem preservar aspas: `could not read "unknown'"`.
      #   2) `docker://` + `args: -config-file ...` — o ignore nao pegou.
      #   3) `docker://` sem `args:` (auto-descoberto) — nao pegou.
      #   4) `docker run -w /repo` sem `-config-file` (auto-descoberto) — nao
      #      pegou, com o workspace montado e o workdir na raiz.
      #   5) `docker run` + `-config-file .github/actionlint.yaml` — o arquivo
      #      estava commitado e no caminho certo, e o ignore MESMO nao pegou.
      # A (5) é a informativa: o problema nao era achar o arquivo. Num `run:`
      # de verdade o bash monta a linha antes do `docker`, então a flag de
      # linha de comando chega inteira — que era o que a (1) nao conseguia.
      #
      # O ignore e de UM rotulo e nada mais. `macos-15-intel` e real (runner
      # Intel do macOS 15, anunciado em set/2025 e disponivel ate ago/2027, a
      # ultima imagem x86_64 do Actions); a lista embutida do actionlint 1.7.7
      # e mais antiga e o acusa. Trocar o rotulo por `macos-latest` traria
      # arm64 e o build do shell Tauri deixaria de ser provado na arquitetura que o
      # `.dmg` exige. NAO transformar este ignore em rede: ele existe para um rotulo.
      - name: actionlint (expressões e contextos do runner)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 \
            -ignore 'label "macos-15-intel" is unknown'
      - name: sintaxe + contratos + empacotamento
        run: |
          # `pyyaml`/`jsonschema` vem do `pyproject.toml` (#80): isto e o fallback.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          # O gate de empacotamento (#71) estava escrito mas NAO LIGADO (o PACKAGING.md
          # afirmava que rodava aqui): mainBinaryName/.desktop/.deb/PKGBUILD divergiam em silencio.
          python3 .github/scripts/check_bundle.py
          python3 .github/scripts/sync_version.py --check
          python3 .github/scripts/validate_workflows.py
          # O contrato dos templates de issue (#170): secoes obrigatorias + prompt
          # auto-suficiente; sem ele, "enxugar template" mata a secao em silencio (#71).
          python3 .github/scripts/check_issue_templates.py
          # Os juízes do HARNESS (#249) e da DOCUMENTACAO (#270): regras que existiam
          # sem gate (caminho morto, skill que nao dispara, link/ancora, banner com data,
          # contador so no INDEX §6). A razao de cada um vive no docstring do script.
          python3 .github/scripts/check_harness.py
          python3 .github/scripts/check_docs.py
      # ── A OBSOLESCÊNCIA DO DOC TEM JUIZ (#275/#282) ─────────────────────
      - name: obsolescência da documentação (doc × módulo que ele descreve)
        # Link morto e estrutura (o #270 pega); aqui e link VIVO com conteudo morto: a
        # ultima revisao do doc contra a SUPERFICIE dos modulos que ele cita. `PR_BASE`
        # liga a PREVISAO DO SQUASH (#282): no PR o par e medido DENTRO do range, porque
        # a ancestralidade por arquivo nao responde quando o corte nasceu na branch e a
        # revisao do doc chegou depois pelo merge da base.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check_docs_modulos.py
      # ── A SIMULAÇÃO DO GITFLOW É CONDICIONAL (#246, achado F-13) ─────────
      #
      # `simulate_release.py` executa a cadeia rc→promote DE VERDADE num sandbox git
      # (~2 min): em TODO PR isso era custo, e o risco real mora em PR que toca a
      # maquinaria de release. A regra é do `ci_plan.py` (`scope-ci`), NUNCA um `if:`
      # à mão — contrato 5; `CHANGED=ALL` (tag, schedule, dispatch) mantém a cadeia provada.
      - name: simulação do GitFlow (cadeia rc→promote)
        if: needs.plan.outputs.scope-ci == 'true'
        run: |
          # Os self-checks dos juízes H1/H2 saíram com a dissolução de `scripts/` (#168):
          # viraram histórico em `docs/arquivo/scripts-era-RE/` (INDEX §6).
          python3 .github/scripts/simulate_release.py

  lint-commits:
    name: Lint · mensagens de commit
    needs: plan
    # Não roda em tag (não há "commit novo" a checar) nem em schedule/dispatch.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: conventional commits
        run: python3 .github/scripts/check_commits.py
      - name: auditoria de movimento (trailer `Move-only:`)
        # #263: o commit que declara movimento puro prova, contra o PAI, que nao perdeu nem
        # reescreveu linha (sem trailer o gate nao audita nada). A base vem do mesmo lugar
        # que o `plan` usa. O squash do GitHub e caso de movimento: o diff aqui e o PR
        # INTEIRO — o trailer sobrevive no corpo do squash — e o range inteiro e auditado
        # como o squash que o merge vai criar (#264), onde da para consertar. Detalhes no
        # docstring de `check_move_only.py`.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/check_move_only.py

  lint-rust-fmt:
    name: Lint · Rust (fmt)
    needs: plan
    if: needs.plan.outputs.scope-rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          # `cargo fmt` não compila nada: o cache aqui só custaria GB.
          cache: "false"
      - name: workspace da raiz
        run: cargo fmt --check
      - name: workspace da api
        working-directory: packages/app/api
        run: cargo fmt -- --check
      - name: orcamento de tamanho (front + Rust)
        # O gate e um so, e ele olha os DOIS lados do IPC: o front (#82) e os
        # `.rs` de `packages/*/src` (#248). Ele roda aqui — no job de escopo
        # RUST — porque o `lint-ui` so existe quando o front muda, e foi
        # exatamente por isso que `actor.rs` chegou a 2 702 linhas sem freio.
        # Custa segundos: e Python puro, sem dependencia para instalar.
        run: python3 .github/scripts/check_module_size.py

  lint-rust-clippy:
    name: Lint · Rust (clippy · ${{ matrix.project }} · ${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.scope-rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    # Arch (#169): `host`/`container` só existem na entrada `archlinux` —
    # expressão vazia = roda direto no runner hospedado, sem container.
    runs-on: ${{ matrix.host || matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
    timeout-minutes: 30
    env:
      # ADR-7: MSVC no workspace da api (Tauri), GNU no da raiz (cli de campo).
      # A toolchain vem daqui porque `matrix` é o único contexto disponível em
      # env de job — `runner.os` só existe em step.
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && (matrix.workdir == 'packages/app/api' && 'stable-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-gnu') || 'stable' }}
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v7
      # Arch (#169) é CONTAINER: a imagem `base-devel` não traz rustup, e numa
      # distro rolling o `pacman -Syu` antes de instalar é obrigatório (a
      # imagem é um snapshot do dia do build). Toolchain = o mesmo `stable` dos
      # outros Linux (RUSTUP_TOOLCHAIN do job), com clippy/rustfmt pro gate.
      - name: toolchain do Arch (container sem rustup pré-instalado)
        if: matrix.os == 'archlinux'
        # Em job de container o runner assume `sh` como default do `run` —
        # e `set -o pipefail` é bash. O Arch tem bash, então declarar é mais
        # barato do que descobrir na run.
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed rustup
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
      - uses: ./.github/actions/setup-rust
        with:
          workdir: ${{ matrix.workdir }}
          shared-key: ${{ matrix.project == 'ui-rust' && 'ws-api' || 'ws-raiz' }}
      # O Arch TAMBÉM é Linux no `runner.os`, mas é container pacman — não tem
      # `apt`. Por isso o guard é por `matrix.os` e não por `runner.os` (#169).
      - name: deps de sistema do ALSA (ubuntu — cli)
        if: matrix.project == 'cli' && matrix.os == 'ubuntu-24.04'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev
          version: 1.0
      - name: deps de sistema do ALSA (archlinux — cli)
        if: matrix.project == 'cli' && matrix.os == 'archlinux'
        # `-S` sem `-Sy`: o `pacman -Syu` do passo de toolchain já sincronizou
        # o banco nesta mesma job.
        run: pacman -S --noconfirm --needed alsa-lib pkgconf
      - name: front (o `generate_context!` do Tauri embute ui/dist)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/setup-node-pnpm
      - name: front (build)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/build-front
      - name: clippy
        run: |
          cargo clippy -p ${{ matrix.project == 'ui-rust' && 'gp100-ui' || format('gp100-{0}', matrix.project) }} --all-targets -- -D warnings
      - name: clippy (build de campo do app — feature real-device)
        # Sem isto, o `DeviceActor`/`abrir_backend`/`impl DeviceBackend for
        # RealDevice` do crate do Tauri nunca sao compilados por NINGUEM: o
        # job normal usa o default (mock) e o job de release compila sem a
        # feature. O caminho do aparelho real do APP seria, literalmente, codigo
        # so compilado na maquina de quem tem a pedaleira.
        #
        # `real-device` liga o `midir`, e ele e um backend DIFERENTE por SO:
        # WinMM no Windows, ALSA no Linux (passo acima), CoreMIDI no macOS.
        # Por isso a matriz do `ui-rust` tem os TRES OS (`.github/scripts/ci_plan.py`:
        # a entrada do macOS voltou em 05/10) — compilar em um so nao prova o
        # outro, e o CoreMIDI sem cobertura era o unico motivo tecnico que
        # sobrava para o `gp100-cli` existir.
        if: matrix.project == 'ui-rust'
        run: cargo clippy -p gp100-ui --features real-device --all-targets -- -D warnings

  lint-ui:
    name: Lint · UI (eslint)
    needs: plan
    if: needs.plan.outputs.scope-front == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: eslint (inclui a regra local/no-user-literals)
        working-directory: packages/app/ui
        run: pnpm lint
      - name: export orfao (todo export de src/ tem consumidor)
        # Cobre 100% nao prova que o contrato e consumivel: um arquivo 100%
        # coberto cujos exports ninguem chama e o pior dos dois (#78).
        run: python3 .github/scripts/check_deadcode.py
      - name: orcamento de tamanho (front + Rust)
        # A #82 cortou o App.tsx de 514 para 274 linhas e escreveu um numero.
        # Numero sem gate se cumpre no dia do PR e se esquece depois. Desde a
        # #248 o mesmo script mede os `.rs` de `packages/*/src` (teto em
        # docs/dev/ARCHITECTURE.md §4) e as coortes do actor (§4.1).
        run: python3 .github/scripts/check_module_size.py

# ═══════════════════════════════════════════════════════════════════════
  # COMPILAÇÃO — verificação; sempre (build ≠ distribuição)
  #
  # Não confunda com o estágio 7 (dist): aqui `cargo check`/`tsc` provam que
  # COMPILA, que é o gate de merge. Gerar `.msi`/`.dmg`/`.deb` é outro job,
  # em outra branch, com outro custo. Sem essa separação, o `cargo build
  # --release` que estava dentro da matriz de validação publicava artefato de
  # campo a cada push de PR.
  # ═══════════════════════════════════════════════════════════════════════
  build-rust:
    name: Compilação · Rust (cargo check · ${{ matrix.project }} · ${{ matrix.os }})
    # Compilação ← Lint (#169): o grafo do dono é validação → lint →
    # compilação → segurança → testes → cobertura → dist → release. O custo é
    # serializar o que já era pago em paralelo; o ganho é que lint vermelho
    # não gasta mais compile-time de build/test atrás dele.
    needs: [plan, lint-rust-fmt, lint-rust-clippy]
    if: needs.plan.outputs.scope-rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    # Arch (#169): `host`/`container` só existem na entrada `archlinux` —
    # expressão vazia = roda direto no runner hospedado, sem container.
    runs-on: ${{ matrix.host || matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && (matrix.workdir == 'packages/app/api' && 'stable-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-gnu') || 'stable' }}
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v7
      # Arch (#169) é CONTAINER: a imagem `base-devel` não traz rustup, e numa
      # distro rolling o `pacman -Syu` antes de instalar é obrigatório (a
      # imagem é um snapshot do dia do build). Toolchain = o mesmo `stable` dos
      # outros Linux (RUSTUP_TOOLCHAIN do job), com clippy/rustfmt pro gate.
      - name: toolchain do Arch (container sem rustup pré-instalado)
        if: matrix.os == 'archlinux'
        # Em job de container o runner assume `sh` como default do `run` —
        # e `set -o pipefail` é bash. O Arch tem bash, então declarar é mais
        # barato do que descobrir na run.
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed rustup
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
      - uses: ./.github/actions/setup-rust
        with:
          workdir: ${{ matrix.workdir }}
          shared-key: ${{ matrix.project == 'ui-rust' && 'ws-api' || 'ws-raiz' }}
      # O Arch TAMBÉM é Linux no `runner.os`, mas é container pacman — não tem
      # `apt`. Por isso o guard é por `matrix.os` e não por `runner.os` (#169).
      - name: deps de sistema do ALSA (ubuntu — cli)
        if: matrix.project == 'cli' && matrix.os == 'ubuntu-24.04'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev
          version: 1.0
      - name: deps de sistema do ALSA (archlinux — cli)
        if: matrix.project == 'cli' && matrix.os == 'archlinux'
        # `-S` sem `-Sy`: o `pacman -Syu` do passo de toolchain já sincronizou
        # o banco nesta mesma job.
        run: pacman -S --noconfirm --needed alsa-lib pkgconf
      - name: front (o `generate_context!` do Tauri embute ui/dist)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/setup-node-pnpm
      - name: front (build)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/build-front
      - name: check
        run: |
          cargo check -p ${{ matrix.project == 'ui-rust' && 'gp100-ui' || format('gp100-{0}', matrix.project) }} --all-targets
      - name: check (build de campo do app — feature real-device)
        # Mesmo motivo do passo de clippy: e o unico lugar ( alem do container
        # Linux) onde o backend do app e compilado COM o `RealDevice`. A
        # matriz do `ui-rust` cobre os TRES OS, entao o CoreMIDI do macOS
        # entrou com o resto (`.github/scripts/ci_plan.py::matrices`, 05/10).
        if: matrix.project == 'ui-rust'
        run: cargo check -p gp100-ui --features real-device,write-verified --all-targets

  build-ui:
    name: Compilação · UI (tsc + vite · ${{ matrix.os }})
    needs: [plan, lint-ui]
    if: needs.plan.outputs.scope-front == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.front-matrix) }}
    # Arch (#169): mesma alavanca das jobs de matriz Rust — ver ci_plan.py.
    runs-on: ${{ matrix.host || matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: tsc + vite
        uses: ./.github/actions/build-front

# ═══════════════════════════════════════════════════════════════════════
  # INFRA — imagens de container do próprio CI (ghcr.io)
  #
  # Ferramenta do pipeline, não artefato de usuário — e é a Única parte do
  # grafo sem dependência: os jobs que consomem imagem (sec-audit, test-spec,
  # test-e2e-webview) precisam dela pronta, então ela roda independente, ao
  # lado do lint, e nunca atrasa ninguém por ser lenta.
  # ═══════════════════════════════════════════════════════════════════════
  ci-images:
    name: Infra · imagens de container
    # Publicar é infraestrutura do repo (a imagem é versionada, com tag
    # `sha-<curto>` de auditoria). Publica quando a DEFINIÇÃO mudou — em
    # qualquer branch, porque é isso que destrava o bootstrap: os jobs que
    # consomem a imagem morrem no pull enquanto ela não existe no ghcr.io, e
    # esperar o merge para publicá-la deixaria o PR que a introduz vermelho.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push no ghcr.io
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ci-linux
            file: .github/docker/ci-linux/Dockerfile
          - name: ci-base
            file: .github/docker/ci-base/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Uma tag invalida no FROM morre DEPOIS de o runner subir as camadas
      # anteriores, e a saida (`docker.io/library/rust:bookworm-slim: not
      # found`) nao diz que a tag foi montada por concatenacao de ARG. Aqui
      # custa um HEAD por imagem, antes do build.
      - name: as imagens base existem no registro?
        run: python3 .github/scripts/check_base_images.py
      - name: a definição da imagem mudou nesta run?
        id: dirty
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            CHANGED="$(git ls-files .github/docker)"
          else
            CHANGED="$(git diff --name-only "$BASE..HEAD" -- .github/docker || true)"
          fi
          if [ -n "$CHANGED" ]; then
            echo "mudou: $(echo "$CHANGED" | tr '\n' ' ')"
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "sem mudança em .github/docker"
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi
      # O login NÃO é condicional: sem ele não dá para sondar a tag, e sem
      # sondar não dá para decidir. Era aqui que o bootstrap morria.
      - name: login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: a tag :1 já existe no registro?
        id: probe
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}:1
        run: |
          set -uo pipefail
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "registro tem $IMAGE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "registro NAO tem $IMAGE — precisa do bootstrap"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Publicar quando a DEFINIÇÃO mudou **ou** a tag não existe no registro.
      # Só o diff não basta: o commit que introduz a imagem pode ter morrido
      # antes de publicar (a run que subiu este Dockerfile died no LOAD), e aí
      # nenhum diff futuro tocaria `.github/docker` — a imagem nunca existiria
      # e todo job que a consome morreria em `manifest unknown` para sempre.
      # A sonda torna o pipeline auto-curativo: sumiu do registro, volta.
      - name: decidir se publica
        id: plano
        env:
          DIRTY: ${{ steps.dirty.outputs.dirty }}
          EXISTS: ${{ steps.probe.outputs.exists }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [ "$DIRTY" = "true" ] || [ "$EXISTS" = "false" ]; then
            echo "publicando $NAME (definição mudou: $DIRTY | tag no registro: $EXISTS)"
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME intocada e já publicada — nada a fazer"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.plano.outputs.publicar == 'true'
      - name: tags (:1 estável + sha-<curto> auditável)
        id: meta
        if: steps.plano.outputs.publicar == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=1
            type=sha,format=short,prefix=sha-
      - name: build + push
        if: steps.plano.outputs.publicar == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # O passo que impede o "verde que não publicou". Um job que decidiu
      # publicar e terminou sem confirmar nada no registro é FALHA, não sucesso:
      # verde sem imagem é pior que vermelho, porque o consome só quebra depois,
      # em outro job, com `manifest unknown` e sem ligação com a causa.
      - name: a imagem realmente chegou ao registro?
        if: steps.plano.outputs.publicar == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}:1
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "confirmada no registro: $IMAGE"
              exit 0
            fi
            echo "ainda não propagou ($i/5), esperado logo apos o push"
            sleep 10
          done
          echo "::error::publicou mas $IMAGE continua ausente no ghcr.io — o consome vai morrer em manifest unknown"
          exit 1
      - name: resumo
        if: steps.plano.outputs.publicar == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 🐳 Imagem de CI publicada"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: nada a publicar
        if: steps.plano.outputs.publicar != 'true'
        run: |
          {
            echo "### 🐳 Imagem de CI"
            echo ""
            echo "Sem mudança em \`.github/docker\` e a tag \`:1\` já está no ghcr.io."
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════
  # SEGURANÇA — auditorias de dependência
  #
  # NÃO bloqueia o merge, e essa é uma decisão: `glib` é uma advisory
  # documentada em SECURITY.md sem upgrade possível com o Tauri 2 — um gate
  # que sempre falha treina o time a ignorar o vermelho. A DETECÇÃO é a
  # issue de achados; a REMEDIAÇÃO é o dependabot.yml.
  #
  # CodeQL NÃO mora aqui: o repositório já tem o setup PADRÃO ligado (5
  # linguagens: rust, javascript, cpp, python, actions) e o GitHub recusa
  # SARIF de configuração avançada enquanto ele estiver ativo ("CodeQL
  # analyses from advanced configurations cannot be processed when the
  # default setup is enabled"). Configurar o CodeQL aqui só criava conflito.
  # ═══════════════════════════════════════════════════════════════════════
  sec-audit:
    name: Segurança · auditorias de dependência
    # Segurança ← Compilação (#169): a política do dono coloca a auditoria
    # DEPOIS da compilação e ANTES dos testes. O `always()` do `if` é o que
    # faz isto funcionar quando um dos dois `build-*` foi skipped (PR de docs:
    # sem escopo Rust/front) — `skipped` não bloqueia, `failure` sim.
    needs: [plan, ci-images, build-rust, build-ui]
    if: always() && needs.plan.outputs.stage-security == 'true' && needs.ci-images.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}/ci-base:1
    env:
      # O pin gnu do rust-toolchain.toml da raiz quebra o cargo no Linux.
      RUSTUP_TOOLCHAIN: stable
    permissions:
      contents: read
      issues: write
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: cargo-audit (binário pré-compilado)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (workspace da raiz)
        id: cargo_audit
        continue-on-error: true
        run: cargo audit --file Cargo.lock 2>&1 | tee /tmp/cargo-audit.txt
      - name: cargo audit (gp100-ui — lockfile próprio, ADR-7)
        id: cargo_audit_ui
        continue-on-error: true
        working-directory: packages/app/api
        run: cargo audit --file Cargo.lock 2>&1 | tee /tmp/cargo-audit-ui.txt
      - name: instalar uv
        uses: astral-sh/setup-uv@v10.3.0
      - uses: ./.github/actions/setup-node-pnpm
        with:
          # `pnpm audit` lê o lockfile; instalar a árvore inteira aqui só
          # custaria tempo — a imagem não tem store aquecido de propósito.
          install: "false"
      - name: pnpm audit (runtime do front)
        id: pnpm_audit
        continue-on-error: true
        working-directory: packages/app/ui
        run: pnpm audit --prod 2>&1 | tee /tmp/pnpm-audit.txt
      - name: pnpm outdated (informativo — não falha)
        if: always()
        continue-on-error: true
        working-directory: packages/app/ui
        run: pnpm outdated 2>&1 | tee /tmp/pnpm-outdated.txt || true
      - name: trava da especificação (pytest — a garantia da RE)
        if: always()
        run: |
          uv sync --all-groups
          uv run pytest
      - name: registrar o resultado de cada auditoria
        # Direcionado a arquivo, não a env: `steps.<id>.outcome` só é
        # disponivel dentro de um step, e o relatorio e um script separado.
        if: always()
        run: |
          {
            echo "cargo_audit(workspace)=${{ steps.cargo_audit.outcome }}"
            echo "cargo_audit(gp100-ui)=${{ steps.cargo_audit_ui.outcome }}"
            echo "pnpm_audit(runtime)=${{ steps.pnpm_audit.outcome }}"
          } > .audit-outcomes
          cat .audit-outcomes
      - name: achado = issue na FASE ACHADOS
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/security_report.py

  # ═══════════════════════════════════════════════════════════════════════
  # TESTES — unit · integração · e2e shell · e2e visual · e2e webview
  # ═══════════════════════════════════════════════════════════════════════
  test-rust:
    name: Testes · Rust (cargo test · ${{ matrix.project }} · ${{ matrix.os }})
    # Testes ← Segurança (#169): se a auditoria quebrou (falha de infra), o
    # teste não roda atrás — a run já está vermelha e o `Relatório` explica.
    #
    # O `always()` + guards EXPLÍCITOS não são estilo: sem eles o `success()`
    # implícito pulava a fase de testes INTEIRA quando a cadeia tinha qualquer
    # job skipped (run 38168716758: `sec-audit` verde e `test-rust`/`test-ui`
    # skipped; actions/runner#2205). `skipped` de upstream não bloqueia aqui;
    # `failure` bloqueia.
    needs: [plan, build-rust, sec-audit]
    if: always() && needs.plan.outputs.scope-rust == 'true' && needs.plan.outputs.stage-test == 'true' && needs.build-rust.result != 'failure' && needs.sec-audit.result != 'failure'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    # Arch (#169): `host`/`container` só existem na entrada `archlinux` —
    # expressão vazia = roda direto no runner hospedado, sem container.
    runs-on: ${{ matrix.host || matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && (matrix.workdir == 'packages/app/api' && 'stable-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-gnu') || 'stable' }}
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v7
      # Arch (#169): ver o mesmo passo em `Lint · Rust (clippy)` — a imagem
      # `base-devel` não traz rustup e a rolling exige `pacman -Syu` antes.
      - name: toolchain do Arch (container sem rustup pré-instalado)
        if: matrix.os == 'archlinux'
        # Em job de container o runner assume `sh` como default do `run` —
        # e `set -o pipefail` é bash. O Arch tem bash, então declarar é mais
        # barato do que descobrir na run.
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed rustup
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
      - uses: ./.github/actions/setup-rust
        with:
          workdir: ${{ matrix.workdir }}
          shared-key: ${{ matrix.project == 'ui-rust' && 'ws-api' || 'ws-raiz' }}
          # O MSVC é a perna mais cara que resta (issue #41): aqui vale cortar
          # o rebuild do gp100-ui, que é o que domina esse tempo.
          cache-workspace-crates: ${{ matrix.project == 'ui-rust' && matrix.os == 'windows-latest' && 'true' || 'false' }}
      # O Arch TAMBÉM é Linux no `runner.os`, mas é container pacman — não tem
      # `apt`. Por isso o guard é por `matrix.os` e não por `runner.os` (#169).
      - name: deps de sistema do ALSA (ubuntu — cli)
        if: matrix.project == 'cli' && matrix.os == 'ubuntu-24.04'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev
          version: 1.0
      - name: deps de sistema do ALSA (archlinux — cli)
        if: matrix.project == 'cli' && matrix.os == 'archlinux'
        # `-S` sem `-Sy`: o `pacman -Syu` do passo de toolchain já sincronizou
        # o banco nesta mesma job.
        run: pacman -S --noconfirm --needed alsa-lib pkgconf
      - name: front (o `generate_context!` do Tauri embute ui/dist)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/setup-node-pnpm
      - name: front (build)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/build-front
      - name: testes
        if: matrix.project == 'cli'
        run: cargo test -p gp100-cli --features real-device
      # O gate de escrita (H2/ADR-5) é uma FEATURE de compilação: nada garante
      # que ela ainda compile depois de mexer na Session ou no transporte, e
      # um binário de campo quebrado só se descobre com a pedaleira na mão.
      # Por isso o CLI é testado nos DOIS modos. `escrita_verificada_segue_a_
      # feature` só existe com a feature ligada — é o que prova que a trava
      # segue a build e não um default silencioso.
      - name: testes (build de escrita — feature write-verified)
        if: matrix.project == 'cli'
        run: cargo test -p gp100-cli --features real-device,write-verified
      - name: testes
        if: matrix.project != 'cli'
        run: cargo test -p ${{ matrix.project == 'ui-rust' && 'gp100-ui' || 'gp100-core' }}
      # `cargo test` compila o bin-alvo COMO HARNESS (`--test`), e o artefato
      # fica em target/debug/deps/gp100_cli-<hash>, não em
      # `target/debug/gp100-cli.exe`. Quem produz o binário de verdade é
      # `cargo build`. O build de distribution foi para o estagio 7 na #68 e o
      # smoke ficou sem insumo — o job reprovava com exit 127 ("command not
      # found") parecendo que o smoke estava quebrado.
      - name: binário do smoke (o `cargo test` acima não produz o .exe)
        if: runner.os == 'Windows' && matrix.project == 'cli'
        run: cargo build -p gp100-cli --features real-device
      - name: smoke da política de hardware (o stack de campo é WinMM)
        if: matrix.project == 'cli' && runner.os == 'Windows'
        uses: ./.github/actions/hardware-smoke
        with:
          profile: debug

  test-ui:
    name: Testes · UI (vitest)
    # `always()` + guards explícitos: ver o comentário do `test-rust` — o
    # `success()` implícito pulava este job quando a cadeia tinha skipped.
    needs: [plan, build-ui, sec-audit]
    if: always() && needs.plan.outputs.scope-front == 'true' && needs.plan.outputs.stage-test == 'true' && needs.build-ui.result != 'failure' && needs.sec-audit.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: vitest
        working-directory: packages/app/ui
        run: pnpm exec vitest run

  test-spec:
    name: Testes · Especificação (pytest)
    needs: [plan, ci-images, sec-audit]
    # O `always()` é o que deixa este job atrás de um `ci-images` skipped (a
    # imagem já publicada serve); o `!= 'failure'` é o gate: imagem ou
    # auditoria vermelha = este job não roda (#169 — segurança antes dos testes).
    if: always() && needs.plan.outputs.scope-spec == 'true' && needs.plan.outputs.stage-test == 'true' && needs.ci-images.result != 'failure' && needs.sec-audit.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/${{ github.repository }}/ci-base:1
    steps:
      - uses: actions/checkout@v7
      - name: instalar uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: sync do ambiente (capstone, pefile, ziglang, pytest)
        run: uv sync --all-groups
      - name: golden, baseline versionada, knob_map e fixtures
        run: uv run pytest
      # ── OS TRÊS GATES DE DADOS QUE SÓ O `gates.py` LOCAL RODAVA (#273) ──
      # `byte_order`, `param_ranges` e `state_pages` estavam na lista do
      # `gates.py` e em NENHUM passo do CI: o gate existia, alguém confiava
      # nele, e quem reprovava era o `gates.py` — que só roda na máquina de
      # quem lembra de rodar. O `byte_order` não tinha cobertura nenhuma (gate
      # morto desde o #23); o `param_ranges --check` e o `state_pages` também
      # rodam DENTRO do pytest logo acima, mas o passo próprio é o que deixa o
      # veredito visível no log — a mesma razão do passo da baseline abaixo.
      # O contrato 16 do `validate_workflows.py` cobra os três daqui, então
      # apagar qualquer uma destas linhas reprova o `Lint · contratos do
      # pipeline`.
      - name: fio real é LE (effectCode u32 — par do H2)
        run: uv run python tools/check_byte_order.py
      - name: trava de conteúdo do knob (639 faixas + 92 amostras reais)
        run: uv run python tools/param_ranges.py --check
      - name: layout das páginas 13xx contra o artefato embutido
        run: uv run python tools/validate_state_pages.py
      # O pytest já cobre `baseline.py --check` (o teste
      # `test_golden_baseline_hash_unchanged` chama o gate), mas rodar o
      # comando aqui deixa o número da baseline VISÍVEL no log do job. Sem
      # isso, quem quiser saber de qual versão o golden está tem que abrir
      # o tools/baseline.json e recontar o sha.
      - name: baseline do golden (versão + hash + motivo)
        run: uv run python tools/baseline.py show
      # Prova de que o juiz do H3 roda — e o que garante que o caminho de
      # entrada da captura do gp100-core existe de fato (antes da #23 o
      # build_golden carregava 0 eventos de um log do core).
      - name: juiz da captura do core (self-check do normalizador)
        run: |
          uv run python tools/wirelog.py packages/core/data/fixtures/knobs.jsonl > /dev/null
          uv run python tools/validate_core_capture.py packages/core/data/fixtures/knobs.jsonl

  test-e2e:
    name: Testes · E2E shell (Chromium)
    # `always()` + guards explícitos: ver o comentário do `test-rust`.
    needs: [plan, build-ui, sec-audit]
    if: always() && needs.plan.outputs.scope-front == 'true' && needs.plan.outputs.stage-test == 'true' && needs.build-ui.result != 'failure' && needs.sec-audit.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/playwright-setup
      - name: suíte e2e (o playwright.config sobe o dev server sozinho)
        working-directory: packages/app/ui
        # SKIP_VISUAL=1 tira o visual.spec.ts: as baselines têm o job delas
        # logo abaixo (`test-e2e-visual`). Sem isto elas rodavam DUAS vezes por
        # PR, e como o arquivo é serial num worker só, ele virava o gargalo do
        # job inteiro.
        env:
          SKIP_VISUAL: "1"
        run: pnpm exec playwright test

  test-e2e-visual:
    name: Testes · E2E visual (baseline por plataforma)
    # `always()` + guards explícitos: ver o comentário do `test-rust`.
    needs: [plan, build-ui, sec-audit]
    if: always() && needs.plan.outputs.scope-front == 'true' && needs.plan.outputs.stage-test == 'true' && needs.build-ui.result != 'failure' && needs.sec-audit.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/playwright-setup
      - name: comparar (o CI só compara — regenerar é outro workflow)
        working-directory: packages/app/ui
        # A comparação é o ÚNICO papel deste job: o default do playwright é
        # comparar e FALHAR no que faltar, e o ci.yml não tem mais alavanca de
        # escrita nenhuma (a expressão `inputs['update-snapshots'] && ...` saiu
        # junto com o input). Regenerar as baselines `-linux` é o workflow
        # dedicado `visual-baselines.yml` — dispatch próprio, contents: read,
        # sem input de release ao lado. Motivo do corte: o dispatch com o
        # input vazio aplicava o `default: release` do `action` e o job
        # `Release · RC` cortava tag junto com a regeneração (runs 38070949933
        # e a do incidente rc.5 de 13/10, issue #204).
        run: pnpm exec playwright test visual.spec.ts
      - name: baselines/diffs como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: packages/app/ui/e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  test-e2e-webview:
    name: Testes · E2E webview (shell Tauri real)
    needs: [plan, build-rust, ci-images, sec-audit]
    if: always() && (needs.plan.outputs.scope-front == 'true' || needs.plan.outputs.scope-rust == 'true') && needs.plan.outputs.stage-test == 'true' && needs.ci-images.result != 'failure' && needs.sec-audit.result != 'failure'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}/ci-linux:1
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          shared-key: ws-api
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/build-front
      - name: build debug do shell (dist embutido, backend mock)
        working-directory: packages/app/api
        run: cargo build -p gp100-ui
      # O backend com aparelho real do APP só é compilado aqui: no Windows
      # (passo `ui-rust` de lint/check) e neste container Linux, que já tem o
      # ALSA e o WebKitGTK. Sem estes dois passos, `abrir_backend`,
      # `AppDevice` e o `impl DeviceBackend for RealDevice` do crate do Tauri
      # seriam código que SÓ a máquina de quem tem a pedaleira compila.
      #
      # O macOS NÃO precisa deste container: o `ui-rust` da matriz roda lá
      # desde 05/10 e cobre o CoreMIDI do mesmo jeito que este cobre o ALSA.
      # Este passo continua porque prova o `real-device` no MESMO container
      # que roda o e2e do webview (WebKitGTK + ALSA juntos), que é uma
      # combinação que o runner do macOS não reproduz.
      - name: check do backend com aparelho real (ALSA — Linux)
        working-directory: packages/app/api
        run: cargo check -p gp100-ui --features real-device --all-targets
      # Lição (run 36943668915): build DEBUG carrega o `devUrl` do
      # tauri.conf.json — o dist embutido só entra em RELEASE. Servimos o dist
      # de produção na devUrl: o smoke segue provando o WEBVIEW, que é o
      # objeto dele.
      - name: servir o dist na devUrl
        working-directory: packages/app/ui
        run: |
          nohup pnpm exec vite preview --port 5173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && { echo "preview no ar na :5173"; exit 0; }
            sleep 0.5
          done
          echo "::error::preview não subiu:"; cat /tmp/preview.log; exit 1
      - name: smoke (xvfb + tauri-driver)
        working-directory: packages/app/ui
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a node e2e/tauri.smoke.mjs

# ═══════════════════════════════════════════════════════════════════════
  # COBERTURA (job próprio: a régua é uma Métrica com GATE, não
  # parte de "os testes passaram")
  # ═══════════════════════════════════════════════════════════════════════
  coverage-ui:
    name: Cobertura · UI (gate 85%)
    # Cobertura ← Testes (#169): a régua de 85% só faz sentido depois que os
    # testes de comportamento passaram — cobertura de teste quebrado é número
    # bonito em cima de vermelho. `always()` + guards explícitos: ver o
    # comentário do `test-rust` (o `success()` implícito pulava a fase).
    needs: [plan, build-ui, test-ui]
    if: always() && needs.plan.outputs.scope-front == 'true' && needs.plan.outputs.stage-coverage == 'true' && needs.build-ui.result != 'failure' && needs.test-ui.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: vitest com instrumentação + gate
        working-directory: packages/app/ui
        run: pnpm test:coverage
      # `json-summary` é o que o estágio de métricas lê — sem ele o relatório
      # agregaria zero números (e a régua viraria decoração).
      - name: resumo em JSON para o estágio de métricas
        if: always()
        working-directory: packages/app/ui
        run: pnpm exec vitest run --coverage.reporter=json-summary --coverage.reporter=text
      - name: publicar o resumo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cov-ui
          path: packages/app/ui/coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

# ═══════════════════════════════════════════════════════════════════════
  # DISTRIBUIÇÃO — só na tag (artefato de usuário)
  #
  #   Distribuição · instalador  gera o instalador por plataforma
  #   Distribuição · tarball de fonte  insumo do PKGBUILD do Arch (#72)
  #   Distribuição · CLI de campo  o binário + kit do gate H1
  #
  # A numeração de outrora ("7 dist · ui") era do prefixo numérico de nome,
  # que o owner pediu para tirar: a lista de checks do PR sai em ordem
  # ALFABÉTICA, então o número era o único vestígio da ordem real — e a ordem
  # real agora está no grafo `needs:` e no `Relatório · resumo da run`.
  # ═══════════════════════════════════════════════════════════════════════
  dist-ui:
    name: Distribuição · instalador (${{ matrix.os }})
    # DISTRIBUIÇÃO: só quando existe versão para publicar. Nada aqui roda em
    # PR, feature ou develop — um `.msi` por push seria desperdício.
    # Dist ← Cobertura (#169): o instalador só sai depois da suíte e da régua
    # de 85% — a cadeia toda é transitiva (coverage ← test-ui ← build-ui ← lint-ui).
    #
    # O CORPO vive em `.github/workflows/dist-instalador.yml` (#245). O que fica
    # AQUI é o que o nome do check mostra e o que decide se roda: a matriz de SO
    # ("Distribuição · instalador (windows-latest)") e o `if` do stage-dist.
    # Num job que usa `uses:` o nome exibido é `<caller> / <job chamado>` quando
    # ele RODA (tag/dispatch); quando o caller é `skipped` (todo PR), o check
    # aparece com o nome do caller, igual a antes — required check não muda.
    needs: [plan, coverage-ui]
    if: needs.plan.outputs.stage-dist == 'true'
    strategy:
      fail-fast: false
      matrix:
        # BUNDLES SEM VÍRGULA (#230): no runner Windows o `run:` padrão é
        # PowerShell, onde `nsis,msi` é uma expressão de ARRAY — o PowerShell
        # junta o array com espaço ao chamar um comando nativo, e o `tauri`
        # recebe UM argumento `nsis msi` (`invalid value 'nsis msi' for
        # '--bundles'`, run 38553264817). Valores separados por espaço são
        # aceitos nos DOIS shells (o clap do tauri declara
        # `--bundles [<BUNDLES>...]`), então o formato e o mesmo nos 3 SOs.
        include:
          - os: windows-latest
            args: --bundles nsis msi
          - os: macos-15-intel
            args: --bundles app dmg
          - os: ubuntu-24.04
            args: --bundles deb appimage
    permissions:
      contents: write # anexar na Release
      issues: read
      actions: read
      packages: read
    uses: ./.github/workflows/dist-instalador.yml
    with:
      os: ${{ matrix.os }}
      bundles: ${{ matrix.args }}
  dist-sdist:
    name: Distribuição · tarball de fonte (insumo do Arch)
    # Dist ← Cobertura (#169), mesma razão do `dist-ui` — e este tarball é o
    # insumo do PKGBUILD do Arch (#72), o empacotamento "nativo" do 4o OS.
    # O PKGBUILD (#29) compila deste tarball e, ate #72, ele NAO ERA PUBLICADO:
    # `makepkg` procuraria um arquivo inexistente. Alem disso o tarball do git
    # nao tem `packages/app/ui/dist` (gitignored, e o `frontendDist` do conf) nem
    # `packages/core` (dependencia de caminho do crate do Tauri) — o
    # `make_sdist.py` junta os tres e sobe o front antes de empacotar.
    #
    # O CORPO vive em `.github/workflows/dist-sdist.yml` (#245).
    needs: [plan, coverage-ui]
    if: needs.plan.outputs.stage-dist == 'true'
    permissions:
      contents: write # anexar na Release
      issues: read
      actions: read
      packages: read
    uses: ./.github/workflows/dist-sdist.yml
  dist-cli:
    name: Distribuição · CLI de campo (Windows)
    # O CLI não tem job de cobertura (a régua de 85% é do front) — o gate de
    # teste dele é o `test-rust`, que é quem ele espera (#169).
    #
    # O CORPO vive em `.github/workflows/dist-cli.yml` (#245). O
    # `RUSTUP_TOOLCHAIN` gnu foi junto: `env:` de job não atravessa um
    # `workflow_call` (o `env` não é contexto aceito no `with:`), então a
    # toolchain ficou no arquivo chamado.
    needs: [plan, test-rust]
    if: needs.plan.outputs.stage-dist == 'true'
    permissions:
      contents: write
      issues: read
      actions: read
      packages: read
    uses: ./.github/workflows/dist-cli.yml
# ═══════════════════════════════════════════════════════════════════════
  # RELEASE — versionamento e cadeia rc → promote → play
  #
  #   Release · guarda da main  recusa push direto na main (só SHA de tag v*)
  #   Release · RC        versiona + cria a release branch — SÓ `workflow_dispatch`
  #   Release · promote   rc → tag final → main recebe o SHA da tag
  #   Release · play      corta tag pelo semver dos commits
  #
  # LIÇÃO QUE VIROU ESTRUTURA (auditoria 01/10): tag empurrada com
  # GITHUB_TOKEN NÃO dispara workflow. Por isso rc/promote/play publicam NO
  # MESMO RUN; o trigger de tag cobre só tags criadas por HUMANO.
  # ═══════════════════════════════════════════════════════════════════════

  # A REGRA DA MAIN: ela só pode receber o SHA de uma tag v* aprovada. O
  # GitHub NÃO deixa_write essa regra em repositório PESSOAL (a API responde
  # "Only organization repositories can have users and team restrictions"), e
  # regras de branch filtram QUEM é protegido, não DE ONDE veio o push.
  # Então a regra é aplicada como GUARD: este job roda em todo push na main e
  # FALHA a run se o sha não for o de uma tag v* — a violação aparece vermelha
  # e linkada, em vez de passar em silêncio. Em repo de organização dá para
  # trocar isto por `restrictions.push` de verdade.
  # RELEASE (#169): a política é `dist → release`, mas os jobs de release são
  # SÓ `workflow_dispatch` e o dist é SÓ tag — os dois nunca coexistem, então
  # `release-* ← dist` seria um needs que salta sempre. O gate de verdade da
  # release continua sendo o push da tag v*, que roda a suíte inteira antes de
  # gerar qualquer artefato; aqui eles entram no grafo atrás da Validação.
  main-guard:
    name: Release · guarda da main
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: o sha da main tem que ser o de uma tag v*
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          TAG=$(git tag --points-at "$SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$TAG" ]; then
            echo "::error::main está em $SHA e esse sha NÃO é o de nenhuma tag v* — só a promote pode escrever na main"
            git log -3 --oneline
            exit 1
          fi
          echo "main = $SHA = $TAG ✅"

  release-rc:
    name: Release · RC
    needs: plan
    # Versionar NUNCA em push ou PR — só na mão do dono.
    #
    # O CORPO vive em `.github/workflows/release-rc.yml` (#245). O `outputs.tag`
    # do job volta pelo `on.workflow_call.outputs` do arquivo chamado: um job que
    # usa `uses:` não aceita a chave `outputs`.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'release'
    permissions:
      contents: write # branch + tag + manifests
      issues: read
      actions: read
      packages: read
    uses: ./.github/workflows/release-rc.yml
    with:
      source: ${{ inputs.source }}
      version: ${{ inputs.version }}
  release-promote:
    name: Release · promote
    needs: plan
    # O CORPO vive em `.github/workflows/release-promote.yml` (#245).
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    permissions:
      contents: write
      issues: read
      actions: read
      packages: read
    uses: ./.github/workflows/release-promote.yml
    with:
      version: ${{ inputs.version }}
  release-play:
    name: Release · play (tag pelo semver)
    needs: plan
    # O CORPO vive em `.github/workflows/release-play.yml` (#245).
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'play'
    permissions:
      contents: write
      issues: read
      actions: read
      packages: read
    uses: ./.github/workflows/release-play.yml
  # ═══════════════════════════════════════════════════════════════════════
  # RELATÓRIO — resumo da run (o ÚLTIMO job, roda SEMPRE `if: always()`)
  #
  # `if: always()` + needs de TODO o pipeline (#169) é a combinação que faz o
  # resumo ser o resumo da RUN INTEIRA e não só do começo: ele espera todos os
  # anteriores terminarem (com falha ou não) e roda mesmo assim — é nele que se
  # lê o que quebrou. Antes ele dependia só de `plan`, corria logo no início e
  # resumia uma run que ainda não tinha acontecido.
  # ═══════════════════════════════════════════════════════════════════════
  metrics:
    name: Relatório · resumo da run
    needs:
      - plan
      - lint-workflows
      - lint-commits
      - lint-rust-fmt
      - lint-rust-clippy
      - lint-ui
      - build-rust
      - build-ui
      - ci-images
      - sec-audit
      - test-rust
      - test-ui
      - test-spec
      - test-e2e
      - test-e2e-visual
      - test-e2e-webview
      - coverage-ui
      - dist-ui
      - dist-sdist
      - dist-cli
      - main-guard
      - release-rc
      - release-promote
      - release-play
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: aggregating os resumos de cobertura
        uses: actions/download-artifact@v8
        with:
          pattern: cov-*
          path: .cov
        continue-on-error: true
      - name: relatório
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH_CLASS: ${{ needs.plan.outputs.branch-class }}
        run: python3 .github/scripts/ci_report.py
