# CI — gates de qualidade do GP-100 NextGen Editor (mesmos comandos locais).
#
# Estrutura (decisão do owner, 29/09): UM JOB POR PROJETO, cada um em MATRIX
# dos 3 OSes (windows/linux/macos) — sem job "de portabilidade" separado.
#
#   gp100-core — fmt | clippy -D warnings | test (a "biblioteca de verdade")
#   gp100-cli  — fmt | clippy -D warnings | test + build --features real-device
#                (o binário de campo; smoke da política de hardware no Windows)
#   ui         — lint | test | build (Node 22 + pnpm 11, lockfile congelado)
#   pytest     — trava da ESPECIFICAÇÃO (golden/fixtures/baseline; não é código
#                do app — ver docs/ROADMAP.md §P3; permanece enquanto o golden
#                for a fonte de verdade, até o congelamento pós-H3)
#
# Notas de portabilidade:
# - windows-gnu pinado no rust-toolchain.toml só EXISTE no Windows: linux/macOS
#   sobrescrevem com RUSTUP_TOOLCHAIN=stable (job de campo continua no runner
#   Windows, ambiente idêntico ao do dev).
# - fmt é um gate barato e independente de OS: um job ubuntu só para ele dá
#   sinal rápido sem queimar matrix 3×.
# - smoke da política (--real, exit codes 2/3) só faz sentido onde há WinMM:
#   fica no runner Windows do gp100-cli.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate rápido e OS-agnóstico (falha em segundos, não em minutos) ──
  fmt:
    name: Rust — fmt
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain stable do runner
        run: rustup update stable --no-self-update
      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2
      - name: Formatação
        run: cargo fmt --check

  # ── gp100-core: a biblioteca de verdade — matrix dos 3 OSes ──
  core:
    name: gp100-core — clippy/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && 'stable-x86_64-pc-windows-gnu' || 'stable' }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar toolchain pinada (windows-gnu) no Windows
        if: matrix.os == 'windows-latest'
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update --component rustfmt --component clippy

      - name: Toolchain stable do runner (linux/macOS)
        if: matrix.os != 'windows-latest'
        run: rustup update stable --no-self-update

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings = erro)
        run: cargo clippy -p gp100-core --all-targets -- -D warnings

      - name: Testes (unitários + doc-tests)
        run: cargo test -p gp100-core

  # ── gp100-cli: binário de operação/campo — matrix dos 3 OSes ──
  cli:
    name: gp100-cli — clippy/test/real-device (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && 'stable-x86_64-pc-windows-gnu' || 'stable' }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar toolchain pinada (windows-gnu) no Windows
        if: matrix.os == 'windows-latest'
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update --component rustfmt --component clippy

      - name: Toolchain stable do runner (linux/macOS)
        if: matrix.os != 'windows-latest'
        run: rustup update stable --no-self-update

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2

      # midir → ALSA no Linux: alsa-sys compila C e precisa dos headers de
      # asoundlib (e pkg-config). No macOS não há extra (CoreMIDI é framework
      # de sistema); no Windows o WinMM também é de sistema.
      - name: Deps de sistema do ALSA (Linux — feature real-device)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Clippy (default + real-device, warnings = erro)
        run: |
          cargo clippy -p gp100-cli --all-targets -- -D warnings
          cargo clippy -p gp100-cli --all-targets --features real-device -- -D warnings

      - name: Testes (unitários + doc-tests)
        run: cargo test -p gp100-cli

      - name: Build do binário de campo (real-device)
        run: cargo build -p gp100-cli --features real-device

      # Smoke da política SÓ no Windows (WinMM é o stack do campo; nos outros
      # OSes o midir compila, mas não há device/porta para provar o OpenFailed).
      - name: Smoke da política de hardware (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set +e
          ./target/debug/gp100-cli.exe --real info > /dev/null 2>&1
          code1=$?
          ./target/debug/gp100-cli.exe --real --i-know-what-im-doing info > /dev/null 2>&1
          code2=$?
          set -e
          if [ "$code1" -ne 2 ]; then echo "ERRO: --real sem ack devia dar exit 2, veio $code1"; exit 1; fi
          if [ "$code2" -ne 3 ]; then echo "ERRO: --real + ack sem device devia dar exit 3 (OpenFailed), veio $code2"; exit 1; fi
          echo "política OK: recusas nos exit codes 2/3"

  # ── ui: front React/TS — matrix dos 3 OSes ──
  ui:
    name: ui — lint/test/build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar pnpm 11
        run: npm install -g pnpm@11

      - name: Instalar deps (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Lint (R1 no front — invoke só em ipc/)
        run: pnpm lint

      - name: Testes (tokens/contraste/a11y/estados)
        run: pnpm test

      - name: Build (tsc + vite)
        run: pnpm build

  # ── gp100-ui: backend desktop Tauri 2 (FORA do workspace gnu — ADR-7) ──
  # Windows: toolchain MSVC do src-tauri/rust-toolchain.toml (o Tauri 2 não
  # suporta gnu; o runner traz VS Build Tools). linux/macos: stable nativa.
  # O generate_context! EMBUTE os assets de ui/dist — o front é buildado antes.
  ui-rust:
    name: gp100-ui — clippy/test/tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      # Explícito nos dois lados (string vazia SETARIA a var e quebraria o
      # rustup no Windows): MSVC no runner Windows (= pin local), stable
      # nativa onde o triple MSVC não existe.
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && 'stable-x86_64-pc-windows-msvc' || 'stable' }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar pnpm 11
        run: npm install -g pnpm@11

      - name: Front (deps + build — ui/dist alimenta o generate_context!)
        run: |
          cd ../ui
          pnpm install --frozen-lockfile
          pnpm build

      # Windows: instala a stable (canal do rust-toolchain.toml, ADR-8) +
      # clippy/rustfmt — o Tauri exige MSVC e o runner traz VS Build Tools.
      - name: Componentes clippy/rustfmt (Windows)
        if: matrix.os == 'windows-latest'
        run: rustup component add rustfmt clippy

      - name: Deps de sistema do Tauri (Linux — gtk/webkit)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatação
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt -- --check

      - name: Clippy (warnings = erro)
        run: cargo clippy -p gp100-ui --all-targets -- -D warnings

      - name: Testes (commands/DTOs contra o mock)
        run: cargo test -p gp100-ui

      - name: Build do shell (prova do Tauri no OS)
        run: cargo build -p gp100-ui

  # ── pytest: trava da ESPECIFICAÇÃO, não do app (ver §P3 do ROADMAP) ──
  # Valida que os arquivos de REFERÊNCIA (golden, fixtures, knob_map, hash da
  # baseline v1.0) continuam íntegros e autoconsistentes. Enquanto o golden for
  # a fonte de verdade do protocolo (até H3), este job é obrigatório: o core
  # CONSUME esses arquivos em runtime (mock) e os testes Rust provam o app
  # CONTRA eles. Avaliação de remoção: revisão pós-H3 (congelamento).
  pytest:
    name: Python — trava da especificação (golden/fixtures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync do ambiente (capstone, pefile, ziglang, pytest)
        run: uv sync --all-groups

      - name: Suíte de regressão (10/10 — golden, hash da baseline, knob_map, fixtures)
        run: uv run pytest
