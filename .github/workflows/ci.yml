# ═══════════════════════════════════════════════════════════════════════════
# CI — porteiro da integração contínua (GitFlow).
#
# FUNÇÃO ÚNICA: validar mudanças nas branches de INTEGRAÇÃO e fechar issues
# vinculadas no merge. A validação em si mora no reusable `_validate.yml`;
# o release tem workflow próprio (`release.yml`); a varredura noturna de
# segurança, também (`security.yml`).
#
# PAPÉIS DAS BRANCHES (quem dispara o quê — auditoria 01/10):
#   feature/*, fix/*, chore/*, docs/*, refactor/*  → NADA no push.
#       A validação roda no PR (types abaixo). Antes, cada push acendia a
#       matriz 3-OS inteira: custo alto e fila de runs redundantes.
#   develop            → push valida (integração; origem das releases).
#   release/**         → push valida (freeze de rc).
#   hotfix/**          → push valida (correção urgente; vai direto à main).
#   main               → push valida (o publish acontece no release.yml, por tag).
#
# FECHAMENTO DE ISSUES (era close-issues.yml): integrado aqui como job
# `close-linked` — mesmo evento (PR closed em develop), mesmos guards.
# O GitHub nativo só fecha por `Closes #N` no merge da branch DEFAULT (main);
# no GitFlow a integração é em develop, então o job cobre a lacuna via API.
# ═══════════════════════════════════════════════════════════════════════════

name: ci

on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  pull_request:
    # `closed` entra para o close-linked; os jobs de validação guardam
    # `action != 'closed'` e não gastam runner em PR fechado.
    branches: [develop, main, "release/**"]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "(Visual) Regenerar baselines de screenshot no Ubuntu — baixe o artefato e commite"
        type: boolean
        default: false

permissions:
  contents: read # validação não escreve no repo
  issues: write # close-linked fecha a issue + comentário de rastreabilidade

concurrency:
  # Por PR/ref: push intermediário cancela a validação anterior (padrão de
  # monorepo). Em push de branch de integração NÃO cancela — a run do push
  # é a prova daquela integração e pode ser referenciada por outro PR.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── VALIDAÇÃO (reusable — a régua em um lugar só) ──
  validate:
    name: Validação (_validate.yml)
    if: github.event.action != 'closed'
    uses: ./.github/workflows/_validate.yml
    with:
      update-snapshots: ${{ github.event.inputs.update-snapshots || 'false' }}

  # ── FECHAMENTO DE ISSUES no merge em develop ──
  close-linked:
    name: Fechar issues vinculadas (Closes #N)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Extrair issues vinculadas do corpo do PR
        id: linked
        env:
          BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          # close[sd]/fix(e[sd])/resolve[sd] #N — case-insensitive, aceita
          # vírgula e dois-pontos entre a palavra e o número. Cada menção
          # vira uma linha "N"; awk deduplifica preservando a ordem.
          NUMBERS=$(printf '%s\n' "$BODY" \
            | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[:,]? #[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' | awk '!seen[$0]++')
          {
            echo "numbers<<EOF"
            echo "$NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          COUNT=$(printf '%s' "$NUMBERS" | grep -c '[0-9]' || true)
          echo "encontradas: ${COUNT:-0} → $(echo "$NUMBERS" | tr '\n' ' ')"

      - name: Fechar issues vinculadas
        if: ${{ steps.linked.outputs.numbers != '' }}
        env:
          NUMBERS: ${{ steps.linked.outputs.numbers }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CLOSED=0; SKIPPED=0
          for N in $NUMBERS; do
            # Estados da issue + label de security (que não fecha por aqui)
            JSON=$(gh issue view "$N" --json state,title,labels 2>/dev/null) || { echo "issue #$N não existe — ignorada"; continue; }
            STATE=$(echo "$JSON" | jq -r .state)
            TITLE_I=$(echo "$JSON" | jq -r .title)
            if echo "$JSON" | jq -e '.labels[]?.name | select(. == "achados-security")' >/dev/null; then
              echo "issue #$N ($TITLE_I) é achado de security — fechamento MANUAL, pulada"
              echo "skipped|$N|$TITLE_I|achado de security (fechamento manual)" >> /tmp/issues.tsv
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "issue #$N ($TITLE_I) já estava fechada — nada a fazer"
              echo "skipped|$N|$TITLE_I|já fechada" >> /tmp/issues.tsv
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            gh issue close "$N" --comment "$(cat <<MD
          ✅ Fechada automaticamente: integrada em \`develop\` pelo PR **#$PR — $TITLE** (sha \`$SHA\`).

          _Rastreabilidade: job \`close-linked\` do ci.yml — [run]($RUN_URL). A issue sai oficialmente no release para \`main\` (GitFlow)._
          MD
          )"
            echo "issue #$N ($TITLE_I) fechada via PR #$PR"
            echo "closed|$N|$TITLE_I|PR #$PR" >> /tmp/issues.tsv
            CLOSED=$((CLOSED+1))
          done
          {
            echo "closed=$CLOSED"
            echo "skipped=$SKIPPED"
          } >> "$GITHUB_OUTPUT"

      - name: Resumo (summary)
        if: always()
        env:
          NUMBERS: ${{ steps.linked.outputs.numbers }}
          CLOSED: ${{ steps.close-linked.outputs.closed }}
          SKIPPED: ${{ steps.close-linked.outputs.skipped }}
        run: |
          {
            echo "### 🔗 Fechamento de issues (merge em develop)"
            echo ""
            echo "PR **#$PR — ${{ github.event.pull_request.title }}** (merge: \`develop\`)"
            echo ""
            if [ -z "$NUMBERS" ]; then
              echo "> Nenhuma palavra-chave de fechamento no corpo do PR."
              echo "> Adicione \`Closes #N\` (ou \`Fixes #N\` / \`Resolves #N\`) ao corpo para o vínculo automático."
            else
              echo "| Issue | Resultado |"
              echo "|---|---|"
              if [ -f /tmp/issues.tsv ]; then
                while IFS='|' read -r tipo n titulo detalhe; do
                  icone="❓"; [ "$tipo" = "closed" ] && icone="✅ fechada"
                  [ "$tipo" = "skipped" ] && icone="⏭️ pulada"
                  echo "| #$n — $titulo | $icone ($detalhe) |"
                done < /tmp/issues.tsv
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
