# CI — gates de qualidade do GP-100 NextGen Editor (mesmos comandos locais).
#
# Por que windows-latest: o rust-toolchain.toml PINA stable-x86_64-pc-windows-gnu
# (host de dev sem MSVC). Em runner Linux o rustup não instala toolchain Windows
# com std; aqui a fidelidade com o ambiente de desenvolvimento é total.
#
# Gates (skill rust-practices + P3 do ROADMAP):
#   Python: uv sync --all-groups -> uv run pytest        (10/10: golden, hash, fixtures)
#   Rust:   fmt --check -> clippy -D warnings -> test    (inclui doc-tests)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python — golden/fixtures (uv)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync do ambiente (capstone, pefile, ziglang, pytest)
        run: uv sync --all-groups

      - name: Suíte de regressão (10/10 — golden, hash da baseline, knob_map, fixtures)
        run: uv run pytest

  rust:
    name: Rust — fmt/clippy/test (windows-gnu pinado)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Instala EXPLICITAMENTE a toolchain do rust-toolchain.toml (windows-gnu).
      # Por que não dtolnay/rust-toolchain: ela sonda `rustc -vV` antes de instalar;
      # dentro do repo o shim resolve o pin ainda ausente e morre com
      # "target tuple in channel name". O rustup do runner (pré-instalado) resolve
      # o mesmo nome de toolchain sem sonda; shims seguintes passam a achar o pin.
      # componentes EXPLÍCITOS: o perfil default traz só rustc+std+cargo;
      # fmt/clippy do runner ficam na toolchain msvc dele e o pin do
      # rust-toolchain.toml delega para a gnu — que precisa dos dois.
      - name: Instalar toolchain Rust pinada (windows-gnu)
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update --component rustfmt --component clippy

      - name: Cache do cargo (registry + target)
        uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --check

      - name: Clippy (warnings = erro)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes (unitários + doc-tests)
        run: cargo test

  # ── Portabilidade (M1.0): a lib e o CLI são cross-platform — validar em
  # Linux e macOS também. A build DE CAMPO (windows-gnu pinada) continua no
  # job `rust` acima; aqui provamos que o CÓDIGO é portável (clippy/testes).
  # O pin gnu do rust-toolchain.toml não existe como toolchain host fora do
  # Windows: usamos a stable do próprio runner para a checagem de portabilidade.
  rust-portable:
    name: Rust — portabilidade (linux + macOS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Sobrepõe o pin windows-gnu do rust-toolchain.toml (os shims do rustup
      # tentariam instalar toolchain Windows fora do Windows e morreriam com
      # "target tuple in channel name"). A checagem de portabilidade roda na
      # stable NATIVA do runner; a build de campo continua no job `rust`.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain stable do runner (checagem de portabilidade)
        run: rustup update stable --no-self-update

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (portabilidade = warnings são erro)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes (a lib e o CLI não dependem de Windows)
        run: cargo test

  # ── Front (M1.0): lint/test/build do ui/ com Node 22 + pnpm (cache).
  ui:
    name: UI — lint/test/build (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm 11
        run: npm install -g pnpm@11

      - name: Instalar deps (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: "Lint (R1 no front: invoke só em ipc/)"
        run: pnpm lint

      - name: Testes (tokens/contraste/a11y/estados)
        run: pnpm test

      - name: Build (tsc + vite)
        run: pnpm build
