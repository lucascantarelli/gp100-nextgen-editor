# ═══════════════════════════════════════════════════════════════════════════
# CI — o pipeline inteiro do projeto em UM workflow.
#
# Substitui ci.yml + _validate.yml + _publish.yml + release.yml + security.yml
# + container.yml (issue #68). Motivo: seis arquivos para um projeto de quatro
# produtos faz a mesma regra morar em seis lugares, e o nome do arquivo dentro
# do nome do job (`Validação (_validate.yml) / Gate — fmt + …') transfere
# informação nenhuma para quem lê o sidebar.
#
# TIPOS DE JOB — o `name:` é `Tipo · o que é`, sem número.
#
# O GitHub NÃO tem `stages:` como o GitLab (a doc de migração do próprio GitHub
# diz: "you can recreate this scenario with the `needs` key"). O que existe é o
# grafo de `needs:`. Duas consequências, ambas aceitas de propósito:
#
#   - a ORDEM DE EXECUÇÃO é o grafo `needs:`, não a posição no arquivo nem o
#     nome. As declarações abaixo estão na ordem pedida (validação → lint →
#     compilação → testes → cobertura → segurança → relatório → release/dist →
#     fechamento) para quem lê o arquivo, e `needs:` para quem roda;
#   - a LISTA DE CHECKS de um PR sai em ordem ALFABÉTICA, não de execução. Foi
#     o preço de tirar o prefixo numérico, e é a razão de o `Relatório · resumo
#     da run` existir: ele reconta a sequência real no step summary.
#
#   Validação    contexto: o que mudou, de que tipo é a branch, quais matrizes
#   Lint         validações estáticas — SEMPRE, em toda branch
#   Compilação   compilação de VERIFICAÇÃO — SEMPRE (build ≠ distribuição)
#   Testes       unit, integração, e2e shell, e2e visual, e2e webview
#   Cobertura    relatório + gate de 85% — separado de propósito
#   Segurança    auditorias de dependência + issue de achados
#   Relatório    resumo visual — roda SEMPRE (`if: always()`), mesmo com falha
#   Infra        imagens de container do próprio CI (ghcr.io)
#   Release      versionamento e cadeia rc → promote → play
#   Distribuição instaladores e CLI de campo (só na tag)
#   Fechamento   issues do PR mergeado
#
# JOB QUE NÃO RODA APARECE COMO "skipped": é limitação da plataforma, o GitHub
# cria um check para todo job declarado. Só sumiria se o job não existisse
# naquele workflow — e o custo (vários arquivos) é o que a #68 pagou para
# eliminar.
#
# QUAL TIPO RODA EM QUE BRANCH (a regra é do job `plan`, não espalhada em
# `if:` soltos — uma fonte de verdade, testável):
#
#   branch                    plan lint build test cov sec dist release close
#   (as colunas seguem a ordem da tabela acima)
#   feature/* bugfix/* (PR)   ✅   ✅   ✅    ✅   ✅   ✅   ❌    ❌      ✅
#   develop   (push)          ✅   ✅   ✅    ✅   ✅   ✅   ❌    ⚠️      ❌
#   main      (push)          ✅   ✅   ✅    ✅   ✅   ✅   ❌    ❌      ❌
#   release/* (push/PR)       ✅   ✅   ✅    ❌   ❌   ✅   ❌    ⚠️      ❌
#   hotfix/*  (push/PR)       ✅   ✅   ✅    ✅   ✅   ✅   ❌    ⚠️      ❌
#   tag v*    (push)          ✅   ✅   ✅    ✅   ✅   ✅   ✅    ✅      ❌
#   schedule  (noturno)       ⚠️   ❌   ❌    ✅   ❌   ✅   ❌    ❌      ❌
#
#   ⚠️ release = só em `workflow_dispatch` (nunca em push/PR): versionar no push
#      é a receita de tag prematura. A release REAL acontece na tag `v*`, que
#      roda a suíte inteira antes de gerar qualquer artefato.
#
# POR QUE `release/**` NÃO RODE TESTES: a release branch nasce da `develop`, que
# já foi testada no merge; retestar é custo sem informação nova. O gate de
# verdade da release é o push da tag `v*` (test → coverage → dist). Já
# `hotfix/**` RODA testes: ele nasce da `main`, é uma correção urgente e vai
# direto para produção.
#
# PERMISSÕES: o mínimo no topo (`contents: read`); só os jobs de `release`/`dist`
# sobem para `contents: write` no escopo do job. Um workflow único com
# `contents: write` no topo daria a TODOS os jobs — inclusive os que rodam
# código do PR — permissão de escrever no repositório.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  # push SÓ onde não existe PR: develop, main e as tags. Branch de trabalho
  # (feature/**, bugfix/**, hotfix/**, release/**) já é coberta pelo
  # `pull_request` abaixo — e o GitHub dispara os DOIS eventos quando a
  # branch tem PR aberto, então manter `feature/**` aqui rodava o pipeline
  # inteiro duas vezes por push, sem informação nova na segunda.
  #
  # POR QUE O `pull_request` É O QUE VALE: ele faz checkout do MERGE
  # SINTÉTICO (cabeça do PR fundida na base) — testa o que realmente entra.
  # O `push` testa só a cabeça da branch.
  #
  # O PREÇO: `Infra · imagens de container` não roda em PR (por segurança,
  # não publicamos no ghcr.io código não revisado), então uma mudança em
  # `.github/docker` só publica imagem depois do merge na develop. A sonda no
  # registro (`docker manifest inspect`) faz isso se recuperar sozinho.
  push:
    branches:
      - develop
      - main
    tags: ["v*"]
  pull_request:
    branches: [develop, main, "hotfix/**", "release/**"]
    types: [opened, synchronize, reopened, closed]
  schedule:
    # 06:30 UTC = 03:30 BRT — auditorias antes do expediente.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "release = criar rc · promote = rc → tag final · play = cortar tag pelo semver"
        type: choice
        options: [release, promote, play]
        required: false
        default: release
      source:
        description: "(release) de onde sai a release branch: develop = fluxo normal · main = hotfix"
        type: choice
        options: [develop, main]
        required: false
        default: develop
      version:
        description: "(release/promote) versão alvo sem o v, ex.: 0.2.0 — vazio = calcular pelos commits"
        type: string
        required: false
      update-snapshots:
        description: "(test) regenerar as baselines visuais de linux"
        type: boolean
        default: false
      publish-tag:
        description: "(opcional) publicar uma tag v* EXISTENTE (emergência)"
        type: string
        required: false

permissions:
  contents: read
  issues: write # fechamento de issues vinculadas
  actions: read # relatório de métricas (lista os jobs da run)
  packages: read # pull das imagens de CI no ghcr.io
  security-events: write # CodeQL

# Chave por PR/ref: push intermediário cancela a validação anterior. Em push de
# branch de integração NÃO cancela — a run do push é a prova daquela integração
# e pode ser referenciada por outro PR.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Imagens de CI (publicadas pelo job `Infra · imagens de container`).
  # ⚠️ `container.image` NÃO aceita o contexto `env` (a tabela do GitHub só
  # permite github/needs/strategy/matrix/vars/inputs ali) — por isso os jobs
  # de container repetem a ref literal, e `scripts/validate_workflows.py`
  # trava que as duas sempre coincidem.
  CI_IMAGE_BASE: ghcr.io/${{ github.repository }}/ci-base:1
  CI_IMAGE_TAURI: ghcr.io/${{ github.repository }}/ci-linux:1
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: github-actions[bot]@users.noreply.github.com

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # VALIDAÇÃO — contexto para todo o resto
  # ═══════════════════════════════════════════════════════════════════════
  plan:
    name: Validação · plano e escopo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      branch-class: ${{ steps.plan.outputs.branch-class }}
      scope-rust: ${{ steps.plan.outputs.scope-rust }}
      scope-front: ${{ steps.plan.outputs.scope-front }}
      scope-spec: ${{ steps.plan.outputs.scope-spec }}
      stage-test: ${{ steps.plan.outputs.stage-test }}
      stage-coverage: ${{ steps.plan.outputs.stage-coverage }}
      stage-security: ${{ steps.plan.outputs.stage-security }}
      stage-dist: ${{ steps.plan.outputs.stage-dist }}
      stage-release: ${{ steps.plan.outputs.stage-release }}
      rust-matrix: ${{ steps.plan.outputs.rust-matrix }}
      front-matrix: ${{ steps.plan.outputs.front-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff contra a base + tags

      - name: Diff contra a base do evento
        id: base
        run: |
          set -euo pipefail
          git fetch --tags --force
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          BEFORE="${{ github.event.before }}"
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="" # tag, schedule ou 1ª run: sem diff → tudo
          fi
          if [ -z "$BASE" ]; then
            CHANGED="ALL"
          else
            CHANGED="$(git diff --name-only "$BASE..HEAD" || true)"
            [ -z "$CHANGED" ] && CHANGED="(none)"
          fi
          # GITHUB_ENV (e não OUTPUT): o próximo step é outro processo e só vê
          # o que estiver no ambiente.
          {
            echo "CHANGED<<CHANGED_EOF"
            echo "$CHANGED"
            echo "CHANGED_EOF"
          } >> "$GITHUB_ENV"

      - name: Regra branch → estágios + matrizes
        id: plan
        env:
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
        run: python3 scripts/ci_plan.py >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════════
  # LINT — estático; sempre; toda branch
  # ═══════════════════════════════════════════════════════════════════════

  lint-workflows:
    name: Lint · contratos do pipeline
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # actionlint pega erro de EXPRESSAO que o parser Python nao pega:
      # `${{ }}` malformada, `if:` com tipo errado, matriz vazia, contexto de
      # expressao invalido. O `validate_workflows.py` cobre os CONTRATOS do
      # projeto; os dois juntos fecham workflow sintatico E semantico. Sem o
      # actionlint, um workflow pode passar no YAML e quebrar no runner.
      # actionlint via `docker run` com volume e workdir explicitos (caminho de
      # uso documentado do actionlint), e o `-ignore` NA LINHA DE COMANDO.
      #
      # Cinco formas foram tentadas ate a atual, e a lista fica aqui porque a
      # proxima tentara "simplificar" de novo:
      #   1) `docker://` + `args: -ignore '...'` — o `args:` vira argumento do
      #      `docker run` sem preservar aspas: `could not read "unknown'"`.
      #   2) `docker://` + `args: -config-file ...` — o ignore nao pegou.
      #   3) `docker://` sem `args:` (auto-descoberto) — nao pegou.
      #   4) `docker run -w /repo` sem `-config-file` (auto-descoberto) — nao
      #      pegou, com o workspace montado e o workdir na raiz.
      #   5) `docker run` + `-config-file .github/actionlint.yaml` — o arquivo
      #      estava commitado e no caminho certo, e o ignore MESMO nao pegou.
      # A (5) é a informativa: o problema nao era achar o arquivo. Num `run:`
      # de verdade o bash monta a linha antes do `docker`, então a flag de
      # linha de comando chega inteira — que era o que a (1) nao conseguia.
      #
      # O ignore e de UM rotulo e nada mais. `macos-15-intel` e real (runner
      # Intel do macOS 15, anunciado em set/2025 e disponivel ate ago/2027, a
      # ultima imagem x86_64 do Actions); a lista embutida do actionlint 1.7.7
      # e mais antiga e o acusa. Trocar o rotulo por `macos-latest` traria
      # arm64 e o build do shell Tauri deixaria de ser provado na arquitetura
      # que o `.dmg` exige — trocaria um falso positivo por perda real de
      # cobertura. NAO transformar este ignore em rede: ele existe para um
      # rotulo, e uma rede esconde erro de verdade.
      - name: actionlint (expressões e contextos do runner)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 \
            -ignore 'label "macos-15-intel" is unknown'
      - name: sintaxe + contratos + empacotamento + simulação do GitFlow
        run: |
          # `pyyaml` e `jsonschema` ja vem no `pyproject.toml` (#80); a linha
          # abaixo e o fallback para rodar o script fora do ambiente do projeto.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          # O gate de empacotamento (#71) estava escrito mas NAO LIGADO: o
          # `docs/PACKAGING.md` afirmava que ele rodava aqui e nao rodava em
          # lugar nenhum. Sem ele, mainBinaryName, .desktop, .deb e PKGBUILD
          # podiam divergir em silencio.
          python3 scripts/check_bundle.py
          python3 scripts/sync_version.py --check
          python3 scripts/validate_workflows.py
          # O juiz da Fase C do gate H1 (#21) contra o §13. E o gate que impede
          # o conjunto de referencia do H1 — que e a SAÍDA do MockDevice — de
          # sair de sincronia com as formas que o §13 manda, sem ninguem
          # notar. Sem ele, o primeiro sinal de drift seria uma sessão de
          # hardware com a pedaleira na mão.
          python3 scripts/h1_compare.py --self-check
          python3 scripts/simulate_release.py

  lint-commits:
    name: Lint · mensagens de commit
    # Não roda em tag (não há "commit novo" a checar) nem em schedule/dispatch.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: conventional commits
        run: python3 scripts/check_commits.py

  lint-rust-fmt:
    name: Lint · Rust (fmt)
    needs: plan
    if: needs.plan.outputs.scope-rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          # `cargo fmt` não compila nada: o cache aqui só custaria GB.
          cache: "false"
      - name: workspace da raiz
        run: cargo fmt --check
      - name: workspace da api
        working-directory: packages/app/api
        run: cargo fmt -- --check

  lint-rust-clippy:
    name: Lint · Rust (clippy · ${{ matrix.project }} · ${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.scope-rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # ADR-7: MSVC no workspace da api (Tauri), GNU no da raiz (cli de campo).
      # A toolchain vem daqui porque `matrix` é o único contexto disponível em
      # env de job — `runner.os` só existe em step.
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && (matrix.workdir == 'packages/app/api' && 'stable-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-gnu') || 'stable' }}
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          workdir: ${{ matrix.workdir }}
          shared-key: ${{ matrix.project == 'ui-rust' && 'ws-api' || 'ws-raiz' }}
      - name: deps de sistema do ALSA (Linux — cli)
        if: matrix.project == 'cli' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev
          version: 1.0
      - name: front (o `generate_context!` do Tauri embute ui/dist)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/setup-node-pnpm
      - name: front (build)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/build-front
      - name: clippy
        run: |
          cargo clippy -p ${{ matrix.project == 'ui-rust' && 'gp100-ui' || format('gp100-{0}', matrix.project) }} --all-targets -- -D warnings

  lint-ui:
    name: Lint · UI (eslint)
    needs: plan
    if: needs.plan.outputs.scope-front == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: eslint (inclui a regra local/no-user-literals)
        working-directory: packages/app/ui
        run: pnpm lint
      - name: export orfao (todo export de src/ tem consumidor)
        # Cobre 100% nao prova que o contrato e consumivel: um arquivo 100%
        # coberto cujos exports ninguem chama e o pior dos dois (#78).
        run: python3 scripts/check_deadcode.py

# ═══════════════════════════════════════════════════════════════════════
  # COMPILAÇÃO — verificação; sempre (build ≠ distribuição)
  #
  # Não confunda com o estágio 7 (dist): aqui `cargo check`/`tsc` provam que
  # COMPILA, que é o gate de merge. Gerar `.msi`/`.dmg`/`.deb` é outro job,
  # em outra branch, com outro custo. Sem essa separação, o `cargo build
  # --release` que estava dentro da matriz de validação publicava artefato de
  # campo a cada push de PR.
  # ═══════════════════════════════════════════════════════════════════════

  build-rust:
    name: Compilação · Rust (cargo check · ${{ matrix.project }} · ${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.scope-rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && (matrix.workdir == 'packages/app/api' && 'stable-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-gnu') || 'stable' }}
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          workdir: ${{ matrix.workdir }}
          shared-key: ${{ matrix.project == 'ui-rust' && 'ws-api' || 'ws-raiz' }}
      - name: deps de sistema do ALSA (Linux — cli)
        if: matrix.project == 'cli' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev
          version: 1.0
      - name: front (o `generate_context!` do Tauri embute ui/dist)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/setup-node-pnpm
      - name: front (build)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/build-front
      - name: check
        run: |
          cargo check -p ${{ matrix.project == 'ui-rust' && 'gp100-ui' || format('gp100-{0}', matrix.project) }} --all-targets

  build-ui:
    name: Compilação · UI (tsc + vite · ${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.scope-front == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.front-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: tsc + vite
        uses: ./.github/actions/build-front

  # ═══════════════════════════════════════════════════════════════════════
  # TESTES — unit · integração · e2e shell · e2e visual · e2e webview
  # ═══════════════════════════════════════════════════════════════════════

  test-rust:
    name: Testes · Rust (cargo test · ${{ matrix.project }} · ${{ matrix.os }})
    needs: [plan, build-rust]
    if: needs.plan.outputs.scope-rust == 'true' && needs.plan.outputs.stage-test == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && (matrix.workdir == 'packages/app/api' && 'stable-x86_64-pc-windows-msvc' || 'stable-x86_64-pc-windows-gnu') || 'stable' }}
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          workdir: ${{ matrix.workdir }}
          shared-key: ${{ matrix.project == 'ui-rust' && 'ws-api' || 'ws-raiz' }}
          # O MSVC é a perna mais cara que resta (issue #41): aqui vale cortar
          # o rebuild do gp100-ui, que é o que domina esse tempo.
          cache-workspace-crates: ${{ matrix.project == 'ui-rust' && matrix.os == 'windows-latest' && 'true' || 'false' }}
      - name: deps de sistema do ALSA (Linux — cli)
        if: matrix.project == 'cli' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev
          version: 1.0
      - name: front (o `generate_context!` do Tauri embute ui/dist)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/setup-node-pnpm
      - name: front (build)
        if: matrix.project == 'ui-rust'
        uses: ./.github/actions/build-front
      - name: testes
        if: matrix.project == 'cli'
        run: cargo test -p gp100-cli --features real-device
      - name: testes
        if: matrix.project != 'cli'
        run: cargo test -p ${{ matrix.project == 'ui-rust' && 'gp100-ui' || 'gp100-core' }}
      # `cargo test` compila o bin-alvo COMO HARNESS (`--test`), e o artefato
      # fica em target/debug/deps/gp100_cli-<hash>, não em
      # `target/debug/gp100-cli.exe`. Quem produz o binário de verdade é
      # `cargo build`. O build de distribution foi para o estagio 7 na #68 e o
      # smoke ficou sem insumo — o job reprovava com exit 127 ("command not
      # found") parecendo que o smoke estava quebrado.
      - name: binário do smoke (o `cargo test` acima não produz o .exe)
        if: runner.os == 'Windows' && matrix.project == 'cli'
        run: cargo build -p gp100-cli --features real-device
      - name: smoke da política de hardware (o stack de campo é WinMM)
        if: matrix.project == 'cli' && runner.os == 'Windows'
        uses: ./.github/actions/hardware-smoke
        with:
          profile: debug

  test-ui:
    name: Testes · UI (vitest)
    needs: [plan, build-ui]
    if: needs.plan.outputs.scope-front == 'true' && needs.plan.outputs.stage-test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: vitest
        working-directory: packages/app/ui
        run: pnpm exec vitest run

  test-spec:
    name: Testes · Especificação (pytest)
    needs: [plan, ci-images]
    if: always() && needs.plan.outputs.scope-spec == 'true' && needs.plan.outputs.stage-test == 'true' && needs.ci-images.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/${{ github.repository }}/ci-base:1
    steps:
      - uses: actions/checkout@v7
      - name: instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: sync do ambiente (capstone, pefile, ziglang, pytest)
        run: uv sync --all-groups
      - name: golden, hash da baseline, knob_map e fixtures
        run: uv run pytest

  test-e2e:
    name: Testes · E2E shell (Chromium)
    needs: [plan, build-ui]
    if: needs.plan.outputs.scope-front == 'true' && needs.plan.outputs.stage-test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/playwright-setup
      - name: suíte e2e (o playwright.config sobe o dev server sozinho)
        working-directory: packages/app/ui
        run: pnpm exec playwright test

  test-e2e-visual:
    name: Testes · E2E visual (baseline por plataforma)
    needs: [plan, build-ui]
    if: needs.plan.outputs.scope-front == 'true' && needs.plan.outputs.stage-test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/playwright-setup
      - name: comparar (ou regenerar com o input update-snapshots)
        working-directory: packages/app/ui
        # `--update-snapshots=all` é o ÚNICO caminho de escrita no CI: o
        # default lá é comparar e FALHAR no que faltar.
        run: pnpm exec playwright test visual.spec.ts ${{ inputs.update-snapshots == 'true' && '--update-snapshots=all' || '' }}
      - name: baselines/diffs como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: packages/app/ui/e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  test-e2e-webview:
    name: Testes · E2E webview (shell Tauri real)
    needs: [plan, build-rust, ci-images]
    if: always() && (needs.plan.outputs.scope-front == 'true' || needs.plan.outputs.scope-rust == 'true') && needs.plan.outputs.stage-test == 'true' && needs.ci-images.result != 'failure'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}/ci-linux:1
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          shared-key: ws-api
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/build-front
      - name: build debug do shell (dist embutido, backend mock)
        working-directory: packages/app/api
        run: cargo build -p gp100-ui
      # Lição (run 36943668915): build DEBUG carrega o `devUrl` do
      # tauri.conf.json — o dist embutido só entra em RELEASE. Servimos o dist
      # de produção na devUrl: o smoke segue provando o WEBVIEW, que é o
      # objeto dele.
      - name: servir o dist na devUrl
        working-directory: packages/app/ui
        run: |
          nohup pnpm exec vite preview --port 5173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && { echo "preview no ar na :5173"; exit 0; }
            sleep 0.5
          done
          echo "::error::preview não subiu:"; cat /tmp/preview.log; exit 1
      - name: smoke (xvfb + tauri-driver)
        working-directory: packages/app/ui
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: xvfb-run -a node e2e/tauri.smoke.mjs

# ═══════════════════════════════════════════════════════════════════════
  # COBERTURA (job próprio: a régua é uma Métrica com GATE, não
  # parte de "os testes passaram")
  # ═══════════════════════════════════════════════════════════════════════

  coverage-ui:
    name: Cobertura · UI (gate 85%)
    needs: [plan, build-ui]
    if: needs.plan.outputs.scope-front == 'true' && needs.plan.outputs.stage-coverage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: vitest com instrumentação + gate
        working-directory: packages/app/ui
        run: pnpm test:coverage
      # `json-summary` é o que o estágio de métricas lê — sem ele o relatório
      # agregaria zero números (e a régua viraria decoração).
      - name: resumo em JSON para o estágio de métricas
        if: always()
        working-directory: packages/app/ui
        run: pnpm exec vitest run --coverage.reporter=json-summary --coverage.reporter=text
      - name: publicar o resumo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cov-ui
          path: packages/app/ui/coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════
  # SEGURANÇA — auditorias de dependência
  #
  # NÃO bloqueia o merge, e essa é uma decisão: `glib` é uma advisory
  # documentada em SECURITY.md sem upgrade possível com o Tauri 2 — um gate
  # que sempre falha treina o time a ignorar o vermelho. A DETECÇÃO é a
  # issue de achados; a REMEDIAÇÃO é o dependabot.yml.
  #
  # CodeQL NÃO mora aqui: o repositório já tem o setup PADRÃO ligado (5
  # linguagens: rust, javascript, cpp, python, actions) e o GitHub recusa
  # SARIF de configuração avançada enquanto ele estiver ativo ("CodeQL
  # analyses from advanced configurations cannot be processed when the
  # default setup is enabled"). Configurar o CodeQL aqui só criava conflito.
  # ═══════════════════════════════════════════════════════════════════════

  sec-audit:
    name: Segurança · auditorias de dependência
    needs: [plan, ci-images]
    if: always() && needs.plan.outputs.stage-security == 'true' && needs.ci-images.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}/ci-base:1
    env:
      # O pin gnu do rust-toolchain.toml da raiz quebra o cargo no Linux.
      RUSTUP_TOOLCHAIN: stable
    permissions:
      contents: read
      issues: write
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: cargo-audit (binário pré-compilado)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (workspace da raiz)
        id: cargo_audit
        continue-on-error: true
        run: cargo audit --file Cargo.lock 2>&1 | tee /tmp/cargo-audit.txt
      - name: cargo audit (gp100-ui — lockfile próprio, ADR-7)
        id: cargo_audit_ui
        continue-on-error: true
        working-directory: packages/app/api
        run: cargo audit --file Cargo.lock 2>&1 | tee /tmp/cargo-audit-ui.txt
      - name: instalar uv
        uses: astral-sh/setup-uv@v10.2.0
      - uses: ./.github/actions/setup-node-pnpm
        with:
          # `pnpm audit` lê o lockfile; instalar a árvore inteira aqui só
          # custaria tempo — a imagem não tem store aquecido de propósito.
          install: "false"
      - name: pnpm audit (runtime do front)
        id: pnpm_audit
        continue-on-error: true
        working-directory: packages/app/ui
        run: pnpm audit --prod 2>&1 | tee /tmp/pnpm-audit.txt
      - name: pnpm outdated (informativo — não falha)
        if: always()
        continue-on-error: true
        working-directory: packages/app/ui
        run: pnpm outdated 2>&1 | tee /tmp/pnpm-outdated.txt || true
      - name: trava da especificação (pytest — a garantia da RE)
        if: always()
        run: |
          uv sync --all-groups
          uv run pytest
      - name: registrar o resultado de cada auditoria
        # Direcionado a arquivo, não a env: `steps.<id>.outcome` só é
        # disponivel dentro de um step, e o relatorio e um script separado.
        if: always()
        run: |
          {
            echo "cargo_audit(workspace)=${{ steps.cargo_audit.outcome }}"
            echo "cargo_audit(gp100-ui)=${{ steps.cargo_audit_ui.outcome }}"
            echo "pnpm_audit(runtime)=${{ steps.pnpm_audit.outcome }}"
          } > .audit-outcomes
          cat .audit-outcomes
      - name: achado = issue na FASE ACHADOS
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/security_report.py

  # ═══════════════════════════════════════════════════════════════════════
  # RELATÓRIO — resumo da run (roda SEMPRE, `if: always()`)
  #
  # `if: always()` é o ponto: o resumo tem que aparecer MESMO quando algo
  # quebrou — é nele que se lê o que quebrou. Depende de `plan` (não de
  # lint/build/test) para nunca ficar preso atrás de um `needs` vermelho.
  # ═══════════════════════════════════════════════════════════════════════

  metrics:
    name: Relatório · resumo da run
    needs: plan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: aggregating os resumos de cobertura
        uses: actions/download-artifact@v7
        with:
          pattern: cov-*
          path: .cov
        continue-on-error: true
      - name: relatório
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH_CLASS: ${{ needs.plan.outputs.branch-class }}
        run: python3 scripts/ci_report.py

# ═══════════════════════════════════════════════════════════════════════
  # RELEASE / DISTRIBUIÇÃO
  #
  # Separei em dois porque os gatilhos são incompatíveis:
  #
  #   Infra · imagens de container  publica a imagem de CI (ferramenta do
  #                    pipeline, não artefato de usuário) — código estável
  #   Release · guarda da main  recusa push direto na main (só SHA de tag v*)
  #   Release · RC        versiona + cria a release branch — SÓ `workflow_dispatch`
  #   Release · promote   rc → tag final → main recebe o SHA da tag
  #   Release · play      corta tag pelo semver dos commits
  #   Distribuição · instalador  gera o instalador por plataforma
  #   Distribuição · tarball de fonte  insumo do PKGBUILD do Arch (#72)
  #   Distribuição · CLI de campo  o binário + kit do gate H1
  #
  # A numeração de outrora ("7 dist · ui") era do prefixo numérico de nome,
  # que o owner pediu para tirar: a lista de checks do PR sai em ordem
  # ALFABÉTICA, então o número era o único vestígio da ordem real — e a ordem
  # real agora está no grafo `needs:` e no `Relatório · resumo da run`.
  #
  # LIÇÃO QUE VIROU ESTRUTURA (auditoria 01/10): tag empurrada com
  # GITHUB_TOKEN NÃO dispara workflow. Por isso rc/promote/play publicam NO
  # MESMO RUN; o trigger de tag cobre só tags criadas por HUMANO.
  # ═══════════════════════════════════════════════════════════════════════

  ci-images:
    name: Infra · imagens de container
    # Publicar é infraestrutura do repo (a imagem é versionada, com tag
    # `sha-<curto>` de auditoria). Publica quando a DEFINIÇÃO mudou — em
    # qualquer branch, porque é isso que destrava o bootstrap: os jobs que
    # consomem a imagem morrem no pull enquanto ela não existe no ghcr.io, e
    # esperar o merge para publicá-la deixaria o PR que a introduz vermelho.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push no ghcr.io
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ci-linux
            file: .github/docker/ci-linux/Dockerfile
          - name: ci-base
            file: .github/docker/ci-base/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Uma tag invalida no FROM morre DEPOIS de o runner subir as camadas
      # anteriores, e a saida (`docker.io/library/rust:bookworm-slim: not
      # found`) nao diz que a tag foi montada por concatenacao de ARG. Aqui
      # custa um HEAD por imagem, antes do build.
      - name: as imagens base existem no registro?
        run: python3 scripts/check_base_images.py
      - name: a definição da imagem mudou nesta run?
        id: dirty
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            CHANGED="$(git ls-files .github/docker)"
          else
            CHANGED="$(git diff --name-only "$BASE..HEAD" -- .github/docker || true)"
          fi
          if [ -n "$CHANGED" ]; then
            echo "mudou: $(echo "$CHANGED" | tr '\n' ' ')"
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "sem mudança em .github/docker"
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi
      # O login NÃO é condicional: sem ele não dá para sondar a tag, e sem
      # sondar não dá para decidir. Era aqui que o bootstrap morria.
      - name: login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: a tag :1 já existe no registro?
        id: probe
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}:1
        run: |
          set -uo pipefail
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "registro tem $IMAGE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "registro NAO tem $IMAGE — precisa do bootstrap"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Publicar quando a DEFINIÇÃO mudou **ou** a tag não existe no registro.
      # Só o diff não basta: o commit que introduz a imagem pode ter morrido
      # antes de publicar (a run que subiu este Dockerfile died no LOAD), e aí
      # nenhum diff futuro tocaria `.github/docker` — a imagem nunca existiria
      # e todo job que a consome morreria em `manifest unknown` para sempre.
      # A sonda torna o pipeline auto-curativo: sumiu do registro, volta.
      - name: decidir se publica
        id: plano
        env:
          DIRTY: ${{ steps.dirty.outputs.dirty }}
          EXISTS: ${{ steps.probe.outputs.exists }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [ "$DIRTY" = "true" ] || [ "$EXISTS" = "false" ]; then
            echo "publicando $NAME (definição mudou: $DIRTY | tag no registro: $EXISTS)"
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME intocada e já publicada — nada a fazer"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.plano.outputs.publicar == 'true'
      - name: tags (:1 estável + sha-<curto> auditável)
        id: meta
        if: steps.plano.outputs.publicar == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=1
            type=sha,format=short,prefix=sha-
      - name: build + push
        if: steps.plano.outputs.publicar == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # O passo que impede o "verde que não publicou". Um job que decidiu
      # publicar e terminou sem confirmar nada no registro é FALHA, não sucesso:
      # verde sem imagem é pior que vermelho, porque o consome só quebra depois,
      # em outro job, com `manifest unknown` e sem ligação com a causa.
      - name: a imagem realmente chegou ao registro?
        if: steps.plano.outputs.publicar == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}:1
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "confirmada no registro: $IMAGE"
              exit 0
            fi
            echo "ainda não propagou ($i/5), esperado logo apos o push"
            sleep 10
          done
          echo "::error::publicou mas $IMAGE continua ausente no ghcr.io — o consome vai morrer em manifest unknown"
          exit 1
      - name: resumo
        if: steps.plano.outputs.publicar == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 🐳 Imagem de CI publicada"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: nada a publicar
        if: steps.plano.outputs.publicar != 'true'
        run: |
          {
            echo "### 🐳 Imagem de CI"
            echo ""
            echo "Sem mudança em \`.github/docker\` e a tag \`:1\` já está no ghcr.io."
          } >> "$GITHUB_STEP_SUMMARY"

  # A REGRA DA MAIN: ela só pode receber o SHA de uma tag v* aprovada. O
  # GitHub NÃO deixa_write essa regra em repositório PESSOAL (a API responde
  # "Only organization repositories can have users and team restrictions"), e
  # regras de branch filtram QUEM é protegido, não DE ONDE veio o push.
  # Então a regra é aplicada como GUARD: este job roda em todo push na main e
  # FALHA a run se o sha não for o de uma tag v* — a violação aparece vermelha
  # e linkada, em vez de passar em silêncio. Em repo de organização dá para
  # trocar isto por `restrictions.push` de verdade.

  main-guard:
    name: Release · guarda da main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: o sha da main tem que ser o de uma tag v*
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          TAG=$(git tag --points-at "$SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$TAG" ]; then
            echo "::error::main está em $SHA e esse sha NÃO é o de nenhuma tag v* — só a promote pode escrever na main"
            git log -3 --oneline
            exit 1
          fi
          echo "main = $SHA = $TAG ✅"

  release-rc:
    name: Release · RC
    # Versionar NUNCA em push ou PR — só na mão do dono.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    permissions:
      contents: write # branch + tag + manifests
      issues: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - name: buscar tags
        run: git fetch --tags --force
      - name: calcular a versão (input > semver pendente)
        id: ver
        env:
          WANT: ${{ inputs.version }}
          SRC: ${{ inputs.source }}
        run: |
          set -euo pipefail
          WANT="${WANT#v}"
          if [ -n "$WANT" ]; then
            echo "$WANT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::versão inválida: '$WANT'"; exit 1; }
            echo "next=$WANT" >> "$GITHUB_OUTPUT"
            echo "versão informada: $WANT"
            exit 0
          fi
          LAST=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          [ -z "$LAST" ] && { echo "::error::sem tags v* — informe o input version"; exit 1; }
          BASE="${LAST#v}"; BASE="${BASE%%-*}"
          MAJOR=$(echo "$BASE" | cut -d. -f1); MINOR=$(echo "$BASE" | cut -d. -f2)
          # `main` já está numa versão publicada: uma rc de correção sobre ela é
          # patch, não minor. `develop` acumula feature → minor.
          if [ "$SRC" = "main" ]; then
            PATCH=$(echo "$BASE" | cut -d. -f3)
            echo "next=$MAJOR.$MINOR.$((PATCH+1))" >> "$GITHUB_OUTPUT"
            echo "hotfix sobre v$BASE → $MAJOR.$MINOR.$((PATCH+1))"
          else
            git log --format='%s' "$LAST..HEAD" | grep -E '^feat(\(|:)' > /dev/null || {
              echo "::error::sem bump pendente em $SRC (nenhum feat desde $LAST) — informe o input version"; exit 1; }
            echo "next=$MAJOR.$((MINOR+1)).0" >> "$GITHUB_OUTPUT"
            echo "feature desde $LAST → $MAJOR.$((MINOR+1)).0"
          fi
      - name: preparar a release branch + número da rc
        id: prep
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          SRC: ${{ inputs.source }}
        run: |
          set -euo pipefail
          BR="release/$NEXT"
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            git checkout -B "$BR" "origin/$BR"
            echo "reutilizando $BR (rc avançando)"
          else
            git checkout -B "$BR" "origin/$SRC"
            echo "release branch $BR criada de origin/$SRC"
          fi
          N=$(( $(git tag --list "v$NEXT-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -1 || echo 0) + 1 ))
          {
            echo "branch=$BR"
            echo "rc=$N"
            echo "full=$NEXT-rc.$N"
            echo "tag=v$NEXT-rc.$N"
          } >> "$GITHUB_OUTPUT"
      - name: versão rc nos manifests
        env:
          FULL: ${{ steps.prep.outputs.full }}
        run: |
          set -euo pipefail
          # Os 5 manifests, nao 3: `tauri.conf.json` e a versao do BUNDLE e
          # `package.json` o do front. De fora deles, o instalador sai com a
          # versao velha (#73). O `--check` prova a igualdade.
          python3 scripts/sync_version.py --set "$FULL"
          python3 scripts/sync_version.py --check
      - name: commitar + taguear + subir
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add Cargo.toml packages/app/api/Cargo.toml \
            packages/app/api/tauri.conf.json packages/app/ui/package.json version.json
          git commit -m "chore(release): $TAG (release candidate)"
          git push origin "$BRANCH"
          git tag "$TAG"
          git push origin "$TAG"
          {
            echo "### 🚀 Release Candidate"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`$TAG\` |"
            echo "| branch | \`$BRANCH\` |"
            echo "| próximo | testar o prerelease; correções na release branch + dispatch de novo; pronto? \`action=promote\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release-promote:
    name: Release · promote
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.final.outputs.tag }}
    permissions:
      contents: write
      issues: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: buscar tags e branches
        run: |
          git fetch --tags --force
          git fetch origin main develop --force
      - name: localizar a rc mais recente
        id: rc
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          WANT="${WANT#v}"
          if [ -n "$WANT" ]; then
            RC=$(git tag --list "v$WANT-rc.*" --sort=-v:refname | head -1)
          else
            RC=$(git for-each-ref refs/tags --sort=-v:refname --format='%(refname:short)' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | head -1)
          fi
          [ -z "$RC" ] && { echo "::error::nenhuma rc encontrada — rode action=release antes"; exit 1; }
          V="${RC%-rc.*}"; V="${V#v}"
          BR="release/$V"
          git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1 || {
            echo "::error::branch $BR não existe — promote exige a release branch"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$V" >/dev/null && {
            echo "::error::v$V já existe (promote é idempotente — nada a fazer)"; exit 1; }
          {
            echo "rc=$RC"
            echo "version=$V"
            echo "branch=$BR"
          } >> "$GITHUB_OUTPUT"
      - name: versão final nos manifests
        env:
          V: ${{ steps.rc.outputs.version }}
          BRANCH: ${{ steps.rc.outputs.branch }}
        run: |
          set -euo pipefail
          git checkout "origin/$BRANCH"
          # Os 5 manifests, nao 3: `tauri.conf.json` e a versao do BUNDLE e
          # `package.json` o do front. De fora deles, o instalador sai com a
          # versao velha (#73). O `--check` prova a igualdade.
          python3 scripts/sync_version.py --set "$V"
          python3 scripts/sync_version.py --check
      - name: commitar + taguear
        id: final
        env:
          BRANCH: ${{ steps.rc.outputs.branch }}
          TAG: v${{ steps.rc.outputs.version }}
          RC: ${{ steps.rc.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add Cargo.toml packages/app/api/Cargo.toml \
            packages/app/api/tauri.conf.json packages/app/ui/package.json version.json
          git commit -m "chore(release): $TAG (promove $RC)"
          git push origin "HEAD:refs/heads/$BRANCH"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: main recebe o SHA da tag
        # Não é `git push origin main`: a main é protegida e só aceita o
        # commit de uma tag v* aprovada. GITHUB_TOKEN não burla branch
        # protection — um merge de branch em main seria barrado no ultimo
        # passo, DEPOIS de a tag já estar publicada.
        run: |
          set -euo pipefail
          SHA=$(git rev-parse "v${{ steps.rc.outputs.version }}^{commit}")
          git push origin "$SHA:refs/heads/main"
          echo "main <- $SHA (tag v${{ steps.rc.outputs.version }})"
      - name: fechar o ciclo na develop
        env:
          BRANCH: ${{ steps.rc.outputs.branch }}
          TAG: v${{ steps.rc.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          # A develop JA está na próxima versão (avançada no `release-rc`), e
          # a release branch é ancestral dela — por isso não há merge de
          # volta: só o merge da tag, que é no-op para o conteúdo e mantém o
          # histórico honesto.
          git checkout -B develop origin/develop
          if git merge --no-ff "origin/$BRANCH" -m "merge release: $TAG (develop recebe a release)"; then
            # A develop sai da release com a PRÓXIMA versão: ela deixa de
            # carregar uma versão que acabou de ser publicada. Fazer isso AQUI
            # e nao no `release-rc` e deliberado — adiantar no rc faria os
            # manifests da develop divergirem dos da release branch, e todo
            # merge do ciclo de rc (correcoes entre rcs) viraria conflito.
            NEXT="${{ steps.rc.outputs.version }}"
            MAJOR=$(echo "$NEXT" | cut -d. -f1); MINOR=$(echo "$NEXT" | cut -d. -f2)
            UP="$MAJOR.$((MINOR+1)).0"
            # Os 5 manifests, nao 3: `tauri.conf.json` e a versao do BUNDLE e
            # `package.json` o do front. De fora deles, o instalador sai com a
            # versao velha (#73). O `--check` prova a igualdade.
            python3 scripts/sync_version.py --set "$UP"
            python3 scripts/sync_version.py --check
            git add Cargo.toml packages/app/api/Cargo.toml \
            packages/app/api/tauri.conf.json packages/app/ui/package.json version.json
            git commit -m "chore(release): develop avanca para $UP"
            git push origin develop
          else
            echo "::error::conflito no merge da release para develop — resolva manualmente (a tag e a main ja estao fora)"
            git merge --abort || true
            exit 1
          fi
          git push origin --delete "$BRANCH"
          {
            echo "### ✅ Release promovida"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| tag final | \`$TAG\` |"
            echo "| main | push do SHA da tag (branch protegida) |"
            echo "| develop | merge da release + versão avançada para a próxima |"
            echo "| branch | \`$BRANCH\` apagada |"
          } >> "$GITHUB_STEP_SUMMARY"

  release-play:
    name: Release · play (tag pelo semver)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'play'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: ./.github/actions/version-bump
        id: bump
      - name: cortar a tag
        env:
          NEXT: ${{ steps.bump.outputs.next-version }}
          PENDING: ${{ steps.bump.outputs.release }}
        run: |
          set -euo pipefail
          [ "$PENDING" = "true" ] || { echo "::error::sem bump pendente — nada a cortar"; exit 1; }
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add Cargo.toml packages/app/api/Cargo.toml \
            packages/app/api/tauri.conf.json packages/app/ui/package.json version.json
          git diff --cached --quiet || {
            git commit -m "chore(release): v$NEXT (bump por conventional commits)"
            git push origin HEAD; }
          git tag --force "v$NEXT"
          git push --force origin "v$NEXT"
          echo "### 🏷️ Tag \`v$NEXT\` criada" >> "$GITHUB_STEP_SUMMARY"

  dist-ui:
    name: Distribuição · instalador (${{ matrix.os }})
    # DISTRIBUIÇÃO: só quando existe versão para publicar. Nada aqui roda em
    # PR, feature ou develop — um `.msi` por push seria desperdício.
    needs: plan
    if: needs.plan.outputs.stage-dist == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-15-intel
            args: --bundles app,dmg
          - os: ubuntu-24.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write # anexar na Release
      issues: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/build-front
      - uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          shared-key: ws-api
      - name: linux precisa dos headers de WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: linux precisa do Node do tauri-cli
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends pkg-config
      - name: build do instalador
        working-directory: packages/app/api
        run: ../../ui/node_modules/.bin/tauri build ${{ matrix.args }}
      - name: coletar + sha256
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-pkg
          # Glob por plataforma: o layout do bundle muda entre nsis/msi,
          # dmg/app e deb/appimage.
          find packages/app/api/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} dist-pkg/ \;
          ls -la dist-pkg/
          test -n "$(ls -A dist-pkg)" || { echo "::error::nenhum instalador gerado"; exit 1; }
          (cd dist-pkg && sha256sum ./* > SHA256SUMS.txt)
      - name: publicar na Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist-pkg/*
          fail_on_unmatched_files: true

  dist-sdist:
    name: Distribuição · tarball de fonte (insumo do Arch)
    needs: plan
    # O PKGBUILD (#29) compila deste tarball e, ate #72, ele NAO ERA PUBLICADO:
    # `makepkg` procuraria um arquivo inexistente. Alem disso o tarball do git
    # nao tem `packages/app/ui/dist` (gitignored, e o `frontendDist` do conf) nem
    # `packages/core` (dependencia de caminho do crate do Tauri) — o
    # `make_sdist.py` junta os tres e sobe o front antes de empacotar.
    if: needs.plan.outputs.stage-dist == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # anexar na Release
      issues: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/build-front
      - uses: ./.github/actions/setup-rust
        with:
          workdir: packages/app/api
          shared-key: ws-api
      - name: linux precisa dos headers de WebKitGTK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config
      # Prova de que o tarball e realmente CONSUMIVEL, e nao so um .tar.gz:
      # o manifesto do crate do Tauri precisa resolver a dependencia de caminho
      # `gp100-core`, e o `frontendDist` precisa existir (sem ele o
      # `generate_context!()` faz `panic!` em tempo de compilacao).
      - name: o tarball tem o que o build do shell exige
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          python3 scripts/make_sdist.py --version "$VER" --out dist-pkg
          SRC="dist-pkg/gp100-nextgen-editor-$VER.tar.gz"
          test -s "$SRC" || { echo "::error::tarball vazio"; exit 1; }
          rm -rf /tmp/sdist-check && mkdir -p /tmp/sdist-check
          tar xzf "$SRC" -C /tmp/sdist-check
          ROOT="/tmp/sdist-check/gp100-nextgen-editor-$VER"
          test -f "$ROOT/packages/app/ui/dist/index.html" || {
            echo "::error::frontendDist ausente — o build do shell entra em panic"; exit 1; }
          test -f "$ROOT/packages/core/Cargo.toml" || {
            echo "::error::packages/core ausente — dependencia de caminho do gp100-ui"; exit 1; }
          (cd "$ROOT/packages/app/api" && cargo metadata --format-version 1 --locked >/dev/null) || {
            echo "::error::manifesto do shell nao resolve dentro do tarball"; exit 1; }
          echo "tarball consumivel: frontendDist + gp100-core + manifesto"
      - name: publicar na Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist-pkg/gp100-nextgen-editor-${{ github.ref_name }}.tar.gz
            dist-pkg/SHA256SUMS.txt
          fail_on_unmatched_files: true

  dist-cli:
    name: Distribuição · CLI de campo (Windows)
    needs: plan
    if: needs.plan.outputs.stage-dist == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: read
      actions: read
      packages: read
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-rust
        with:
          workdir: .
          shared-key: ws-raiz
      - name: gates reconfirmados na tag
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test
      - name: build release do binário de campo
        run: cargo build --release -p gp100-cli --features real-device
      - uses: ./.github/actions/hardware-smoke
        with:
          profile: release
      - name: empacotar (zip + SHA256 + kit de campo)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STAGE="gp100-cli-$TAG"
          mkdir -p "$STAGE"
          cp target/release/gp100-cli.exe "$STAGE/"
          cp docs/H1_CHECKLIST.md docs/H1_REPORT.md scripts/h1_field.sh scripts/h1_compare.py "$STAGE/"
          cat > "$STAGE/LEIA-ME.txt" <<MD
          GP-100 NextGen Editor — CLI de campo ${TAG}

          Uso do gate H1: docs/H1_CHECKLIST.md (roteiro) + h1_field.sh (runbook).
          Relatorio da sessao: docs/H1_REPORT.md.

          A FASE C (comparar e classificar a sessão nos 3 niveis do §4) e
          automatizada: h1_field.sh chama h1_compare.py ao fim do roteiro e
          sai com codigo 1 se houver divergencia que bloqueia o H1. Para
          reprocessar uma sessao sem re-rodar a leitura:

            python h1_compare.py <dir-da-sessao> --markdown

          Politica de hardware: leitura real exige --real --i-know-what-im-doing
          (build com feature real-device). ESCRITA permanece bloqueada ate o
          gate H2 (WRITE_VERIFIED).
          MD
          zip -q -r "$STAGE.zip" "$STAGE" 2>/dev/null || 7z a -tzip -bso0 "$STAGE.zip" "$STAGE"
          sha256sum "$STAGE.zip" > "$STAGE.zip.sha256"
      - name: publicar na Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            gp100-cli-${{ github.ref_name }}.zip
            gp100-cli-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true

  # ═══════════════════════════════════════════════════════════════════════
  # FECHAMENTO — issues do PR mergeado
  #
  # Só `merged == true`. Um PR fechado SEM merge não resolveu nada — fechar as
  # issues nesse caso é o bug mais caro que um job de fechamento consegue ter.
  # ═══════════════════════════════════════════════════════════════════════

  close-issues:
    name: Fechamento · issues vinculadas
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: extrair as issues do corpo do PR
        id: linked
        env:
          BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          # close[sd]/fix(e[sd])/resolve[sd] #N — case-insensitive, aceita
          # vírgula ou dois-pontos entre a palavra e o número.
          NUMBERS=$(printf '%s\n' "$BODY" \
            | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[:,]? #[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' | awk '!seen[$0]++')
          {
            echo "numbers<<EOF"
            echo "$NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: fechar
        id: close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.linked.outputs.numbers }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
          # Título do PR = entrada NÃO confiável: sempre por env, nunca
          # ${{ }} inline no run (injeção de comando).
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$NUMBERS" ] || { echo "nenhuma palavra-chave de fechamento no corpo do PR"; exit 0; }
          : > /tmp/issues.tsv
          CLOSED=0; SKIPPED=0
          for N in $NUMBERS; do
            JSON=$(gh issue view "$N" --json state,title,labels) || { echo "issue #$N inacessível — ignorada"; continue; }
            TITLE_I=$(echo "$JSON" | jq -r .title)
            if echo "$JSON" | jq -e '.labels[]?.name | select(. == "achados-security")' >/dev/null; then
              echo "skipped|$N|$TITLE_I|achado de security (fechamento manual)" >> /tmp/issues.tsv; SKIPPED=$((SKIPPED+1)); continue
            fi
            if [ "$(echo "$JSON" | jq -r .state)" = "CLOSED" ]; then
              echo "skipped|$N|$TITLE_I|ja fechada" >> /tmp/issues.tsv; SKIPPED=$((SKIPPED+1)); continue
            fi
            gh issue close "$N" --comment "✅ Fechada automaticamente: integrada em \`develop\` pelo PR **#$PR — $PR_TITLE** (sha \`$SHA\`).

            _Rastreabilidade: job \`8 close · issues vinculadas\` do CI — [run]($RUN_URL). A issue sai oficialmente na release, quando a tag \(v*\) chega à \`main\`._"
            echo "closed|$N|$TITLE_I|PR #$PR" >> /tmp/issues.tsv; CLOSED=$((CLOSED+1))
          done
          {
            echo "closed=$CLOSED"
            echo "skipped=$SKIPPED"
          } >> "$GITHUB_OUTPUT"
      - name: resumo
        if: always()
        env:
          NUMBERS: ${{ steps.linked.outputs.numbers }}
          CLOSED: ${{ steps.close.outputs.closed }}
          SKIPPED: ${{ steps.close.outputs.skipped }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "### 🔗 Fechamento de issues"
            echo ""
            echo "PR **#$PR — $PR_TITLE** (mergeado em \`develop\`)"
            echo ""
            if [ -z "$NUMBERS" ]; then
              echo "> Nenhuma palavra de fechamento no corpo do PR — use \`Closes #N\`."
            else
              echo "| Issue | Resultado |"
              echo "|---|---|"
              while IFS='|' read -r tipo n titulo detalhe; do
                icone="❓"; [ "$tipo" = "closed" ] && icone="✅ fechada"; [ "$tipo" = "skipped" ] && icone="⏭️ pulada"
                echo "| #$n — $titulo | $icone ($detalhe) |"
              done < /tmp/issues.tsv
              echo ""
              echo "**${CLOSED:-0} fechada(s) · ${SKIPPED:-0} pulada(s).**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
