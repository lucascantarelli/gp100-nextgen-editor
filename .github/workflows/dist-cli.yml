name: Distribuição · CLI de campo (reusable)

# Extraído do `ci.yml` (#245, F-12). Ver `dist-instalador.yml` para as regras
# comuns aos reutilizáveis desta pasta.
#
# O `RUSTUP_TOOLCHAIN` do job VEM PARA CÁ e não pode voltar para o caller: `env`
# de job não é um contexto que o `with:` de um `workflow_call` aceite, e `env:`
# de topo do caller não atravessa a fronteira. Aqui ele é o mesmo literal da raiz
# (`stable-x86_64-pc-windows-gnu`, ADR-8).
on:
  workflow_call:

jobs:
  cli:
    name: CLI de campo
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-rust
        with:
          workdir: .
          shared-key: ws-raiz
      - name: gates reconfirmados na tag
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test
      - name: build release do binário de campo
        run: cargo build --release -p gp100-cli --features real-device
      - uses: ./.github/actions/hardware-smoke
        with:
          profile: release
      - name: empacotar (zip + SHA256 + kit de campo)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STAGE="gp100-cli-$TAG"
          mkdir -p "$STAGE"
          cp target/release/gp100-cli.exe "$STAGE/"
          cp docs/arquivo/H1_CHECKLIST.md docs/arquivo/H1_REPORT.md docs/arquivo/scripts-era-RE/h1_field.sh docs/arquivo/scripts-era-RE/h1_compare.py "$STAGE/"
          cp docs/arquivo/H2_CHECKLIST.md docs/arquivo/H2_REPORT.md docs/arquivo/scripts-era-RE/h2_field.sh docs/arquivo/scripts-era-RE/h2_compare.py "$STAGE/"
          cp docs/arquivo/H3_CHECKLIST.md docs/arquivo/H3_REPORT.md "$STAGE/"
          cp tools/wirelog.py tools/validate_core_capture.py tools/baseline.py tools/baseline.json "$STAGE/"
          cat > "$STAGE/LEIA-ME.txt" <<MD
          GP-100 NextGen Editor — CLI de campo ${TAG}

          Gate H1 (LEITURA): docs/arquivo/H1_CHECKLIST.md (roteiro) + h1_field.sh (runbook).
          Relatorio da sessao: docs/arquivo/H1_REPORT.md.

          A FASE C (comparar e classificar a sessao nos 3 niveis do §4) e
          automatizada: h1_field.sh chama h1_compare.py ao fim do roteiro e
          sai com codigo 1 se houver divergencia que bloqueia o H1. Para
          reprocessar uma sessao sem re-rodar a leitura:

            python h1_compare.py <dir-da-sessao> --markdown

          Gate H2 (ESCRITA): docs/arquivo/H2_CHECKLIST.md (roteiro) + h2_field.sh (runbook)
          + h2_compare.py (o juiz da Fase C). Relatorio: docs/arquivo/H2_REPORT.md.
          O runbook roda os 3 fluxos UM POR VEZ, com pausa para o display ser
          lido entre eles, e exige o 'ok' digitado — por pipe ele recusa, porque
          o gate de escrita nao pode rodar sem alguem olhando o aparelho.
          Para reprocessar uma sessao sem re-rodar a escrita:
              python h2_compare.py <dir-da-sessao> --markdown

          O binario DESTE zip e o do H1: a escrita real esta BLOQUEADA e nao ha
          flag, variavel de ambiente ou argumento que a abra. Para o gate H2
          recompile com a feature write-verified:
              cargo build --release -p gp100-cli --features real-device,write-verified

          Gate H3 (CONGELAMENTO da especificacao): docs/arquivo/H3_CHECKLIST.md +
          docs/arquivo/H3_REPORT.md. E o gate que tira o golden do Suite e poe o
          golden do gp100-core. Os scripts vao no zip porque a sessao de campo
          precisa deles na mao:

            python wirelog.py <log.jsonl>          # inspeciona e normaliza
            python validate_core_capture.py <log.jsonl>   # juz frame a frame
                                                  # (0 ok / 1 bug / 2 fora da spec)
            python baseline.py show                # versao + hash + motivo
            python baseline.py bump --motivo "..." --issue "#23"

          O log que este binario grava tem timestamp (t, em ms), que antes
          nao tinha: sem relogio nao ha casamento de transacao.

          Politica de hardware: leitura real exige --real --i-know-what-im-doing
          (build com feature real-device). A escrita e uma TERCEIRA camada, no
          transporte (ADR-5), e so depois do gate H2 passar.

          O subcomando de upload de IR existe nos dois builds:
              upload-ir <slot> <arquivo>   blob de User IR (§13.7)
          Neste binario ele so imprime os frames (--dry-run implicito na
          ausencia da feature); no build do H2 ele envia.
          MD
          zip -q -r "$STAGE.zip" "$STAGE" 2>/dev/null || 7z a -tzip -bso0 "$STAGE.zip" "$STAGE"
          sha256sum "$STAGE.zip" > "$STAGE.zip.sha256"
      - name: publicar na Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            gp100-cli-${{ github.ref_name }}.zip
            gp100-cli-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
