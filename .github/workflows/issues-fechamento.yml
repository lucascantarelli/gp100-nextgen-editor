# ═══════════════════════════════════════════════════════════════════════════
# ISSUES · FECHAMENTO DE ISSUES VINCULADAS
#
# Saiu do `ci.yml` (#169): o fechamento não é um estágio do pipeline de branch
# — é uma reação a um PR mergeado. Morar no CI custava duas coisas concretas:
# o `pull_request.types` do pipeline precisava arrastar `closed` (toda PR
# mergeada rodava o CI INTEIRO só para gerar jobs `skipped`), e o `needs:` do
# Relatório não podia cobrir o fechamento sem ligar dois eventos diferentes
# numa run só.
#
# GATILHO: `pull_request: types: [closed]` nas MESMAS bases de antes
# (develop, main, hotfix/**, release/**). Push na develop NÃO é gatilho: o
# merge local que empurra a develop não tem o corpo do PR para ler, e a
# keyword `Closes #N` mora no PR — quem mergeia por PR é coberto, e o
# fechamento manual continua sendo a exceção documentada (achados-security).
#
# GARANTIA DE SEMÂNTICA: só `merged == true`. Um PR fechado SEM merge não
# resolveu nada — fechar as issues nesse caso é o bug mais caro que um job de
# fechamento consegue ter.
# ═══════════════════════════════════════════════════════════════════════════

name: Issues · Fechamento de issues vinculadas

on:
  pull_request:
    branches: [develop, main, "hotfix/**", "release/**"]
    types: [closed]

# Mínimo para a tarefa: fechar issue. Sem `contents` — nenhum passo usa o
# checkout (o `gh` fala com a API direto pelo GH_REPO), e um token com write
# de repositório em workflow de terceiro é permissão em excesso.
permissions:
  issues: write

concurrency:
  group: fechamento-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-issues:
    name: Fechamento · issues vinculadas
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: extrair as issues do corpo do PR
        id: linked
        env:
          BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          # close[sd]/fix(e[sd])/resolve[sd] #N — case-insensitive, aceita
          # vírgula ou dois-pontos entre a palavra e o número.
          NUMBERS=$(printf '%s\n' "$BODY" \
            | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[:,]? #[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' | awk '!seen[$0]++')
          {
            echo "numbers<<EOF"
            echo "$NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: fechar
        id: close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.linked.outputs.numbers }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
          # Título do PR = entrada NÃO confiável: sempre por env, nunca
          # ${{ }} inline no run (injeção de comando).
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$NUMBERS" ] || { echo "nenhuma palavra-chave de fechamento no corpo do PR"; exit 0; }
          : > /tmp/issues.tsv
          CLOSED=0; SKIPPED=0
          for N in $NUMBERS; do
            JSON=$(gh issue view "$N" --json state,title,labels) || { echo "issue #$N inacessível — ignorada"; continue; }
            TITLE_I=$(echo "$JSON" | jq -r .title)
            if echo "$JSON" | jq -e '.labels[]?.name | select(. == "achados-security")' >/dev/null; then
              echo "skipped|$N|$TITLE_I|achado de security (fechamento manual)" >> /tmp/issues.tsv; SKIPPED=$((SKIPPED+1)); continue
            fi
            if [ "$(echo "$JSON" | jq -r .state)" = "CLOSED" ]; then
              echo "skipped|$N|$TITLE_I|ja fechada" >> /tmp/issues.tsv; SKIPPED=$((SKIPPED+1)); continue
            fi
            gh issue close "$N" --comment "✅ Fechada automaticamente: integrada em \`develop\` pelo PR **#$PR — $PR_TITLE** (sha \`$SHA\`).

            _Rastreabilidade: workflow \`Issues · Fechamento de issues vinculadas\` — [run]($RUN_URL). A issue sai oficialmente na release, quando a tag \(v*\) chega à \`main\`._"
            echo "closed|$N|$TITLE_I|PR #$PR" >> /tmp/issues.tsv; CLOSED=$((CLOSED+1))
          done
          {
            echo "closed=$CLOSED"
            echo "skipped=$SKIPPED"
          } >> "$GITHUB_OUTPUT"
      - name: resumo
        if: always()
        env:
          NUMBERS: ${{ steps.linked.outputs.numbers }}
          CLOSED: ${{ steps.close.outputs.closed }}
          SKIPPED: ${{ steps.close.outputs.skipped }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "### 🔗 Fechamento de issues"
            echo ""
            echo "PR **#$PR — $PR_TITLE** (mergeado)"
            echo ""
            if [ -z "$NUMBERS" ]; then
              echo "> Nenhuma palavra de fechamento no corpo do PR — use \`Closes #N\`."
            else
              echo "| Issue | Resultado |"
              echo "|---|---|"
              while IFS='|' read -r tipo n titulo detalhe; do
                icone="❓"; [ "$tipo" = "closed" ] && icone="✅ fechada"; [ "$tipo" = "skipped" ] && icone="⏭️ pulada"
                echo "| #$n — $titulo | $icone ($detalhe) |"
              done < /tmp/issues.tsv
              echo ""
              echo "**${CLOSED:-0} fechada(s) · ${SKIPPED:-0} pulada(s).**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
