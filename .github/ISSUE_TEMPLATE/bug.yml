name: "🐞 Bug"
description: "Algo não funciona como esperado (app, CLI, CI, doc) — reprodução obrigatória"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Sem reprodução escrita não há fix — há palpite.** Se o sintoma envolve o aparelho
        real, diga SE o aparelho foi consultado (leitura pura: CLI de campo
        `--real --i-know-what-im-doing`) ou se é o app quem erra. Skills: `.agents/skills/`.
  - type: textarea
    id: contexto
    attributes:
      label: "Contexto medido"
      description: "Quando começou, em que commit/versão, quantas vezes reproduziu — com números"
      placeholder: "Reproduziu 3/3 vezes no commit df97427 · Windows 11 · v1.0.1"
    validations:
      required: true
  - type: textarea
    id: observado
    attributes:
      label: "O que aconteceu × o que era esperado"
      description: "Comportamento observado de um lado, esperado do outro, com a fonte do esperado"
      placeholder: "Observado: boot falha com 'nenhuma porta MIDI' · Esperado: reconexão ADR-4 (real.rs) — docs/dev/DECISIONS.md"
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: "Passos para reproduzir"
      description: "Do zero, executável — comando/teste/click"
      placeholder: |
        1. pnpm exec playwright test e2e/ipc.edge.spec.ts -g "mid-boot"
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Área"
      options:
        - "gp100-ui (front — navbar/palco/biblioteca)"
        - "gp100-ui shell (Tauri/Rust)"
        - "gp100-core (Rust)"
        - "gp100-cli"
        - "device real / transport"
        - "docs / protocolo"
        - "CI / workflow"
        - "outro"
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: "Escopo"
      description: "O que o fix cobre — causa raiz esperada e camada atacada"
    validations:
      required: true
  - type: textarea
    id: fora_de_escopo
    attributes:
      label: "Fora de escopo"
      description: "O que NÃO entra neste fix (dívida maior vira issue nova)"
  - type: textarea
    id: plano_de_teste
    attributes:
      label: "Plano de teste"
      description: "Teste de regressão que reproduce o bug ANTES do fix (fica depois — é a garantia)"
    validations:
      required: true
  - type: textarea
    id: referencias
    attributes:
      label: "Referências"
      description: "Fonte da verdade violada (doc + seção) e skills"
      placeholder: "docs/tecnico/PROTOCOL.md §13.10 · docs/dev/UI_TEST_PLAN.md · skills: testing, hardware-dev"
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: "🤖 Prompt do agente (pronto para colar)"
      description: "Auto-suficiente. Formato: .agents/prompts/corrigir-bug.md"
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / evidência"
      description: "Wire log com timestamp, saída de gate, stack — hex solto em conversa não vale"
      render: shell
  - type: checkboxes
    id: validacao
    attributes:
      label: "Checklist de validação da entrega"
      options:
        - label: "Teste de regressão escrito ANTES do fix e permanente no repo"
        - label: "CAUSA corrigida (sem ajustar expectativa para o comportamento errado)"
        - label: "PR para develop com `Closes #N`; CI verde"
        - label: "Sintoma de dívida maior virou issue própria"
