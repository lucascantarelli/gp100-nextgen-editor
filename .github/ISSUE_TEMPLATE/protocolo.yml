name: "🔌 Descoberta de protocolo / hardware"
description: "Observação do APARELHO REAL (fio, comportamento, lacuna de leitura) — evidência obrigatória"
labels: ["protocolo"]
body:
  - type: markdown
    attributes:
      value: |
        **Regra R3:** divergência com o device real **interrompe o fluxo** — nunca
        "consertar" o app com palpite. A fonte é o aparelho (ADR-13); spec/manual
        são insumo, não produto (R1).

        **Leitura × escrita:** leitura pura é livre (CLI de campo
        `--real --i-know-what-im-doing`); escrita no aparelho só com as travas
        (ADR-5 + gate H2) — skill `hardware-dev`.
  - type: dropdown
    id: fase
    attributes:
      label: "Fase/área afetada"
      options:
        - "boot/scan (PROTOCOL §13.10)"
        - "knob/set-param (§13.11)"
        - "save (§13.12)"
        - "upload de IR (§13.7)"
        - "globals / 12001012 / banco user (GP100_DEVICE §6)"
        - "outra / nova"
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: "Contexto medido"
      description: "Quando e como o aparelho foi consultado (data, método, sessão)"
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: "Evidência"
      description: "Wire log (arquivo + timestamp t em ms), hex, endereços — anexe o log, não solte hex em conversa"
      placeholder: "captures/sessaoN.jsonl @88.07s · OUT 12|12001002 · data=0000…"
    validations:
      required: true
  - type: textarea
    id: impacto
    attributes:
      label: "Impacto (modelo/§13/GP100_DEVICE)"
      description: "O que muda na fonte canônica se a leitura se confirmar; se quebra fixture/golden de FORMA"
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: "Escopo"
      description: "Evidência → modelo + guard + teste → só então UI (ordem obrigatória)"
    validations:
      required: true
  - type: textarea
    id: fora_de_escopo
    attributes:
      label: "Fora de escopo"
      description: "O que NÃO entra (escrita real? UI completa? outra fase?)"
    validations:
      required: true
  - type: textarea
    id: plano_de_teste
    attributes:
      label: "Plano de teste"
      description: "Como a leitura será re-confirmada (replay/contrato/mock/gate de campo)"
    validations:
      required: true
  - type: textarea
    id: referencias
    attributes:
      label: "Referências"
      description: "docs/GP100_DEVICE.md, docs/PROTOCOL.md §13.x, DECISIONS (ADR-4/5/13), skills hardware-dev, device-reference"
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: "🤖 Prompt do agente (pronto para colar)"
      description: "Auto-suficiente — inclui a trava: leitura livre, escrita travada, evidência obrigatória"
      render: text
    validations:
      required: true
  - type: checkboxes
    id: validacao
    attributes:
      label: "Checklist de validação da entrega"
      options:
        - label: "Fato confirmado no aparelho (medição com data e método, não dedução do mock)"
        - label: "Fonte canônica atualizada (GP100_DEVICE e/ou PROTOCOL §13) com a evidência"
        - label: "Guard + teste acompanham o modelo novo"
        - label: "Nenhum byte de escrita enviado ao aparelho fora das travas (ADR-5)"
