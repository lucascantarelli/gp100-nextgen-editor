[package]
name = "gp100-ui"
version = "0.1.0"
edition = "2021"
description = "Backend desktop (Tauri 2) do GP-100 NextGen Editor — commands de device sobre o gp100-core."
publish = false

# FORA do workspace gnu (ADR-7): Tauri 2 exige MSVC no Windows. Usa as MESMAS
# versões de deps do workspace (pinadas aqui por decisão deliberada; drift de
# versão é review/CI). Toolchain de dev/campo da UI: stable-msvc.

[lib]
name = "gp100_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gp100-core = { path = "../gp100-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Espelha a feature do core (RealDevice): default OFF — a UI de desenvolvimento
# fala com o MOCK (ADR-4/ADR-5); o backend real é build de campo pós-H1.
# custom-protocol: ligada pelo `tauri build` (assets de produção em file://).
custom-protocol = ["tauri/custom-protocol"]
real-device = ["gp100-core/real-device"]

[lints.rust]
missing_docs = "deny"
